[package]
name = "wavekit-chan"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3
