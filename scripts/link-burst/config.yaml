sources:
  - id: link-burst-fake
    type: rtl_tcp
    host: fake
    port: 1234
    stallTimeoutMs: 0
    burstAbsorber:
      seconds: 2
    caps:
      kind: iq
      sampleRate: 2048000
      format: U8_IQ
      centerFreq: 433920000
    sdrHost:
      apiUrl: http://fake:1235
      endpointSelection: off
decoders:
  - id: link-burst-slow-sink
    type: rtl433
    enabled: true
    sourceId: link-burst-fake
    useChannelizer: false
    options:
      inputSampleRate: 2048000
      targetSampleRate: 1000000
      extraArgs: [link-burst-slow-sink]
  # Always-on sibling: unmarked, so the shim runs the real rtl_433 at full speed.
  - id: link-burst-sibling
    type: rtl433
    enabled: true
    sourceId: link-burst-fake
    useChannelizer: false
    options:
      inputSampleRate: 2048000
      targetSampleRate: 1000000
decoderPolicy:
  catalogue: true
  rateRaise: false
tunerRelay:
  enabled: false
audio:
  monitoring: false
api:
  host: "::"
  port: 3000
liveDemod:
  enabled: false
digitalVoice:
  enabled: false
health:
  bandSuspension: false
channelizer:
  enabled: true
stateDir: /tmp/link-burst-state
