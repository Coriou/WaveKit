# WaveKit image: keep the system journal across reboots, so a power loss or a
# crash can be told apart from a requested reboot (see wavekit-boot-report).
# Capped for an SD card: at most 48 MB in 8 MB files, a month of history, and
# never within 256 MB of a full card. journald syncs every 5 min by default and
# immediately on critical messages; kernel writeback usually reaches the card
# within about 30 s, which bounds what a sudden power loss can drop.
[Journal]
Storage=persistent
SystemMaxUse=48M
SystemMaxFileSize=8M
SystemKeepFree=256M
MaxRetentionSec=1month
