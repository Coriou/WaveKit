<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#111c19" />
		<title>WaveKit Receiver</title>
		<link
			rel="preload"
			href="brand/D-DINCondensed-Bold.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="brand/NotoSans-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="stylesheet" href="app.css" />
		<link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
		<script type="module" src="app.js"></script>
	</head>
	<body data-empty="true">
		<div class="panel">
			<header class="nameplate">
				<h1 class="nameplate__title">
					<img
						class="nameplate__logo"
						src="brand/wavekit-wordmark-on-dark.svg"
						alt="WaveKit"
						width="680"
						height="164"
					/>
					<span class="nameplate__page">Receiver</span>
				</h1>
				<p class="nameplate__host" id="host-name">This Pi</p>
				<p class="link" id="link" data-state="connecting" role="status">
					<span class="lamp" aria-hidden="true"></span>
					<span id="link-text">Connecting</span>
				</p>
			</header>

			<main class="layout">
				<section
					class="screen screen--status"
					id="screen"
					data-state="unknown"
					aria-labelledby="verdict"
				>
					<div class="screen__verdict">
						<h2 class="verdict" id="verdict" aria-live="polite">
							Waiting for data
						</h2>
						<p class="verdict__detail" id="verdict-detail">
							No measurement yet.
						</p>
					</div>
					<div class="screen__rate">
						<p class="rate">
							<span id="rate-value">—</span>
							<span class="rate__unit" id="rate-unit"></span>
						</p>
						<p class="rate__sub" id="rate-sub"></p>
					</div>

					<figure
						class="scope"
						id="scope"
						tabindex="0"
						aria-labelledby="scope-title"
						aria-describedby="marker-readout"
					>
						<figcaption class="visually-hidden" id="scope-title">
							Sample flow, CPU, memory, SoC temperature and under-voltage over
							the last five minutes. Use the arrow keys to read values.
						</figcaption>
						<div class="channel channel--flow" data-key="flow">
							<p class="channel__name">Sample flow</p>
							<p class="channel__value" id="flow-scale"></p>
							<div class="channel__frame">
								<svg
									class="channel__plot"
									viewBox="0 0 600 160"
									preserveAspectRatio="none"
									aria-hidden="true"
								>
									<defs>
										<linearGradient id="flow-fade" x1="0" y1="0" x2="0" y2="1">
											<stop class="fade-top" offset="0" />
											<stop class="fade-bottom" offset="1" />
										</linearGradient>
									</defs>
									<g class="graticule" data-rows="5"></g>
									<path class="plot__area" d="" />
									<line class="plot__expected" x1="0" x2="600" y1="0" y2="0" />
									<path class="plot__trace" d="" />
									<line class="plot__start" x1="0" x2="0" y1="0" y2="160" />
								</svg>
								<p class="plot__label plot__label--expected" hidden></p>
								<p class="plot__label plot__label--start" hidden></p>
							</div>
						</div>
						<div class="channel" data-key="cpu">
							<p class="channel__name">CPU</p>
							<p class="channel__value"></p>
							<svg
								class="channel__plot"
								viewBox="0 0 600 40"
								preserveAspectRatio="none"
								aria-hidden="true"
							>
								<g class="graticule" data-rows="2"></g>
								<path class="plot__trace" d="" />
							</svg>
						</div>
						<div class="channel" data-key="memory">
							<p class="channel__name">Memory</p>
							<p class="channel__value"></p>
							<svg
								class="channel__plot"
								viewBox="0 0 600 40"
								preserveAspectRatio="none"
								aria-hidden="true"
							>
								<g class="graticule" data-rows="2"></g>
								<path class="plot__trace" d="" />
							</svg>
						</div>
						<div class="channel" data-key="temperature">
							<p class="channel__name">SoC temp.</p>
							<p class="channel__value"></p>
							<svg
								class="channel__plot"
								viewBox="0 0 600 40"
								preserveAspectRatio="none"
								aria-hidden="true"
							>
								<g class="graticule" data-rows="2"></g>
								<path class="plot__trace" d="" />
							</svg>
						</div>
						<div class="channel channel--lane" data-key="dips">
							<p class="channel__name">Power dips</p>
							<p class="channel__value"></p>
							<svg
								class="channel__plot"
								viewBox="0 0 600 16"
								preserveAspectRatio="none"
								aria-hidden="true"
							>
								<line class="lane__base" x1="0" x2="600" y1="15.5" y2="15.5" />
								<path class="lane__ticks" d="" />
							</svg>
						</div>
						<p class="scope__axis" aria-hidden="true">
							<span>5 min ago</span><span>now</span>
						</p>
						<div class="scope__marker" id="marker" hidden></div>
						<p class="scope__readout" id="marker-readout" hidden></p>
					</figure>
				</section>

				<div class="side">
					<section
						class="setup"
						id="setup-section"
						aria-labelledby="setup-heading"
						hidden
					>
						<h2 class="legend" id="setup-heading">First-boot setup</h2>
						<p class="setup__line" id="setup" data-state="unknown">
							<span class="lamp" aria-hidden="true"></span>
							<span id="setup-text">—</span>
						</p>
					</section>

					<section aria-labelledby="stream-heading">
						<h2 class="legend" id="stream-heading">IQ stream</h2>
						<div class="endpoint">
							<code class="endpoint__url" id="endpoint">—</code>
							<button class="endpoint__copy" id="endpoint-copy" type="button">
								Copy
							</button>
						</div>
						<dl class="rows">
							<div class="row" id="row-dongle" data-state="unknown">
								<dt>Dongle</dt>
								<dd>
									<span class="row__value"
										><span class="lamp" aria-hidden="true"></span
										><span class="row__text">—</span></span
									><span class="row__sub"></span>
								</dd>
							</div>
							<div class="row" id="row-tuning">
								<dt>Tuning</dt>
								<dd>
									<span class="row__value"
										><span class="row__text">—</span></span
									><span class="row__sub"></span>
								</dd>
							</div>
							<div class="row">
								<dt>Clients</dt>
								<dd>
									<ul class="clients" id="clients"></ul>
								</dd>
							</div>
						</dl>
					</section>

					<section aria-labelledby="host-heading">
						<h2 class="legend" id="host-heading">This Pi</h2>
						<dl class="rows">
							<div class="row" id="row-power" data-state="unknown">
								<dt>Power</dt>
								<dd>
									<span class="row__value"
										><span class="lamp" aria-hidden="true"></span
										><span class="row__text">—</span></span
									><span class="row__sub"></span>
								</dd>
							</div>
							<div class="row" data-key="network" data-state="unknown">
								<dt>Network</dt>
								<dd>
									<span class="row__value"
										><span class="bars" aria-hidden="true"
											><span></span><span></span><span></span
											><span></span></span
										><span class="row__text">—</span></span
									><span class="row__sub"></span>
								</dd>
							</div>
							<div class="row" data-key="disk" data-state="unknown">
								<dt>Storage</dt>
								<dd>
									<span class="row__value"
										><span class="row__text">—</span></span
									><span class="row__sub"></span>
								</dd>
							</div>
							<div class="row" data-key="uptime" data-state="unknown">
								<dt>Uptime</dt>
								<dd>
									<span class="row__value"
										><span class="row__text">—</span></span
									><span class="row__sub"></span>
								</dd>
							</div>
						</dl>
					</section>
				</div>

				<details class="diagnostics" id="diagnostics">
					<summary>Diagnostics</summary>
					<div class="diagnostics__body">
						<dl class="facts" id="facts-receiver"></dl>
						<dl class="facts" id="facts-sources"></dl>
					</div>
				</details>
			</main>
		</div>
	</body>
</html>
