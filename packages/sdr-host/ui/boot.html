<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#111c19" />
		<title>WaveKit Receiver · Setup</title>
		<link
			rel="preload"
			href="brand/D-DINCondensed-Bold.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="stylesheet" href="app.css" />
		<link rel="stylesheet" href="boot.css" />
		<link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
		<script type="module" src="boot.js"></script>
	</head>
	<body>
		<div class="panel boot-panel">
			<header class="nameplate">
				<h1 class="nameplate__title">
					<img
						class="nameplate__logo"
						src="brand/wavekit-wordmark-on-dark.svg"
						alt="WaveKit"
						width="680"
						height="164"
					/>
					<span class="nameplate__page">Setup</span>
				</h1>
				<p class="nameplate__host" id="host-name">This Pi</p>
				<p class="link" id="contact" data-state="connecting" role="status">
					<span class="lamp" aria-hidden="true"></span
					><span id="contact-text">Connecting</span>
				</p>
			</header>
			<main>
				<section
					class="screen boot-screen"
					id="setup-screen"
					data-state="unknown"
				>
					<h2 class="visually-hidden">First-boot setup</h2>
					<div class="screen__verdict">
						<p class="verdict" id="setup-title" aria-live="polite">
							Checking setup
						</p>
						<p class="verdict__detail" id="setup-detail">
							The Pi reports its progress here.
						</p>
					</div>
					<ol class="steps" aria-label="Setup stages">
						<li class="step" data-phase="cloud-init" data-state="unknown">
							<span class="step__name">Pi settings</span>
							<span class="step__word">Waiting</span>
						</li>
						<li class="step" data-phase="install" data-state="unknown">
							<span class="step__name">Receiver</span>
							<span class="step__word">Waiting</span>
						</li>
						<li class="step" data-phase="publish" data-state="unknown">
							<span class="step__name">Finish</span>
							<span class="step__word">Waiting</span>
						</li>
					</ol>
					<p class="boot-clock" id="setup-clock-row" hidden>
						<span class="boot-clock__value" id="setup-clock">—</span>
						<span id="setup-age"></span>
					</p>
				</section>
				<p class="boot-note" id="setup-note">
					Setup usually takes several minutes. Keep the Pi powered and online
					until it finishes.
				</p>
				<p class="boot-open" id="receiver-link-wrap" hidden>
					<a id="receiver-link">Open receiver status</a>
				</p>
				<noscript
					><p class="boot-note">
						Enable JavaScript to follow live setup progress. Receiver status is
						available on this Pi at port 8080 after installation.
					</p></noscript
				>
			</main>
		</div>
	</body>
</html>
