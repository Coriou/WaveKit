<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tuned card, every signal type</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
body:has([data-wk-ground="paper"]:not([data-wk-theme] *)){background:#f4f0e6}
</style>
</helmet>
<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="box-sizing: border-box; min-height: 100vh; padding: 40px; background: var(--wk-bg); color: var(--wk-text); font-family: var(--wk-font-ui); display: flex; flex-direction: column; gap: 36px">
	<dc-import name="Kit" hint-size="0px,0px" style="position: absolute"></dc-import>
	<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
		<section style="display: flex; flex-direction: column; gap: 14px">
			<div style="display: flex; align-items: baseline; gap: 12px">
				<h2 class="wk-h2">{{g.title}}</h2>
				<span style="font-size: var(--wk-fs-md); color: var(--wk-text-3)">{{g.sub}}</span>
			</div>
			<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 340px)); gap: 24px; align-items: start">
				<sc-for list="{{g.cards}}" as="c" hint-placeholder-count="4">
					<dc-import name="Tuned" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" freq="{{c}}" variant="floating" hint-size="340px,360px"></dc-import>
				</sc-for>
			</div>
		</section>
	</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"mono","section":"Theme"},"ground":{"editor":"enum","options":["ink","graphite","black"],"default":"black","section":"Theme"},"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
	renderVals() {
		return {
			// theme scope: Immersive passes its theme and accent; standalone, the board's own tweaks
			wkTheme: this.props.theme === 'light' ? 'light' : 'dark', wkAccent: this.props.accent || 'mono', wkGround: this.props.theme === 'light' ? 'paper' : (this.props.ground || 'black'),
			groups: [
				{ title: 'Voice', sub: 'Digital calls and analog transmissions. Live, quiet and encrypted states. CTCSS and DCS tones when detected.', cards: [161150000, 163087500, 160625000, 118100000, 156800000, 446006250, 161425000, 145637500] },
				{ title: 'Positions and fleets', sub: 'Many stations on one channel. The card summarises, the map holds the detail.', cards: [161975000, 1090000000, 144800000] },
				{ title: 'Messages and data', sub: 'Last message in full (three lines at most), earlier ones below.', cards: [160450000, 131725000, 136975000, 869525000] },
				{ title: 'Sensors and meters', sub: 'Readings as chips. Unknown rtl_433 models fall back to humanised JSON.', cards: [433920000, 868300000, 868950000] },
				{ title: 'Nothing to decode', sub: 'Audio only, or not identified yet.', cards: [93500000, 466025000] }
			]
		};
	}
}
</script>
</body>
</html>
