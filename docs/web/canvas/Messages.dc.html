<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decoded messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
body:has([data-wk-ground="paper"]:not([data-wk-theme] *)){background:#f4f0e6}
</style>
</helmet>
<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="box-sizing: border-box; width: 100%; height: {{rootH}}; display: flex; flex-direction: column; gap: 14px; padding: {{pad}}; color: var(--wk-text); font-family: var(--wk-font-ui); font-size: var(--wk-fs-lg); background: {{rootBg}}; border-radius: {{rootRadius}}; border: {{rootBorder}}; box-shadow: {{rootShadow}}; backdrop-filter: {{rootBlur}}">
	<dc-import name="Kit" hint-size="0px,0px" style="position: absolute"></dc-import>
	<!-- title and chips sit above the scrolling cards (sticky in the app); a hairline under them, across the tuned card's lane -->
	<div style="display: flex; flex-direction: column; gap: 12px; flex: none; margin-left: {{barPull}}; padding-bottom: {{barPad}}; border-bottom: {{barLine}}">
	<header style="display: flex; align-items: center; gap: 10px; flex: none">
		<h2 class="wk-h2">{{heading}}</h2>
		<span style="display: flex; align-items: center; gap: 6px; font-size: var(--wk-fs-sm); color: {{liveFg}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>{{liveText}}</span>
		<div style="flex: 1"></div>
		<button class="wk-btn" data-variant="{{pauseVariant}}" onClick="{{togglePause}}" style="padding: 0 10px; color: var(--wk-text-2); font-weight: 400">{{pauseLabel}}</button>
		<sc-if value="{{feed}}" hint-placeholder-val="{{false}}">
			<button class="wk-icon-btn" data-close="" onClick="{{close}}" aria-label="Close activity" style="color: var(--wk-text-3)">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6l-12 12"></path></svg>
			</button>
		</sc-if>
	</header>
	<div role="radiogroup" aria-label="Show" style="display: flex; flex-wrap: {{chipWrap}}; overflow-x: auto; scrollbar-width: none; gap: 6px; flex: none">
		<sc-for list="{{chips}}" as="c" hint-placeholder-count="9">
			<button class="wk-chip" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" aria-label="{{c.label}}" title="{{c.label}}">
				<sc-if value="{{c.hasIcon}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{c.icon}}" as="p"><path d="{{p}}"></path></sc-for></svg></sc-if>
				<sc-if value="{{c.showText}}" hint-placeholder-val="{{true}}"><span>{{c.text}}</span></sc-if>
				<span style="font-weight: 400; color: var(--wk-text-3); font-variant-numeric: tabular-nums">{{c.count}}</span>
			</button>
		</sc-for>
	</div>
	</div>
	<div style="flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -4px; padding: 0 4px">
		<sc-if value="{{showEmpty}}" hint-placeholder-val="{{false}}">
			<!-- empty, off and error: one quiet block in the middle, with the way out -->
			<div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 360px; margin: 12vh auto 0; text-align: center">
				<span class="wk-tile" style="width: 44px; height: 44px; margin-bottom: 4px; color: {{emptyTone}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14l-3 -3h-7a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1h9a1 1 0 0 1 1 1v10"></path><path d="M14 15v2a1 1 0 0 1 -1 1h-7l-3 3v-10a1 1 0 0 1 1 -1h2"></path></svg></span>
				<p style="margin: 0; font-size: var(--wk-fs-xl); font-weight: 700">{{emptyTitle}}</p>
				<p style="margin: 0 0 6px; font-size: var(--wk-fs-md); line-height: 1.5; color: var(--wk-text-3)">{{emptyText}}</p>
				<sc-if value="{{emptyAction}}" hint-placeholder-val="{{true}}"><button class="wk-btn" data-variant="outline" data-size="sm">{{emptyAction}}</button></sc-if>
			</div>
		</sc-if>
		<sc-if value="{{showSkel}}" hint-placeholder-val="{{false}}">
			<!-- loading: card shapes in the columns -->
			<div role="status" aria-label="Loading messages" style="display: grid; grid-template-columns: repeat({{skelCols}}, minmax(0, 1fr)); gap: 14px; align-items: start">
				<sc-for list="{{skel}}" as="k" hint-placeholder-count="6">
					<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--wk-r-4); border: 1px solid var(--wk-line-08)">
						<span style="width: 38%; height: 14px; border-radius: var(--wk-r-2); background: var(--wk-fill)"></span>
						<span style="width: 64%; height: 20px; border-radius: var(--wk-r-2); background: var(--wk-fill)"></span>
						<span style="width: 46%; height: 12px; border-radius: var(--wk-r-2); background: var(--wk-fill)"></span>
						<span style="height: {{k.h}}; border-radius: var(--wk-r-2); background: var(--wk-fill)"></span>
					</div>
				</sc-for>
			</div>
		</sc-if>
		<div style="columns: {{cols}}; column-gap: 14px; display: {{gridDisplay}}">
			<sc-for list="{{items}}" as="x" hint-placeholder-count="6">
				<div style="break-inside: avoid; margin-bottom: 14px">
					<dc-import name="Decode" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" msg="{{x}}" on-tune="{{tune}}" hint-size="100%,240px"></dc-import>
				</div>
			</sc-for>
		</div>
	</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"mono","section":"Theme"},"ground":{"editor":"enum","options":["ink","graphite","black"],"default":"black","section":"Theme"},"variant":{"editor":"enum","options":["gallery","feed"],"default":"gallery"},"onTune":{"editor":null},"onClose":{"editor":null},"embedded":{"editor":null},"topInset":{"editor":null,"tsType":"number"},"rightInset":{"editor":null,"tsType":"number"},"leftInset":{"editor":null,"tsType":"number"},"state":{"editor":"enum","options":["cards","loading","empty","no match","error"],"default":"cards"},"phone":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1500}}'>
const CATS = [
	['voice', 'Voice', ['M9 5a3 3 0 0 1 3 -3a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3a3 3 0 0 1 -3 -3V5M8 21h8M12 17v4', 'M5 10a7 7 0 0 0 14 0']],
	['aircraft', 'Aircraft', ['M16 10h4a2 2 0 0 1 0 4h-4l-4 7h-3l2 -7h-4l-2 2h-3l2 -4l-2 -4h3l2 2h4l-2 -7h3l4 7']],
	['marine', 'Marine', ['M4 18l-1 -5h18l-2 4M5 13v-6h8l4 6M7 7v-4h-1', 'M2 20a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1']],
	['aviation', 'Aviation data', ['M4 9.5h12a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2H9l-4 3v-3H4a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2Z', 'M7 12.5h6M7 15.5h3', 'M17 3a5 5 0 0 1 5 5M17 6a2 2 0 0 1 2 2']],
	['paging', 'Paging', ['M5 5h14a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-14a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3z', 'M7 8h10a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-10a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1z', 'M6 16h2M12 16h.01M16 16h.01']],
	['aprs', 'APRS', ['M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0', 'M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0']],
	['sensors', 'Sensors', ['M12 12v.01M14.828 9.172a4 4 0 0 1 0 5.656M9.168 14.828a4 4 0 0 1 0 -5.656', 'M17.657 6.343a8 8 0 0 1 0 11.314M6.337 17.657a8 8 0 0 1 0 -11.314']],
	['mesh', 'Mesh', ['m10.82 7.2 -5.14 9.6M13.18 7.2l5.14 9.6M7 19h10', 'M9.5 5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0', 'M2 19a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0', 'M17 19a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0']]
];
const MSGS = [
	{ kind: 'call', cat: 'voice', proto: 'DMR', title: 'TG 2081', sub: 'From radio 2081045 · slot 1 · colour code 1', time: '14:02:41', freq: '161.150', live: true, fields: [['Duration', '0:12'], ['Errors', '0.4 %'], ['Talker alias', 'Port ops 3']], raw: { type: 'call_start', protocol: 'DMR', talkgroup: 2081, source: 2081045, slot: 1, colorCode: 1, encrypted: false } },
	{ kind: 'aircraft', cat: 'aircraft', proto: 'ADS-B', title: 'AFR1234', sub: 'ICAO 3944EF · Airbus A320', time: '14:02:40', freq: '1090.000', fields: [['Altitude', '36 000 ft'], ['Speed', '452 kn'], ['Heading', '284°'], ['Squawk', '4721'], ['Vertical', '0 ft/min'], ['Seen', '1 s ago']], pos: [48.7312, -3.4627], raw: { icao: '3944EF', callsign: 'AFR1234', altitude: 36000, groundSpeed: 452, track: 284, squawk: '4721', lat: 48.7312, lon: -3.4627 } },
	{ kind: 'text', cat: 'paging', proto: 'POCSAG 1200', title: 'Capcode 1234567', sub: 'Function 3 · alphanumeric', time: '14:02:39', freq: '160.450', text: 'Test page — system check 0412. Reply not required.', raw: { protocol: 'POCSAG1200', address: 1234567, function: 3, messageType: 'alpha', message: 'Test page — system check 0412. Reply not required.' } },
	{ kind: 'json', cat: 'sensors', proto: 'rtl_433', title: 'Acurite-Tower', sub: 'ID 12345 · channel A', time: '14:02:39', freq: '433.920', raw: { time: '2026-10-10 14:02:39', model: 'Acurite-Tower', id: 12345, channel: 'A', battery_ok: 1, temperature_C: 18.4, humidity: 61, mic: 'CHECKSUM' } },
	{ kind: 'vessel', cat: 'marine', proto: 'AIS', title: 'Kerlouan', sub: 'MMSI 227006760 · fishing vessel', time: '14:02:38', freq: '161.975', badge: 'Type 1', fields: [['Speed', '11.4 kn'], ['Course', '284°'], ['Status', 'Under way'], ['Destination', 'Roscoff']], pos: [48.7261, -3.9853], raw: { mmsi: 227006760, name: 'KERLOUAN', msgType: 1, sog: 11.4, cog: 284, navStatus: 0, lat: 48.7261, lon: -3.9853, destination: 'ROSCOFF' } },
	{ kind: 'text', cat: 'aviation', proto: 'ACARS', title: 'F-HBXA · flight XK4521', sub: 'Label H1 · block 4 · downlink', time: '14:02:30', freq: '131.725', mono: true, text: 'POS N48467 W003275,FL340,ETA 1447,FOB 9.2', raw: { tail: 'F-HBXA', flight: 'XK4521', label: 'H1', blockId: '4', text: 'POS N48467 W003275,FL340,ETA 1447,FOB 9.2' } },
	{ kind: 'call', cat: 'voice', proto: 'P25', title: 'TG 1201', sub: 'From radio 4410022 · phase 1', time: '14:02:12', freq: '163.088', encrypted: true, fields: [['Duration', '0:08'], ['Algorithm', 'AES-256'], ['NAC', '293']], raw: { type: 'call_end', protocol: 'P25', talkgroup: 1201, source: 4410022, encrypted: true, durationMs: 8120 } },
	{ kind: 'text', cat: 'mesh', proto: 'Meshtastic', title: 'Harbour relay', sub: 'Node !a3f2c1 → everyone · LongFast', time: '14:01:58', freq: '869.525', text: 'Anyone on the coast tonight? Signal is great from the lighthouse.', fields: [['Hops', '2 of 3'], ['SNR', '6.5 dB'], ['RSSI', '−97 dBm']], raw: { from: '!a3f2c1', to: '^all', channel: 'LongFast', portnum: 'TEXT_MESSAGE_APP', payload: 'Anyone on the coast tonight?', hopsAway: 2, snr: 6.5, rssi: -97 } },
	{ kind: 'position', cat: 'aprs', proto: 'APRS', title: 'F4ABC-9', sub: 'Mobile · via WIDE1-1, WIDE2-1', time: '14:01:44', freq: '144.800', text: 'On the way home. QRV 145.500', fields: [['Speed', '52 km/h'], ['Course', '112°'], ['Altitude', '38 m']], pos: [48.3904, -4.4861], raw: { source: 'F4ABC-9', destination: 'APDR16', path: ['WIDE1-1', 'WIDE2-1'], lat: 48.3904, lon: -4.4861, speed: 52, course: 112, comment: 'On the way home. QRV 145.500' } },
	{ kind: 'json', cat: 'sensors', proto: 'rtl_433', title: 'Toyota TPMS', sub: 'ID a1b2c3d4', time: '14:01:40', freq: '433.920', raw: { time: '2026-10-10 14:01:40', model: 'Toyota', type: 'TPMS', id: 'a1b2c3d4', pressure_kPa: 232.5, temperature_C: 21, status: 128, mic: 'CRC' } },
	{ kind: 'text', cat: 'aviation', proto: 'VDL2 · CPDLC', title: 'F-GZTB · flight XK8801', sub: 'Uplink from ground station LFRB', time: '14:01:33', freq: '136.975', mono: true, text: 'CLIMB TO AND MAINTAIN FL360', raw: { tail: 'F-GZTB', flight: 'XK8801', app: 'CPDLC', direction: 'uplink', msg: 'CLIMB TO AND MAINTAIN FL360' } },
	{ kind: 'text', cat: 'paging', proto: 'POCSAG 512', title: 'Capcode 1234560', sub: 'Function 0 · numeric', time: '14:01:20', freq: '160.450', mono: true, text: '0612 44 18', raw: { protocol: 'POCSAG512', address: 1234560, function: 0, messageType: 'numeric', message: '0612 44 18' } },
	{ kind: 'telemetry', cat: 'aprs', proto: 'APRS weather', title: 'F6XYZ-13', sub: 'Weather station · Brest', time: '14:00:59', freq: '144.800', fields: [['Temperature', '14.2 °C'], ['Humidity', '78 %'], ['Wind', '18 km/h W'], ['Gusts', '31 km/h'], ['Pressure', '1012.4 hPa'], ['Rain 1 h', '0.3 mm']], raw: { source: 'F6XYZ-13', weather: { temperature: 14.2, humidity: 78, windSpeed: 18, windDir: 270, gust: 31, pressure: 1012.4, rain1h: 0.3 } } },
	{ kind: 'text', cat: 'paging', proto: 'POCSAG 1200', title: 'Capcode 1234567', sub: 'Function 1 · tone only', time: '14:00:41', freq: '160.450', toneOnly: true, raw: { protocol: 'POCSAG1200', address: 1234567, function: 1, messageType: 'tone' } },
	{ kind: 'json', cat: 'sensors', proto: 'rtl_433', title: 'Generic-Remote', sub: 'Unknown device · no renderer yet', time: '14:00:17', freq: '433.920', raw: { time: '2026-10-10 14:00:17', model: 'Generic-Remote', id: 4128, cmd: 5, tristate: 'ZZX0FX10ZZ' } },
	{ kind: 'text', cat: 'paging', proto: 'DTMF', title: 'Digits', sub: 'In-band tones on 160.625', time: '13:59:52', freq: '160.625', mono: true, text: '*72#1405', raw: { protocol: 'DTMF', digits: '*72#1405' } }
];

class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = { cat: 'all', paused: false };
	}
	renderVals() {
		const feed = this.props.variant === 'feed', emb = !!this.props.embedded;
		const cat = this.state.cat;
		const st = this.props.state || 'cards', phone = !!this.props.phone, lane = this.props.leftInset || 0;
		const empty = { empty: ['Nothing decoded yet', 'Messages appear here as the decoders hear them: pagers, aircraft, ships, APRS, sensors and digital voice.', ''], 'no match': ['Nothing matches yet', 'New matches appear here as they are decoded.', 'Clear search'], error: ['Could not load messages', 'The receiver did not answer. Live messages resume once it does.', 'Try again'] }[st];
		const count = id => MSGS.filter(m => id === 'all' || m.cat === id).length;
		const chip = (id, label, icon) => {
			const on = cat === id;
			return { label, text: label, icon: icon || [], hasIcon: !!icon, showText: !feed || !icon, count: String(count(id)), on, pick: () => this.setState({ cat: id }) };
		};
		return {
			// theme scope: Immersive passes its theme and accent; standalone, the board's own tweaks
			wkTheme: this.props.theme === 'light' ? 'light' : 'dark', wkAccent: this.props.accent || 'mono', wkGround: this.props.theme === 'light' ? 'paper' : (this.props.ground || 'black'),
			feed,
			// gallery as the dock's third view (Immersive): fills the window under the top islands, above the dock, beside a drawer
			heading: feed ? 'Activity' : 'Messages',
			rootH: feed || emb ? '100%' : 'auto',
			// the tuned card's lane (Immersive passes it): the cards keep clear of the card, the title row spans it
			pad: feed ? '18px' : phone ? '16px' : emb ? (this.props.topInset ?? 88) + 'px ' + (40 + (this.props.rightInset || 0)) + 'px 104px ' + (lane || 40) + 'px' : '40px',
			barPull: lane ? (40 - lane) + 'px' : '0',
			barPad: feed ? '0' : '12px', barLine: feed ? '0' : '1px solid var(--wk-line-08)',
			pauseVariant: feed ? 'outline' : 'ghost',
			// phone: one row of chips that scrolls sideways
			chipWrap: phone ? 'nowrap' : 'wrap',
			showEmpty: !!empty, emptyTitle: empty ? empty[0] : '', emptyText: empty ? empty[1] : '', emptyAction: empty ? empty[2] : '', emptyTone: st === 'error' ? 'var(--wk-amber)' : 'var(--wk-text-3)',
			showSkel: st === 'loading', skelCols: feed || phone ? 1 : 3, skel: Array.from({ length: feed || phone ? 3 : 6 }, (_, i) => ({ h: i % 3 === 0 ? '88px' : '44px' })),
			gridDisplay: st === 'cards' ? 'block' : 'none',
			rootBg: feed ? 'var(--wk-glass-panel)' : 'var(--wk-bg)',
			rootRadius: feed ? 'var(--wk-r-5)' : '0',
			rootBorder: feed ? '1px solid var(--wk-line-14)' : '0',
			rootShadow: feed ? 'var(--wk-e3)' : 'none',
			rootBlur: feed ? 'var(--wk-blur)' : 'none',
			cols: feed || phone ? '1' : '3 340px',
			chips: [chip('all', 'All')].concat(CATS.map(([id, label, icon]) => chip(id, label, icon))),
			items: MSGS.filter(m => cat === 'all' || m.cat === cat),
			tune: f => this.props.onTune && this.props.onTune(f),
			close: () => this.props.onClose && this.props.onClose(),
			liveText: this.state.paused ? 'Paused' : 'Live',
			liveFg: this.state.paused ? 'var(--wk-amber)' : 'var(--wk-accent)',
			pauseLabel: this.state.paused ? 'Resume' : 'Pause',
			togglePause: () => this.setState({ paused: !this.state.paused })
		};
	}
}
</script>
</body>
</html>
