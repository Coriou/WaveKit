<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" style="box-sizing: border-box; width: 100%; height: {{rootH}}; display: flex; flex-direction: column; gap: 14px; padding: {{pad}}; color: var(--wk-text); font-family: 'Noto Sans', system-ui, sans-serif; font-size: 14px; background: {{rootBg}}; border-radius: {{rootRadius}}; border: {{rootBorder}}; box-shadow: {{rootShadow}}; backdrop-filter: {{rootBlur}}">
	<header style="display: flex; align-items: center; gap: 10px; flex: none">
		<h2 style="margin: 0; font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .02em">Activity</h2>
		<span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: {{liveFg}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>{{liveText}}</span>
		<div style="flex: 1"></div>
		<button onClick="{{togglePause}}" style="font: inherit; cursor: pointer; height: 32px; padding: 0 10px; border: 1px solid rgba(var(--wk-line-rgb),.18); border-radius: 6px; background: transparent; color: var(--wk-text-2); font-size: 12.5px">{{pauseLabel}}</button>
		<sc-if value="{{feed}}" hint-placeholder-val="{{false}}">
			<button onClick="{{close}}" aria-label="Close activity" style="font: inherit; cursor: pointer; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--wk-text-3); display: grid; place-items: center">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6l-12 12"></path></svg>
			</button>
		</sc-if>
	</header>
	<div role="radiogroup" aria-label="Show" style="display: flex; flex-wrap: wrap; gap: 6px; flex: none">
		<sc-for list="{{chips}}" as="c" hint-placeholder-count="9">
			<button role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" aria-label="{{c.label}}" title="{{c.label}}" style="font: inherit; cursor: pointer; height: 32px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">
				<sc-if value="{{c.hasIcon}}" hint-placeholder-val="{{true}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{c.icon}}" as="p"><path d="{{p}}"></path></sc-for></svg></sc-if>
				<sc-if value="{{c.showText}}" hint-placeholder-val="{{true}}"><span>{{c.text}}</span></sc-if>
				<span style="font-weight: 400; color: var(--wk-text-3); font-variant-numeric: tabular-nums">{{c.count}}</span>
			</button>
		</sc-for>
	</div>
	<div style="flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -4px; padding: 0 4px">
		<div style="columns: {{cols}}; column-gap: 14px">
			<sc-for list="{{items}}" as="x" hint-placeholder-count="6">
				<div style="break-inside: avoid; margin-bottom: 14px">
					<dc-import name="Decode" theme="{{wkTheme}}" accent="{{wkAccent}}" msg="{{x}}" on-tune="{{tune}}" hint-size="100%,240px"></dc-import>
				</div>
			</sc-for>
		</div>
	</div>
</div>

		this.state = { cat: 'all', paused: false };
	}
	renderVals() {
		const feed = this.props.variant === 'feed';
		const cat = this.state.cat;
		const count = id => MSGS.filter(m => id === 'all' || m.cat === id).length;
		const chip = (id, label, icon) => {
			const on = cat === id;
			return { label, text: label, icon: icon || [], hasIcon: !!icon, showText: !feed || !icon, count: String(count(id)), on, border: on ? 'rgba(var(--wk-accent-rgb),.55)' : 'rgba(var(--wk-line-rgb),.18)', bg: on ? 'rgba(var(--wk-accent-rgb),.12)' : 'transparent', fg: on ? 'var(--wk-accent)' : 'var(--wk-text-2)', pick: () => this.setState({ cat: id }) };

			tune: f => this.props.onTune && this.props.onTune(f),
			close: () => this.props.onClose && this.props.onClose(),
			liveText: this.state.paused ? 'Paused' : 'Live',
			liveFg: this.state.paused ? 'var(--wk-amber)' : 'var(--wk-accent)',
			pauseLabel: this.state.paused ? 'Resume' : 'Pause',
