<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="display: flex; flex-direction: {{dir}}; gap: 8px; width: {{width}}; color: var(--wk-text); font-family: 'Noto Sans', system-ui, sans-serif; font-size: 14px">
	<div style="height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 10px; border-radius: 12px; background: var(--wk-glass); border: 1px solid rgba(var(--wk-line-rgb),.14); box-shadow: inset 0 1px 0 var(--wk-glass-hi), var(--wk-shadow); backdrop-filter: blur(22px) var(--wk-glass-fx)">
		<button onClick="{{toggleListen}}" aria-pressed="{{listening}}" aria-label="{{listenLabel}}" style="font: inherit; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 6px; display: grid; place-items: center; border: 1px solid {{btnBorder}}; background: {{btnBg}}; color: {{btnFg}}; transition: background .15s">
			<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15a2 2 0 0 1 2 -2h1a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-1a2 2 0 0 1 -2 -2z"></path><path d="M15 15a2 2 0 0 1 2 -2h1a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-1a2 2 0 0 1 -2 -2z"></path><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path></svg>
		</button>
		<div style="flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 6px">
			<div style="display: flex; align-items: baseline; gap: 8px; white-space: nowrap">
				<span style="font-weight: 700">{{title}}</span>
				<sc-if value="{{notFollowing}}" hint-placeholder-val="{{true}}"><span style="font-size: 12.5px; color: var(--wk-text-3); overflow: hidden; text-overflow: ellipsis">{{subtitle}}</span></sc-if>
				<sc-if value="{{following}}" hint-placeholder-val="{{false}}"><span title="Live audio follows the scan: you hear each hop and every signal it holds on" style="display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--wk-accent); overflow: hidden; text-overflow: ellipsis"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 12h-8a1 1 0 1 0 -1 1v8a9 9 0 0 0 9 -9"></path><path d="M16 9a5 5 0 1 0 -7 7"></path><path d="M20.486 9a9 9 0 1 0 -11.482 11.495"></path></svg>Following the scan</span></sc-if>
			</div>
			<div style="position: relative; height: 6px; border-radius: 3px; background: var(--wk-fill); overflow: hidden" aria-hidden="true">
				<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{lvlPct}}%; background: {{lvlColor}}; transition: width .09s linear"></div>
				<div style="position: absolute; top: 0; bottom: 0; left: {{sqPct}}%; width: 2px; background: var(--wk-amber)"></div>
			</div>
		</div>
		<button onClick="{{toggle}}" aria-expanded="{{expanded}}" aria-label="Audio options" style="font: inherit; cursor: pointer; width: 36px; height: 36px; border: 0; border-radius: 6px; display: grid; place-items: center; color: var(--wk-text-3); background: {{chipBg}}">
			<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{chev}}deg); transition: transform .2s"><path d="M6 15l6 -6l6 6"></path></svg>
		</button>
	</div>

	<sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
		<div style="box-sizing: border-box; max-height: calc(100vh - 120px); overflow-y: auto; overscroll-behavior: contain; padding: 20px; border-radius: 12px; background: var(--wk-glass-panel); border: 1px solid rgba(var(--wk-line-rgb),.14); box-shadow: inset 0 1px 0 var(--wk-glass-hi), var(--wk-shadow-lg); backdrop-filter: blur(24px) var(--wk-glass-fx); display: flex; flex-direction: column; gap: 22px">

			<div style="display: flex; flex-direction: column; gap: 10px">
				<div style="display: flex; align-items: center; gap: 8px">
					<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--wk-text-3)">Squelch</span>
					<span style="height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 700; line-height: 22px; background: {{stateBg}}; color: {{stateFg}}">{{sqState}}</span>
					<div style="flex: 1"></div>
					<button aria-pressed="{{sqAuto}}" onClick="{{autoSq}}" style="font: inherit; cursor: pointer; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 700; border: 1px solid {{autoBorder}}; background: {{autoBg}}; color: {{autoFg}}">Auto</button>
					<button onClick="{{offSq}}" style="font: inherit; cursor: pointer; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 700; border: 1px solid rgba(var(--wk-line-rgb),.18); background: transparent; color: var(--wk-text-2)">Off</button>
				</div>
				<div style="position: relative; height: 44px; border-radius: 8px; background: var(--wk-well); overflow: hidden">
					<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{lvlPct}}%; background: {{meterFill}}; transition: width .09s linear"></div>
					<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{sqPct}}%; background: repeating-linear-gradient(135deg, var(--wk-well-glass) 0 6px, transparent 6px 12px)"></div>
					<div style="position: absolute; top: 0; bottom: 0; left: {{sqPct}}%; width: 2px; margin-left: -1px; background: var(--wk-amber)"></div>
					<div style="position: absolute; top: 50%; left: {{sqPct}}%; width: 14px; height: 24px; margin: -12px 0 0 -7px; border-radius: 5px; background: var(--wk-amber)"></div>
					<input type="range" min="-120" max="-20" step="1" value="{{sq}}" onChange="{{onSq}}" aria-label="Squelch threshold" aria-valuetext="{{sqText}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize">
				</div>
				<div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--wk-text-3); font-variant-numeric: tabular-nums">
					<span>{{sqText}}</span>
					<span>Signal {{lvlText}}</span>
				</div>
				<span style="font-size: 12.5px; color: var(--wk-text-3); line-height: 1.45">Drag the line just above the noise to silence it. Auto keeps it 6 dB over the noise floor as conditions change.</span>
				<sc-if value="{{hasTone}}" hint-placeholder-val="{{false}}">
					<button aria-pressed="{{toneSq}}" onClick="{{toggleToneSq}}" style="font: inherit; color: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 8px 12px; border: 0; border-radius: 8px; background: var(--wk-fill)">
						<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
							<span style="font-weight: 700">Tone squelch <span style="font-weight: 400; color: var(--wk-accent)">· {{toneText}} detected</span></span>
							<span style="font-size: 12.5px; color: var(--wk-text-3)">{{toneSub}}</span>
						</span>
						<span style="position: relative; width: 36px; height: 20px; flex: none; border-radius: 10px; background: {{toneTrack}}"><span style="position: absolute; top: 2px; left: {{toneKnob}}px; width: 16px; height: 16px; border-radius: 50%; background: var(--wk-knob)"></span></span>
					</button>
				</sc-if>
			</div>

			<div style="display: flex; flex-direction: column; gap: 6px">
				<div style="display: flex; justify-content: space-between">
					<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--wk-text-3)">Volume</span>
					<span style="font-weight: 700; font-variant-numeric: tabular-nums">{{vol}}%</span>
				</div>
				<div style="position: relative; height: 28px">
					<div style="position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--wk-line-solid)"></div>
					<div style="position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--wk-accent); width: {{vol}}%"></div>
					<div style="position: absolute; top: 6px; left: {{vol}}%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--wk-knob); box-shadow: 0 0 0 4px rgba(var(--wk-accent-rgb),.18)"></div>
					<input type="range" min="0" max="100" step="1" value="{{vol}}" onChange="{{onVol}}" aria-label="Volume" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize">
				</div>
			</div>

			<div style="display: flex; flex-direction: column; gap: 10px">
				<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--wk-text-3)">What you hear</span>
				<div role="radiogroup" aria-label="Audio source" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 6px; background: var(--wk-well)">
					<sc-for list="{{srcs}}" as="s" hint-placeholder-count="3">
						<button role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="font: inherit; cursor: pointer; height: 34px; border: 0; border-radius: 4px; font-size: 13px; font-weight: 700; background: {{s.bg}}; color: {{s.fg}}">{{s.label}}</button>
					</sc-for>
				</div>
				<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--wk-fill); font-size: 13px; color: var(--wk-text-2)">
					<span style="width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--wk-accent)"></span>
					<span>{{srcHint}}</span>
				</div>
			</div>

			<div style="display: flex; flex-direction: column; gap: 12px">
				<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--wk-text-3)">Sound</span>
				<sc-for list="{{segs}}" as="g" hint-placeholder-count="2">
					<div style="display: flex; align-items: center; gap: 12px">
						<span style="flex: 1; font-weight: 700">{{g.label}}</span>
						<div role="radiogroup" aria-label="{{g.label}}" style="display: flex; gap: 2px; padding: 3px; border-radius: 6px; background: var(--wk-well)">
							<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
								<button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="font: inherit; cursor: pointer; height: 28px; padding: 0 11px; border: 0; border-radius: 4px; font-size: 12.5px; font-weight: 700; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button>
							</sc-for>
						</div>
					</div>
				</sc-for>
				<sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
					<button aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="font: inherit; color: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; min-height: 44px; border: 0; background: transparent; padding: 0">
						<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
							<span style="font-weight: 700">{{t.label}}</span>
							<span style="font-size: 12.5px; color: var(--wk-text-3)">{{t.sub}}</span>
						</span>
						<span style="position: relative; width: 36px; height: 20px; flex: none; border-radius: 10px; background: {{t.track}}">
							<span style="position: absolute; top: 2px; left: {{t.knob}}px; width: 16px; height: 16px; border-radius: 50%; background: var(--wk-knob)"></span>
						</span>
					</button>
				</sc-for>
			</div>

			<div style="display: flex; align-items: center; gap: 12px; padding-top: 4px; border-top: 1px solid rgba(var(--wk-line-rgb),.08)">
				<button aria-pressed="{{rec}}" onClick="{{toggleRec}}" style="font: inherit; cursor: pointer; height: 40px; padding: 0 14px 0 12px; margin-top: 12px; border-radius: 6px; border: 1px solid {{recBorder}}; background: {{recBg}}; color: var(--wk-text); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px">
					<span style="width: 10px; height: 10px; border-radius: 50%; background: var(--wk-danger)"></span>{{recLabel}}
				</button>
				<div style="flex: 1"></div>
				<span style="margin-top: 12px; font-size: 12.5px; color: var(--wk-text-3); font-variant-numeric: tabular-nums">Latency ≈ 180 ms</span>
			</div>
			<button class="wk-setlink" onClick="{{openSettings}}" style="font: inherit; cursor: pointer; align-self: flex-start; display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 6px 0 8px; margin: -6px 0 -6px -8px; border: 0; border-radius: 6px; background: transparent; color: var(--wk-accent); font-size: 13px; font-weight: 700">All audio settings<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"></path></svg></button>
		</div>
	</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"phosphor","section":"Theme"},"ground":{"editor":"enum","options":["ink","graphite","black"],"default":"ink","section":"Theme"},"values":{"editor":null},"onSet":{"editor":null},"onToggle":{"editor":null},"onSettings":{"editor":null},"expanded":{"editor":"boolean","default":true},"direction":{"editor":"enum","options":["down","up"],"default":"down"},"following":{"editor":"boolean","default":false},"$preview":{"width":440,"height":760}}'>
const FLOOR = -108;
const pc = db => Math.max(0, Math.min(100, (db + 120) / 100 * 100));
const dbt = db => String(Math.round(db)).replace('-', '−') + ' dB';
const sw = on => ({ on, track: on ? 'var(--wk-accent)' : 'var(--wk-track)', knob: on ? 18 : 2 });
const seg = (cur, id) => ({ on: cur === id, bg: cur === id ? 'var(--wk-fill)' : 'transparent', fg: cur === id ? 'var(--wk-accent)' : 'var(--wk-text-3)' });

class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = { listening: true, vol: 72, sq: -102, sqAuto: true, src: 'auto', agc: 'slow', deemph: 'off', hp: true, nr: false, rec: false, toneSq: false, tone: '', base: -57, digital: true, call: 'TG 2081 · radio 2081045', modeLabel: 'NFM', open: true, lvl: -60 };
	}
	get(k) { const v = this.props.values; return v && v[k] !== undefined ? v[k] : this.state[k]; }
	set(k, v) { if (this.props.onSet) this.props.onSet(k, v); else this.setState({ [k]: v }); }
	componentDidMount() {
		this.timer = setInterval(() => {
			const base = this.get('base');
			const on = base > -100 && Math.sin(Date.now() / 1700) > -0.35;
			const target = on ? base + (Math.random() - 0.5) * 7 : FLOOR + (Math.random() - 0.5) * 5;
			this.setState({ lvl: this.state.lvl * 0.55 + target * 0.45 });
		}, 90);
	}
	componentWillUnmount() { clearInterval(this.timer); }
	renderVals() {
		const listening = this.get('listening'), sqAuto = this.get('sqAuto');
		const sq = sqAuto ? FLOOR + 6 : this.get('sq');
		const lvl = this.state.lvl;
		const off = sq <= -120;
		const open = off || lvl > sq;
		const digital = this.get('digital'), src = this.get('src');
		const playsDigital = src === 'digital' || (src === 'auto' && digital);
		const expanded = this.props.onToggle ? !!this.props.expanded : this.state.open;
		const agc = this.get('agc'), de = this.get('deemph');
		const rec = this.get('rec');
		const flag = (k, label, sub) => ({ label, sub, ...sw(this.get(k)), pick: () => this.set(k, !this.get(k)) });
		return {
			// theme scope: Immersive passes its theme and accent; standalone, the board's own tweaks
			wkTheme: this.props.theme === 'light' ? 'light' : 'dark', wkAccent: this.props.accent || 'phosphor', wkGround: this.props.theme === 'light' ? 'paper' : (this.props.ground || 'ink'),
			openSettings: () => { if (this.props.onSettings) this.props.onSettings(); },
			dir: this.props.direction === 'up' ? 'column-reverse' : 'column',
			width: expanded ? '420px' : '340px',
			expanded,
			chev: this.props.direction === 'up' ? (expanded ? 180 : 0) : (expanded ? 0 : 180),
			chipBg: expanded ? 'var(--wk-fill)' : 'transparent',
			toggle: () => this.props.onToggle ? this.props.onToggle() : this.setState({ open: !this.state.open }),
			listening,
			listenLabel: listening ? 'Stop listening' : 'Listen',
			toggleListen: () => this.set('listening', !listening),
			btnBg: listening ? 'var(--wk-accent)' : 'transparent',
			btnFg: listening ? 'var(--wk-on-accent)' : 'var(--wk-accent)',
			btnBorder: listening ? 'var(--wk-accent)' : 'rgba(var(--wk-line-rgb),.18)',
			title: !listening ? 'Listen' : open ? 'Listening' : 'Squelched',
			following: listening && !!this.props.following,
			notFollowing: !(listening && this.props.following),
			subtitle: !listening ? 'Audio is off' : playsDigital ? (digital ? 'DMR voice · ' + this.get('call') : 'Waiting for digital voice') : this.get('modeLabel') + ' audio',
			lvlPct: pc(lvl),
			lvlColor: open && listening ? 'var(--wk-accent)' : 'var(--wk-text-5)',
			meterFill: open ? 'rgba(var(--wk-accent-rgb),.55)' : 'rgba(var(--wk-ink-3-rgb),.4)',
			lvlText: dbt(lvl),
			sq,
			sqPct: pc(sq),
			sqText: off ? 'Squelch off' : (sqAuto ? 'Auto · ' : 'Threshold ') + dbt(sq),
			sqState: off ? 'Off' : open ? 'Open' : 'Closed',
			stateBg: open ? 'rgba(var(--wk-accent-rgb),.14)' : 'var(--wk-fill)',
			stateFg: open ? 'var(--wk-accent)' : 'var(--wk-text-3)',
			sqAuto,
			autoSq: () => this.set('sqAuto', !sqAuto),
			offSq: () => { this.set('sqAuto', false); this.set('sq', -120); },
			onSq: e => { this.set('sqAuto', false); this.set('sq', Number(e.target.value)); },
			autoBorder: sqAuto ? 'rgba(var(--wk-accent-rgb),.55)' : 'rgba(var(--wk-line-rgb),.18)',
			autoBg: sqAuto ? 'rgba(var(--wk-accent-rgb),.12)' : 'transparent',
			autoFg: sqAuto ? 'var(--wk-accent)' : 'var(--wk-text-2)',
			vol: this.get('vol'),
			onVol: e => this.set('vol', Number(e.target.value)),
			srcs: [['auto', 'Auto'], ['analog', 'Analog'], ['digital', 'Decoded voice']].map(([id, label]) => ({ label, ...seg(src, id), pick: () => this.set('src', id) })),
			srcHint: playsDigital ? (digital ? 'DMR detected. Playing decoded voice, slot 1.' : 'No digital voice on this channel yet.') : src === 'auto' ? 'No digital voice detected. Playing ' + this.get('modeLabel') + ' audio.' : 'Playing demodulated ' + this.get('modeLabel') + ' audio.',
			hasTone: !!this.get('tone'),
			toneText: this.get('tone') || '',
			toneSq: !!this.get('toneSq'),
			toneSub: this.get('toneSq') ? 'Opens only for ' + this.get('tone') + '. Other users on this channel stay silent.' : 'Open only for this tone, ignore other users sharing the channel.',
			toneTrack: this.get('toneSq') ? 'var(--wk-accent)' : 'var(--wk-track)', toneKnob: this.get('toneSq') ? 18 : 2,
			toggleToneSq: () => this.set('toneSq', !this.get('toneSq')),
			segs: [
				{ label: 'Level control', opts: [['off', 'Off'], ['slow', 'Slow'], ['fast', 'Fast']].map(([id, label]) => ({ label, ...seg(agc, id), pick: () => this.set('agc', id) })) },
				{ label: 'De-emphasis', opts: [['off', 'Off'], ['50', '50 µs'], ['75', '75 µs']].map(([id, label]) => ({ label, ...seg(de, id), pick: () => this.set('deemph', id) })) }
			],
			toggles: [
				flag('hp', 'Cut low rumble', 'High-pass at 300 Hz'),
				flag('nr', 'Noise reduction', 'Softens hiss between words')
			],
			rec,
			recLabel: rec ? 'Recording · 0:07' : 'Record audio',
			toggleRec: () => this.set('rec', !rec),
			recBorder: rec ? 'rgba(var(--wk-danger-rgb),.55)' : 'rgba(var(--wk-line-rgb),.18)',
			recBg: rec ? 'rgba(var(--wk-danger-rgb),.12)' : 'transparent'
		};
	}
}
</script>
