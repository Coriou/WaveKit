<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings on a phone</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<style>
@font-face{font-family:"D-DIN Condensed";font-weight:400;font-display:swap;src:url("/_blob/6b6b1c5cae1637ecc473a959a8d87a96") format("woff2")}
@font-face{font-family:"D-DIN Condensed";font-weight:700;font-display:swap;src:url("/_blob/2abc64ad8670fc5303395b91efc22319") format("woff2")}
@font-face{font-family:"Noto Sans";font-weight:400;font-display:swap;src:url("/_blob/fc93658bc9e76c8f71fbef44633be7ab") format("woff2")}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0b1512; font-family: 'Noto Sans', system-ui, sans-serif">
	<dc-import name="Settings" layout="phone" scenario="{{scenario}}" storage="{{storage}}" open-at="{{openAt}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","options":["normal","pending","offline"],"default":"normal"},"storage":{"editor":"enum","options":["ok","low"],"default":"ok"},"openAt":{"editor":"enum","options":["none","receiver","storage","dec:mesh"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
	renderVals() {
		return { scenario: this.props.scenario || 'normal', storage: this.props.storage || 'ok', openAt: this.props.openAt || 'none' };
	}
}
</script>
</body>
</html>
