<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
body:has([data-wk-ground="paper"]:not([data-wk-theme] *)){background:#f4f0e6}
</style>
</helmet>
<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--wk-bg)">
	<dc-import name="Kit" hint-size="0px,0px" style="position: absolute"></dc-import>
	<dc-import name="Settings" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" values="{{vals}}" on-set="{{set}}" layout="phone" scenario="{{scenario}}" storage="{{storage}}" open-at="{{openAt}}" country="{{country}}" access="{{access}}" geo="{{geo}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"mono","section":"Theme"},"ground":{"editor":"enum","options":["ink","graphite","black"],"default":"black","section":"Theme"},"scenario":{"editor":"enum","options":["normal","pending","offline"],"default":"normal"},"storage":{"editor":"enum","options":["ok","low"],"default":"ok"},"openAt":{"editor":"enum","options":["none","receiver","storage","dec:mesh","station.country","bandplans","bandplans:pmr446","bandplans:import","station.location","devices","devices:rename","devices:signout-all"],"default":"none"},"country":{"editor":"enum","options":["location","none","locked"],"default":"location"},"access":{"editor":"enum","options":["protected","open"],"default":"protected"},"geo":{"editor":"enum","options":["ok","denied","unavailable","timeout","insecure"],"default":"ok"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = {};
		// Settings › Display reports theme, ground, accent and waterfall here, like Immersive does; a tweak change wins again
		this.set = (k, v) => { if (['theme', 'accent', 'ground', 'waterfall'].indexOf(k) >= 0) this.setState({ [k]: v }); };
	}
	componentDidUpdate(prev) {
		const won = ['theme', 'accent', 'ground'].filter(k => prev[k] !== this.props[k] && this.state[k]);
		if (won.length) this.setState(won.reduce((o, k) => { o[k] = undefined; return o; }, {}));
	}
	renderVals() {
		const s = this.state, pick = s.theme || this.props.theme || 'dark';
		const sys = pick === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
		const wkTheme = pick === 'light' || sys ? 'light' : 'dark', ground = s.ground || this.props.ground || 'black';
		return {
			// theme scope: the board's own tweaks, or what Settings › Display picked; the light theme is always on paper
			wkTheme, wkAccent: s.accent || this.props.accent || 'mono', wkGround: wkTheme === 'light' ? 'paper' : ground,
			// the dark ground always goes down, so Dark ground shows the pick while the theme is light
			vals: Object.assign({ ground }, s.theme ? { theme: s.theme } : null, s.accent ? { accent: s.accent } : null, s.waterfall ? { waterfall: s.waterfall } : null), set: this.set,
			scenario: this.props.scenario || 'normal', storage: this.props.storage || 'ok', openAt: this.props.openAt || 'none', country: this.props.country || 'location', access: this.props.access || 'protected', geo: this.props.geo || 'ok' };
	}
}
</script>
</body>
</html>
