<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--wk-bg); font-family: 'Noto Sans', system-ui, sans-serif">
	<dc-import name="Settings" theme="{{wkTheme}}" accent="{{wkAccent}}" values="{{vals}}" on-set="{{set}}" layout="phone" scenario="{{scenario}}" storage="{{storage}}" open-at="{{openAt}}" hint-size="390px,844px"></dc-import>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"phosphor","section":"Theme"},"scenario":{"editor":"enum","options":["normal","pending","offline"],"default":"normal"},"storage":{"editor":"enum","options":["ok","low"],"default":"ok"},"openAt":{"editor":"enum","options":["none","receiver","storage","dec:mesh"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = {};
		// Settings › Display reports theme and accent here, like Immersive does; a tweak change wins again
		this.set = (k, v) => { if (k === 'theme' || k === 'accent') this.setState({ [k]: v }); };
	}
	componentDidUpdate(prev) {
		const tw = prev.theme !== this.props.theme && this.state.theme, aw = prev.accent !== this.props.accent && this.state.accent;
		if (tw || aw) this.setState(Object.assign({}, tw ? { theme: undefined } : null, aw ? { accent: undefined } : null));
	}
	renderVals() {
		const s = this.state, pick = s.theme || this.props.theme || 'dark';
		const sys = pick === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
		return {
			// theme scope: the board's own tweaks, or what Settings › Display picked
			wkTheme: pick === 'light' || sys ? 'light' : 'dark', wkAccent: s.accent || this.props.accent || 'phosphor',
			vals: Object.assign({}, s.theme ? { theme: s.theme } : null, s.accent ? { accent: s.accent } : null), set: this.set,
			scenario: this.props.scenario || 'normal', storage: this.props.storage || 'ok', openAt: this.props.openAt || 'none' };
	}
}
</script>
