<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"phosphor","section":"Theme"},"ground":{"editor":"enum","options":["ink","graphite","black"],"default":"ink","section":"Theme"},"scenario":{"editor":"enum","options":["normal","pending","offline"],"default":"normal"},"storage":{"editor":"enum","options":["ok","low"],"default":"ok"},"openAt":{"editor":"enum","options":["none","receiver","storage","dec:mesh"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = {};
		// Settings › Display reports theme, ground, accent and waterfall here, like Immersive does; a tweak change wins again
		this.set = (k, v) => { if (['theme', 'accent', 'ground', 'waterfall'].indexOf(k) >= 0) this.setState({ [k]: v }); };
	}
	componentDidUpdate(prev) {
		const won = ['theme', 'accent', 'ground'].filter(k => prev[k] !== this.props[k] && this.state[k]);
		if (won.length) this.setState(won.reduce((o, k) => { o[k] = undefined; return o; }, {}));
	}
	renderVals() {
		const s = this.state, pick = s.theme || this.props.theme || 'dark';
		const sys = pick === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
		const wkTheme = pick === 'light' || sys ? 'light' : 'dark', ground = s.ground || this.props.ground || 'ink';
		return {
			// theme scope: the board's own tweaks, or what Settings › Display picked; the light theme is always on paper
			wkTheme, wkAccent: s.accent || this.props.accent || 'phosphor', wkGround: wkTheme === 'light' ? 'paper' : ground,
			// the dark ground always goes down, so Dark ground shows the pick while the theme is light
			vals: Object.assign({ ground }, s.theme ? { theme: s.theme } : null, s.accent ? { accent: s.accent } : null, s.waterfall ? { waterfall: s.waterfall } : null), set: this.set,
			scenario: this.props.scenario || 'normal', storage: this.props.storage || 'ok', openAt: this.props.openAt || 'none' };
	}
}
