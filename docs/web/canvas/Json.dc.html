<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JSON viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
body:has([data-wk-ground="paper"]:not([data-wk-theme] *)){background:#f4f0e6}
/* wk-explore: .wk-btn as a toggle (aria-pressed): off keeps the board's text-3, on is the selected fill */
.wk-json .wk-btn[aria-pressed="false"]:not(:hover){color:var(--wk-text-3)}
.wk-json .wk-btn[aria-pressed="true"]{background:var(--wk-sel);color:var(--wk-accent)}
/* Copy: a filled button that confirms in the accent (no kit variant) */
.wk-json .wk-copy{background:var(--wk-fill);color:var(--wk-text)}
.wk-json .wk-copy[data-state="done"]{background:rgba(var(--wk-accent-rgb),.16);color:var(--wk-accent)}
</style>
</helmet>
<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" class="wk-json" style="box-sizing: border-box; width: 100%; border-radius: var(--wk-r-3); background: var(--wk-well); border: 1px solid var(--wk-line-08); color: var(--wk-text); font-family: var(--wk-font-ui); overflow: hidden">
	<dc-import name="Kit" hint-size="0px,0px" style="position: absolute"></dc-import>
	<div style="display: flex; align-items: center; gap: 4px; height: var(--wk-h-lg); padding: 0 6px 0 12px; border-bottom: 1px solid var(--wk-line-08)">
		<span style="font-size: var(--wk-fs-xs); font-weight: 700; color: var(--wk-text-2)">JSON</span>
		<span style="font-size: var(--wk-fs-xs); color: var(--wka-hint); margin-left: 6px; font-variant-numeric: tabular-nums">{{meta}}</span>
		<div style="flex: 1"></div>
		<button class="wk-btn" data-variant="ghost" data-size="sm" aria-pressed="{{wrap}}" onClick="{{toggleWrap}}" style="padding: 0 8px; gap: 4px; font-size: var(--wk-fs-xs); font-weight: 400">
			<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h13a3 3 0 0 1 0 6h-4l2 -2m0 4l-2 -2M4 18h5"></path></svg>Wrap
		</button>
		<button class="wk-btn" data-variant="ghost" data-size="sm" onClick="{{copyLine}}" style="padding: 0 8px; font-size: var(--wk-fs-xs); font-weight: 400; color: var(--wk-text-3)">Copy one line</button>
		<button class="wk-btn wk-copy" data-size="sm" data-state="{{copyState}}" onClick="{{copy}}" aria-live="polite" style="padding: 0 9px; gap: 4px; font-size: var(--wk-fs-xs)">
			<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{copyIcon}}"></path></svg>{{copyLabel}}
		</button>
	</div>
	<div class="wk-scroll" style="max-height: {{maxH}}px; padding: 8px 0">
		<code style="display: block; min-width: {{minW}}; font-family: var(--wk-font-mono); font-size: var(--wk-fs-sm); line-height: 1.6; font-variant-numeric: tabular-nums">
			<sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
				<div style="display: flex; padding: 0 12px 0 0">
					<span aria-hidden="true" style="width: 34px; flex: none; text-align: right; padding-right: 12px; color: var(--wk-track); user-select: none">{{l.n}}</span>
					<span style="flex: 1; min-width: 0; white-space: {{ws}}; overflow-wrap: anywhere; padding-left: {{l.indent}}ch; text-indent: 0"><sc-for list="{{l.tokens}}" as="t"><span style="color: {{t.c}}; font-style: {{t.i}}">{{t.s}}</span></sc-for></span>
				</div>
			</sc-for>
		</code>
	</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"mono","section":"Theme"},"ground":{"editor":"enum","options":["ink","graphite","black"],"default":"black","section":"Theme"},"data":{"editor":null},"maxHeight":{"editor":"int","default":260},"$preview":{"width":380,"height":300}}'>
// syntax: keys recede (text-3), string values read (text-soft), numbers carry the accent, literals quiet italic.
// Never amber/red here: those are state colours (not live / error).
const C = { key: 'var(--wk-text-3)', str: 'var(--wk-text-soft)', num: 'var(--wk-accent)', lit: 'var(--wk-text-4)', punc: 'var(--wka-hint)' };
const RE = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}\[\],:])/g;
const CHECK = 'M5 12l5 5l10 -10';
const COPY = 'M8 8m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2zM16 8v-2a2 2 0 0 0 -2 -2h-8a2 2 0 0 0 -2 2v8a2 2 0 0 0 2 2h2';
const SAMPLE = { protocol: 'POCSAG1200', address: 1234567, function: 3, messageType: 'alpha', message: 'Test page — system check 0412. Reply not required.', decodedAt: '2026-10-10T14:02:39.412Z', ok: true, rssi: null };

function tokenize(line) {
	const out = [];
	let last = 0, m;
	RE.lastIndex = 0;
	while ((m = RE.exec(line))) {
		if (m.index > last) out.push({ s: line.slice(last, m.index), c: C.punc, i: 'normal' });
		if (m[1]) { out.push({ s: m[1], c: m[2] ? C.key : C.str, i: 'normal' }); if (m[2]) out.push({ s: m[2], c: C.punc, i: 'normal' }); }
		else if (m[3]) out.push({ s: m[3], c: C.num, i: 'normal' });
		else if (m[4]) out.push({ s: m[4], c: C.lit, i: 'italic' });
		else out.push({ s: m[5], c: C.punc, i: 'normal' });
		last = RE.lastIndex;
	}
	if (last < line.length) out.push({ s: line.slice(last), c: C.punc, i: 'normal' });
	return out;
}

class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = { wrap: true, copied: '' };
	}
	write(text, which) {
		try { if (navigator.clipboard) navigator.clipboard.writeText(text); } catch (e) {}
		this.setState({ copied: which });
		clearTimeout(this.t);
		this.t = setTimeout(() => this.setState({ copied: '' }), 1600);
	}
	componentWillUnmount() { clearTimeout(this.t); }
	renderVals() {
		const data = this.props.data ?? SAMPLE;
		const text = JSON.stringify(data, null, 2);
		const raw = text.split('\n');
		const lines = raw.map((l, i) => {
			const indent = l.length - l.trimStart().length;
			return { n: i + 1, indent, tokens: tokenize(l.trimStart()) };
		});
		const wrap = this.state.wrap;
		const copied = this.state.copied === 'pretty';
		return {
			// theme scope: Immersive passes its theme and accent; standalone, the board's own tweaks
			wkTheme: this.props.theme === 'light' ? 'light' : 'dark', wkAccent: this.props.accent || 'mono', wkGround: this.props.theme === 'light' ? 'paper' : (this.props.ground || 'black'),
			lines,
			meta: raw.length + ' lines · ' + new Blob([text]).size + ' B',
			ws: wrap ? 'pre-wrap' : 'pre',
			minW: wrap ? '0' : 'max-content',
			maxH: this.props.maxHeight ?? 260,
			wrap,
			toggleWrap: () => this.setState({ wrap: !wrap }),
			copy: () => this.write(text, 'pretty'),
			copyLine: () => this.write(JSON.stringify(data), 'line'),
			copyLabel: copied ? 'Copied' : this.state.copied === 'line' ? 'Copied line' : 'Copy',
			copyIcon: this.state.copied ? CHECK : COPY,
			copyState: this.state.copied ? 'done' : 'idle'
		};
	}
}
</script>
</body>
</html>
