<style>
[data-wk-theme]{--wka-hint:var(--wk-text-5);--wka-grip:var(--wk-well-glass);--wka-scrim:color-mix(in srgb,var(--wk-plot-bg) 28%,transparent);--wka-sticky:var(--wk-well);--wka-sticky-hi:var(--wk-surface);--wka-sticky-fx:blur(12px)}[data-wk-theme="light"]{--wka-hint:var(--wk-text-4);--wka-grip:var(--wk-glass-strong);--wka-scrim:color-mix(in srgb,var(--wk-plot-bg) 18%,transparent);--wka-sticky:color-mix(in srgb,var(--wk-fill) 96%,var(--wk-plot-bg));--wka-sticky-hi:var(--wk-fill);--wka-sticky-fx:none}

@font-face{font-family:"Noto Sans";font-weight:700;font-display:swap;src:url("/_blob/d96658b3edaf151ed186f81e701c06c7") format("woff2")}

<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" style="box-sizing: border-box; width: 100%; border-radius: 6px; background: var(--wk-well); border: 1px solid rgba(var(--wk-line-rgb),.08); color: var(--wk-text); font-family: 'Noto Sans', system-ui, sans-serif; overflow: hidden">
	<div style="display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 6px 0 12px; border-bottom: 1px solid rgba(var(--wk-line-rgb),.08)">
		<span style="font-size: 12px; font-weight: 700; color: var(--wk-text-2)">JSON</span>
		<span style="font-size: 12px; color: var(--wka-hint); margin-left: 6px; font-variant-numeric: tabular-nums">{{meta}}</span>
		<div style="flex: 1"></div>
		<button aria-pressed="{{wrap}}" onClick="{{toggleWrap}}" style="font: inherit; cursor: pointer; height: 26px; padding: 0 8px; border: 0; border-radius: 6px; font-size: 12px; background: {{wrapBg}}; color: {{wrapFg}}; display: flex; align-items: center; gap: 5px">
			<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h13a3 3 0 0 1 0 6h-4l2 -2m0 4l-2 -2M4 18h5"></path></svg>Wrap
		</button>
		<button onClick="{{copyLine}}" style="font: inherit; cursor: pointer; height: 26px; padding: 0 8px; border: 0; border-radius: 6px; font-size: 12px; background: transparent; color: var(--wk-text-3)">Copy one line</button>
		<button onClick="{{copy}}" aria-live="polite" style="font: inherit; cursor: pointer; height: 26px; padding: 0 9px; border: 0; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{copyBg}}; color: {{copyFg}}; display: flex; align-items: center; gap: 5px">
			<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{copyIcon}}"></path></svg>{{copyLabel}}
		</button>
	</div>
	<div style="max-height: {{maxH}}px; overflow: auto; padding: 8px 0; scrollbar-width: thin; scrollbar-color: var(--wk-track) transparent">
		<code style="display: block; min-width: {{minW}}; font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 12.5px; line-height: 1.6">
			<sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
				<div style="display: flex; padding: 0 12px 0 0">
					<span aria-hidden="true" style="width: 34px; flex: none; text-align: right; padding-right: 12px; color: var(--wk-track); user-select: none">{{l.n}}</span>
					<span style="flex: 1; min-width: 0; white-space: {{ws}}; overflow-wrap: anywhere; padding-left: {{l.indent}}ch; text-indent: 0"><sc-for list="{{l.tokens}}" as="t"><span style="color: {{t.c}}; font-style: {{t.i}}">{{t.s}}</span></sc-for></span>
				</div>
			</sc-for>
		</code>
	</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"phosphor","section":"Theme"},"data":{"editor":null},"maxHeight":{"editor":"int","default":260},"$preview":{"width":380,"height":300}}'>
const C = { key: 'var(--wk-accent)', str: 'var(--wk-text)', num: 'var(--wk-amber)', lit: 'var(--wk-text-2)', punc: 'var(--wka-hint)' };
const RE = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}\[\],:])/g;
const CHECK = 'M5 12l5 5l10 -10';
const COPY = 'M8 8m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2zM16 8v-2a2 2 0 0 0 -2 -2h-8a2 2 0 0 0 -2 2v8a2 2 0 0 0 2 2h2';
const SAMPLE = { protocol: 'POCSAG1200', address: 1234567, function: 3, messageType: 'alpha', message: 'Test page — system check 0412. Reply not required.', decodedAt: '2026-10-10T14:02:39.412Z', ok: true, rssi: null };

function tokenize(line) {
	const out = [];
	let last = 0, m;
	RE.lastIndex = 0;
	while ((m = RE.exec(line))) {
		if (m.index > last) out.push({ s: line.slice(last, m.index), c: C.punc, i: 'normal' });
		if (m[1]) { out.push({ s: m[1], c: m[2] ? C.key : C.str, i: 'normal' }); if (m[2]) out.push({ s: m[2], c: C.punc, i: 'normal' }); }
		else if (m[3]) out.push({ s: m[3], c: C.num, i: 'normal' });
		else if (m[4]) out.push({ s: m[4], c: C.lit, i: 'italic' });
		else out.push({ s: m[5], c: C.punc, i: 'normal' });
		last = RE.lastIndex;
	}
	if (last < line.length) out.push({ s: line.slice(last), c: C.punc, i: 'normal' });
	return out;
}

class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = { wrap: true, copied: '' };
	}
	write(text, which) {
		try { if (navigator.clipboard) navigator.clipboard.writeText(text); } catch (e) {}
		this.setState({ copied: which });
		clearTimeout(this.t);
		this.t = setTimeout(() => this.setState({ copied: '' }), 1600);
	}
	componentWillUnmount() { clearTimeout(this.t); }
	renderVals() {
		const data = this.props.data ?? SAMPLE;
		const text = JSON.stringify(data, null, 2);
		const raw = text.split('\n');
		const lines = raw.map((l, i) => {
			const indent = l.length - l.trimStart().length;
			return { n: i + 1, indent, tokens: tokenize(l.trimStart()) };
		});
		const wrap = this.state.wrap;
		const copied = this.state.copied === 'pretty';
		return {
			// theme scope: Immersive passes its theme and accent; standalone, the board's own tweaks
			wkTheme: this.props.theme === 'light' ? 'light' : 'dark', wkAccent: this.props.accent || 'phosphor',
			lines,
			meta: raw.length + ' lines · ' + new Blob([text]).size + ' B',
			ws: wrap ? 'pre-wrap' : 'pre',
			minW: wrap ? '0' : 'max-content',
			maxH: this.props.maxHeight ?? 260,
			wrap,
			wrapBg: wrap ? 'rgba(var(--wk-accent-rgb),.12)' : 'transparent',
			wrapFg: wrap ? 'var(--wk-accent)' : 'var(--wk-text-3)',
			toggleWrap: () => this.setState({ wrap: !wrap }),
			copy: () => this.write(text, 'pretty'),
			copyLine: () => this.write(JSON.stringify(data), 'line'),
			copyLabel: copied ? 'Copied' : this.state.copied === 'line' ? 'Copied line' : 'Copy',
			copyIcon: this.state.copied ? CHECK : COPY,
			copyBg: this.state.copied ? 'rgba(var(--wk-accent-rgb),.16)' : 'var(--wk-fill)',
			copyFg: this.state.copied ? 'var(--wk-accent)' : 'var(--wk-text)'
		};
	}
}
</script>
