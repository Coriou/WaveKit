<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WaveKit — Instrument shell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"D-DIN Condensed";font-weight:400;font-display:swap;src:url("/_blob/6b6b1c5cae1637ecc473a959a8d87a96") format("woff2")}
@font-face{font-family:"D-DIN Condensed";font-weight:700;font-display:swap;src:url("/_blob/2abc64ad8670fc5303395b91efc22319") format("woff2")}
@font-face{font-family:"Noto Sans";font-weight:400;font-display:swap;src:url("/_blob/fc93658bc9e76c8f71fbef44633be7ab") format("woff2")}
@font-face{font-family:"Noto Sans";font-weight:700;font-display:swap;src:url("/_blob/d96658b3edaf151ed186f81e701c06c7") format("woff2")}
body{margin:0;background:#111c19}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:2px solid #7becc7;outline-offset:2px}
.wk-nav:hover{background:#192b24;color:#f4f7f5}
.wk-ghost:hover{background:#192b24}
@media (max-width:1100px){.wk-insp{display:none}}
@media (max-width:760px){.wk-rail{display:none}.wk-src{display:none}}
</style>
</helmet>
<div style="height: 100vh; min-height: 680px; display: flex; background: #111c19; color: #f4f7f5; font-family: 'Noto Sans', system-ui, sans-serif; overflow: hidden">

	<nav class="wk-rail" aria-label="Primary" style="width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 16px 0 14px; gap: 4px; border-right: 1px solid #22362f">
		<svg width="30" height="30" viewBox="0 0 256 256" fill="none" role="img" aria-label="WaveKit" style="color: #7becc7; margin-bottom: 22px"><path d="M28 68C72 68 34 188 78 188C112 188 94 104 128 104C162 104 144 188 178 188C222 188 184 68 228 68" stroke="currentColor" stroke-width="26" stroke-linejoin="round"></path></svg>
		<sc-for list="{{nav}}" as="item" hint-placeholder-count="5">
			<button class="wk-nav" aria-label="{{item.label}}" onClick="{{item.pick}}" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: {{item.bg}}; color: {{item.fg}}; transition: background .15s, color .15s">
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{item.d}}" as="p"><path d="{{p}}"></path></sc-for></svg>
			</button>
		</sc-for>
		<div style="flex: 1"></div>
		<button class="wk-nav" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #8ba598">
			<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h11M19 18h1"></path><circle cx="14" cy="6" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
		</button>
	</nav>

	<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
		<header style="height: 68px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px 0 24px; border-bottom: 1px solid #22362f">
			<div style="display: flex; align-items: baseline; gap: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em">
				<span style="font-size: 30px; font-weight: 700">{{fMain}}</span>
				<span style="font-size: 30px; color: #52645d; margin-left: 4px">{{fSub}}</span>
				<span style="font-size: 13px; color: #8ba598; margin-left: 8px">MHz</span>
			</div>
			<button class="wk-ghost" style="height: 36px; padding: 0 10px 0 12px; border-radius: 8px; border: 1px solid #2c443b; display: flex; align-items: center; gap: 8px; font-size: 14px">
				<span style="font-weight: 700">NFM</span>
				<span style="color: #8ba598">12.5 kHz</span>
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8ba598" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"></path></svg>
			</button>
			<div style="flex: 1"></div>
			<div class="wk-src" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b9cac1">
				<span style="width: 7px; height: 7px; border-radius: 50%; background: #7becc7"></span>
				<span>Pi receiver</span>
				<span style="color: #52645d">·</span>
				<span style="font-variant-numeric: tabular-nums">2.4 MS/s</span>
			</div>
			<div style="width: 1px; height: 24px; background: #22362f; margin: 0 4px"></div>
			<button class="wk-ghost" aria-label="Volume" style="width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #b9cac1">
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8a5 5 0 0 1 0 8"></path><path d="M17.7 5a9 9 0 0 1 0 14"></path><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"></path></svg>
			</button>
			<button class="wk-ghost" aria-label="Commands (⌘K)" style="height: 40px; padding: 0 10px; border-radius: 10px; display: flex; align-items: center; gap: 6px; color: #b9cac1">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9a2 2 0 1 1 2 -2v10a2 2 0 1 1 -2 -2h10a2 2 0 1 1 -2 2v-10a2 2 0 1 1 2 2h-10"></path></svg>
				<span style="font-size: 13px">K</span>
			</button>
			<button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: {{playBg}}; color: {{playFg}}; transition: background .15s">
				<sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
					<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect></svg>
				</sc-if>
				<sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
					<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11 -7z" fill="currentColor"></path></svg>
				</sc-if>
			</button>
		</header>

		<div style="flex: 1; min-height: 0; display: flex">
			<div style="position: relative; flex: 1; min-width: 0">
				<dc-import name="Spectrum" vfo="{{freq}}" on-tune="{{tune}}" show-markers="{{true}}" spec-height="{{specH}}" hint-size="100%,100%"></dc-import>
			</div>
			<aside class="wk-insp" aria-label="Tuned signal" style="width: 344px; flex: none; border-left: 1px solid #22362f; overflow-y: auto">
				<dc-import name="Tuned" freq="{{freq}}" on-tune="{{tune}}" variant="panel" hint-size="344px,820px"></dc-import>
			</aside>
		</div>
	</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = { freq: 161150000, nav: 'spectrum', playing: true };
		this.tune = f => this.setState({ freq: f });
		this.togglePlay = () => this.setState({ playing: !this.state.playing });
	}
	renderVals() {
		const NAV = [
			{ id: 'spectrum', label: 'Spectrum', d: ['M3 7c3 0 1.5 10 4.5 10s1.5 -7 4.5 -7s1.5 7 4.5 7s1.5 -10 4.5 -10'] },
			{ id: 'activity', label: 'Activity', d: ['M3 12h4l3 8l4 -16l3 8h4'] },
			{ id: 'map', label: 'Map', d: ['M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13', 'M9 4v13', 'M15 7v13'] },
			{ id: 'scanner', label: 'Scanner', d: ['M21 12h-8a1 1 0 1 0 -1 1v8a9 9 0 0 0 9 -9', 'M16 9a5 5 0 1 0 -7 7', 'M20.486 9a9 9 0 1 0 -11.482 11.495'] },
			{ id: 'recordings', label: 'Recordings', d: ['M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0', 'M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'] }
		];
		const s = this.state;
		const nav = NAV.map(n => {
			const on = n.id === s.nav;
			return { ...n, bg: on ? '#192b24' : 'transparent', fg: on ? '#7becc7' : '#8ba598', pick: () => this.setState({ nav: n.id }) };
		});
		const mhz = s.freq / 1e6;
		return {
			nav,
			freq: s.freq,
			tune: this.tune,
			specH: 260,
			fMain: mhz.toFixed(3),
			fSub: String(Math.round(s.freq % 1000)).padStart(3, '0'),
			playing: s.playing,
			paused: !s.playing,
			playLabel: s.playing ? 'Stop receiving' : 'Start receiving',
			playBg: s.playing ? '#7becc7' : '#192b24',
			playFg: s.playing ? '#111c19' : '#7becc7',
			togglePlay: this.togglePlay
		};
	}
}
</script>
</body>
</html>
