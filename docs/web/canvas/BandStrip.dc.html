	{ hz: 167512500, bw: 6250, label: 'Maybe NXDN', sub: 'No sync · 6.25 kHz 4FSK', conf: 'maybe', active: false, recent: true, fresh: true },
	{ hz: 161162500, bw: 12500, label: 'Heard', sub: 'Maybe a neighbour’s leak', conf: 'heard', active: false, recent: true },
	{ hz: 162400000, bw: 12500, label: 'Heard', sub: 'Steady carrier', conf: 'heard', active: false, recent: true },
	{ hz: 446006250, bw: 12500, label: 'Maybe FM voice', sub: 'PMR446 ch 1', conf: 'maybe', active: false, recent: false },
	{ hz: 466025000, bw: 12500, label: 'Maybe FLEX', sub: 'No sync yet · Pager network, Morlaix?', conf: 'maybe', active: false, recent: false },
	{ hz: 433075000, bw: 12500, label: 'Heard', sub: 'LPD', conf: 'heard', active: false, recent: false }
];
// Ranges the scan never visits (core's exclusions). AIS is decoded elsewhere, so the sweep skips it.
const EXCLUDED = [{ from: 136962500, to: 136987500, title: 'Not scanned · VDL2, already decoded by dumpvdl2' }, { from: 144787500, to: 144812500, title: 'Not scanned · APRS, already decoded by Direwolf' }, { from: 161950000, to: 162050000, title: 'Not scanned · AIS, already decoded by AIS-catcher' }];
// Two presets combined: Marine VHF lies inside PMR / land mobile, so the stretch is scanned once and both names show
const MOCK = { preset: 'Marine + PMR', startHz: 136000000, endHz: 174000000, hops: 26, sweepS: 10, coverage: 84,
	ranges: [{ startHz: 136000000, endHz: 174000000, name: 'PMR + Marine', hops: 26, inner: [{ startHz: 156000000, endHz: 162025000, name: 'Marine' }] }] };
// A run started from the composer with several separate ranges (names and per-range hops come with it)
const MOCK_MULTI = { preset: 'Marine + 2 more', startHz: 156000000, endHz: 466100000, hops: 6, sweepS: 3, coverage: 62,
	ranges: [{ startHz: 156000000, endHz: 162025000, name: 'Marine', hops: 4 }, { startHz: 446000000, endHz: 446200000, name: 'PMR446', hops: 1 }, { startHz: 466000000, endHz: 466250000, name: 'Pagers 466', hops: 1 }],
	exclusions: [{ startHz: 161950000, endHz: 162025000, reason: 'AIS · already decoded by AIS-catcher' }] };
const HOLD_HOP = 18, HOLD_S = 3;
const RANK = { decoded: 3, likely: 2, maybe: 1, heard: 0 };
const mfmt = hz => { const s = (hz / 1e6).toFixed(6); return s.slice(0, -3) + ' ' + s.slice(-3); };
const short = hz => { const m = hz / 1e6; return Number.isInteger(m) ? String(m) : m.toFixed(3).replace(/0+$/, ''); };

class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = { hop: 5, held: 0, tip: null };
		this.leave = () => this.setState({ tip: null });
		this.trackRef = el => {
			if (!el || el === this.trackEl) return;
			this.trackEl = el;
			if (this.ro) this.ro.disconnect();
			if (window.ResizeObserver) { this.ro = new ResizeObserver(() => this.measure()); this.ro.observe(el); }
			this.measure();
		};
	}
	measure() { const w = this.trackEl ? this.trackEl.clientWidth : 0; if (w && w !== this.state.trackW) this.setState({ trackW: w }); }
	componentDidMount() {
		// Standalone only: the hop advances once a second and holds on hop 7 (DMR is active there).
		this.timer = setInterval(() => {
			if (this.props.sweep || !/^(sweeping|holding)$/.test(this.props.state || 'sweeping')) return;
			const s = this.state, m = this.mock();
			if (m === MOCK && s.hop === HOLD_HOP && s.held < HOLD_S) return this.setState({ held: s.held + 1 });
			this.setState({ hop: s.hop % m.hops + 1, held: 0 });
		}, 1000);
	}
	componentWillUnmount() { clearInterval(this.timer); if (this.ro) this.ro.disconnect(); }
	mock() { return this.props.run === 'Several ranges' ? MOCK_MULTI : MOCK; }
	sweep() {
		if (this.props.sweep) return this.props.sweep;
		const st = this.props.state || 'sweeping', m = this.mock();
		if (m !== MOCK) return Object.assign({}, m, { state: st, hop: Math.min(this.state.hop, m.hops), holdHz: st === 'holding' ? 156800000 : undefined, holdLabel: st === 'holding' ? 'Maybe FM voice' : undefined, resumeIn: st === 'paused-you' ? 42 : undefined });
		const holding = st === 'holding' || (st === 'sweeping' && this.state.hop === HOLD_HOP && this.state.held < HOLD_S);
		return Object.assign({}, MOCK, {
			state: holding ? 'holding' : st,
			hop: st === 'holding' ? HOLD_HOP : this.state.hop,
			holdHz: holding ? 161150000 : undefined, holdLabel: holding ? 'DMR · CC 1' : undefined,
			resumeIn: st === 'paused-you' ? 42 : undefined
		});
	}
	renderVals() {
		const sw = this.sweep();
		const embedded = !!this.props.sweep;
		const L = sw.startHz, R = sw.endHz, span = R - L;
		// Separate ranges (several bands from the composer) share the strip with a small break between
		// them, so a sweep that skips 300 MHz is not drawn as one long band. Each gets its width's share,
		// but never less than a readable minimum, so PMR446 (0.2 MHz) still shows next to Marine VHF.
		const rs0 = (sw.ranges && sw.ranges.length ? sw.ranges : [{ startHz: L, endHz: R, name: '' }]).slice().sort((x, y) => x.startHz - y.startHz);
		// ranges that overlap are one stretch, scanned once; the smaller one stays visible as an inner bracket
		const rs = [];
		rs0.forEach(r => { const m = rs[rs.length - 1]; if (m && r.startHz <= m.endHz) { if (r.endHz > m.endHz) { m.inner = (m.inner || []).concat([{ startHz: m.startHz, endHz: m.endHz, name: m.name }]); m.endHz = r.endHz; } else m.inner = (m.inner || []).concat([{ startHz: r.startHz, endHz: r.endHz, name: r.name }]); m.name = m.name + ' + ' + r.name; m.hops = (m.hops || 0) + (r.hops || 0); } else rs.push(Object.assign({}, r)); });
		const GAP = rs.length > 4 ? 3 : 5;
		const tot = rs.reduce((a, r) => a + r.endHz - r.startHz, 0), room = 100 - GAP * (rs.length - 1);
		const MIN = rs.length > 1 ? Math.min(18, room / rs.length) : 0;
		const raw = rs.map(r => Math.max(MIN, room * (r.endHz - r.startHz) / tot)), rawTot = raw.reduce((a, w) => a + w, 0);
		let at = 0;
		const segs = rs.map((r, i) => { const w = raw[i] * room / rawTot, sg = { a: r.startHz, b: r.endHz, left: at, w, name: r.name || '', hops: r.hops, inner: r.inner || [] }; at += w + GAP; return sg; });
		const segOf = f => segs.find(g => f >= g.a && f <= g.b);
		const pct = f => { const g = segOf(f); return g ? g.left + (f - g.a) / (g.b - g.a) * g.w : null; };
		const paused = /^paused|source-down|consent/.test(sw.state);
		const accent = paused ? 'var(--wk-amber)' : 'var(--wk-accent)';
		const accentRgb = paused ? 'var(--wk-amber-rgb)' : 'var(--wk-accent-rgb)';
		const hopW = span / sw.hops;
		const cur = Math.max(1, Math.min(sw.hops, sw.hop || 1));

		const discs = (this.props.discoveries || DISCOVERIES.map(d => Object.assign({}, d, { active: !embedded && d.hz === sw.holdHz }))).filter(d => !!segOf(d.hz));

		// hops per range, in proportion to its width (at least one each), like the shell's sweep
		const hopBoxes = [];
		// the composer sends each range's hops; use them when they add up to the run's
		const own = segs.length > 1 && segs.every(g => g.hops > 0) && segs.reduce((a, g) => a + g.hops, 0) === sw.hops;
		segs.forEach(g => { const n = segs.length === 1 ? sw.hops : own ? g.hops : Math.max(1, Math.round(sw.hops * (g.b - g.a) / tot)); for (let k = 0; k < n; k++) hopBoxes.push({ left: g.left + k * g.w / n, width: g.w / n }); });
		const hops = hopBoxes.map((hb, i) => {
			const n = i + 1, on = n === cur;
			return {
				left: hb.left, width: hb.width,
				bg: on ? accent : n < cur ? 'rgba(' + accentRgb + ',.30)' : 'rgba(var(--wk-accent-rgb),.12)',
				// a glow is a light source; on Paper the current hop is just solid ink-accent
				glow: on && this.props.theme !== 'light' ? '0 0 10px rgba(' + accentRgb + ',.55)' : 'none'
			};
		});

		// 24 h occupancy: a soft bump around every discovery, weighted by how busy it is
		const heatSegs = segs.map(g => {
			const CELLS = Math.max(8, Math.round(96 * g.w / 100)), gs = g.b - g.a;
			return { left: g.left, width: g.w, cells: Array.from({ length: CELLS }, (_, i) => {
				const f = g.a + (i + 0.5) / CELLS * gs;
				let v = 0.04 + 0.03 * Math.abs(Math.sin(i * 12.9898));
				discs.forEach(d => {
					const w = d.conf === 'decoded' ? 0.75 : d.conf === 'heard' ? 0.25 : 0.4;
					v += w * Math.exp(-Math.pow((f - d.hz) / (gs / CELLS * 1.2), 2));
				});
				return Math.min(0.85, v).toFixed(2);
			}) };
		});
		const inner = [].concat.apply([], segs.map(g => g.inner.map(n => ({ left: pct(Math.max(g.a, n.startHz)), width: (Math.min(g.b, n.endHz) - Math.max(g.a, n.startHz)) / (g.b - g.a) * g.w, name: n.name, title: n.name + ' · ' + short(n.startHz) + '–' + short(n.endHz) + ' MHz · inside, scanned once for both' }))));
		const gaps = segs.slice(1).map((g, i) => ({ left: segs[i].left + segs[i].w, width: GAP, title: 'Not scanned · ' + short(segs[i].b) + '–' + short(g.a) + ' MHz' }));

		const exList = sw.exclusions ? sw.exclusions.map(e => ({ from: e.startHz, to: e.endHz, title: 'Not scanned · ' + (e.reason || 'skipped') })) : EXCLUDED;
		const excluded = exList.map(x => { const g = segs.find(q => x.to > q.a && x.from < q.b); return g ? { left: pct(Math.max(g.a, x.from)), width: (Math.min(g.b, x.to) - Math.max(g.a, x.from)) / (g.b - g.a) * g.w, shift: '0', title: x.title } : null; }).filter(Boolean);

		// Ticks: active first, then by confidence; one within 9 px of a placed tick folds into it
		const trackPx = this.state.trackW || 600;
		const placed = [];
		discs.slice().sort((a, b) => (b.active - a.active) || (RANK[b.conf] - RANK[a.conf]) || (b.recent - a.recent)).forEach(d => {
			const x = pct(d.hz) / 100 * trackPx;
			const near = placed.find(p => Math.abs(p.x - x) < 9);
			if (near) near.more++;
			else placed.push({ d, x, more: 0 });
		});
		const tip = this.state.tip;
		const ticks = placed.sort((a, b) => a.d.hz - b.d.hz).map(p => {
			const d = p.d, solid = d.conf === 'decoded';
			const color = d.conf === 'heard' ? 'rgba(var(--wk-ink-2-rgb),.75)' : solid || d.conf === 'likely' ? 'var(--wk-accent)' : 'rgba(var(--wk-accent-rgb),.85)';
			return {
				left: pct(d.hz), active: !!d.active, fresh: !!d.fresh && !d.active, color, fill: solid ? color : 'var(--wk-well)',
				aria: 'Tune to ' + short(d.hz) + ' MHz, ' + d.label + (p.more ? ', ' + p.more + ' more nearby' : ''),
				enter: () => this.setState({ tip: { hz: d.hz, more: p.more } }),
				pick: () => { if (this.props.onTune) this.props.onTune(d.hz); }
			};
		});
		const tipP = tip && placed.find(p => p.d.hz === tip.hz);
		const td = tipP ? tipP.d : null;

		// a few MHz labels: both ends plus round steps between them
		let labels;
		let rangeLabels = [];
		if (segs.length > 1) {
			// each range is labelled with its name and ends; the text gives way (ellipsis) when the share is narrow
			labels = [];
			rangeLabels = segs.map(g => ({ left: g.left, width: g.w + (g === segs[segs.length - 1] ? 0 : GAP), name: g.name || short(g.a) + '–' + short(g.b), ends: g.name ? short(g.a) + '–' + short(g.b) : 'MHz', title: (g.name ? g.name + ' · ' : '') + short(g.a) + '–' + short(g.b) + ' MHz' }));
		} else {
			const step = [1e6, 2e6, 5e6, 10e6, 20e6, 50e6, 100e6].find(s => span / s <= 5) || 100e6;
			labels = [{ left: 0, shift: '0', text: short(L) }];
			for (let f = Math.ceil(L / step) * step; f < R; f += step) if (pct(f) > 9 && pct(f) < 88 && !inner.some(n => pct(f) > n.left - 7 && pct(f) < n.left + n.width + 7)) labels.push({ left: pct(f), shift: '-50%', text: short(f) });
			labels.push({ left: 100, shift: '-100%', text: short(R) + ' MHz' });
		}

		const view = this.props.view || { startHz: 160300000, endHz: 162700000 };
		const vg = segOf((view.startHz + view.endHz) / 2) || segs.find(g => view.endHz > g.a && view.startHz < g.b);
		const vL = vg ? Math.max(vg.a, view.startHz) : 0, vR = vg ? Math.min(vg.b, view.endHz) : 0;

		const stateText = sw.state === 'holding' ? 'Holding · ' + short(sw.holdHz || 0)
			: sw.state === 'starting' ? 'Starting'
			: sw.state === 'paused-you' ? (sw.waiting ? 'Waits while you listen' : sw.resumeIn != null ? 'Resumes in ' + sw.resumeIn + ' s' : 'Paused')
			: sw.state === 'paused' ? (sw.released ? 'Paused · yours' : 'Paused')
			: sw.state === 'paused-relay' ? 'Waiting for SDR++'
			: sw.state === 'paused-job' ? 'Another scan first'
			: sw.state === 'source-down' ? 'Receiver offline'
			: 'Stop ' + cur + '/' + sw.hops + ' · ' + sw.coverage + ' %';

		return {
			// theme scope: Immersive passes its theme and accent; standalone, the board's own tweaks
			wkTheme: this.props.theme === 'light' ? 'light' : 'dark', wkAccent: this.props.accent || 'mono', wkGround: this.props.theme === 'light' ? 'paper' : (this.props.ground || 'black'),
			rootW: embedded ? '100%' : '800px',
			rootPad: embedded ? '0' : '24px 20px 70px',
			rootBg: embedded ? 'transparent' : 'var(--wk-plot-bg)',
			glassBg: paused ? 'var(--wk-amber-glass)' : 'var(--wk-glass)',
			edge: paused ? 'rgba(var(--wk-amber-rgb),.14)' : 'rgba(var(--wk-line-rgb),.14)',
			accent, preset: sw.preset, stateText,
			hops, heatSegs, gaps, excluded, ticks, labels, rangeLabels, inner,
			hasBracket: vR > vL,
			bracketLeft: vR > vL ? pct(vL) : 0, bracketWidth: vR > vL ? (vR - vL) / (vg.b - vg.a) * vg.w : 0,
			leave: this.leave, trackRef: this.trackRef,
			hasTip: !!td,
			tipLeft: td ? Math.max(14, Math.min(86, pct(td.hz))) : 0,
			tipFreq: td ? mfmt(td.hz) : '',
			tipLabel: td ? td.label : '',
			tipColor: td && td.conf === 'heard' ? 'var(--wk-text-2)' : 'var(--wk-accent)',
			tipDecoded: !!td && td.conf === 'decoded',
			tipSub: td ? td.sub : '', tipHasSub: !!(td && td.sub),
			tipWhen: td ? (td.active ? 'Active now' : td.recent ? 'Heard in the last hour' : 'Heard earlier') + (tipP.more ? ' · +' + tipP.more + ' nearby' : '') + ' · click to tune' : ''
		};
	}
}
</script>
</body>
