<head>
<meta charset="utf-8">
<title>Tuned signal card</title>

<x-dc>
<helmet>
<style>

.wk-tc-act:hover{background:#192b24;color:#f4f7f5}
.wk-tc-row:hover{background:rgba(123,236,199,.06)}

</helmet>
<div style="box-sizing: border-box; width: 100%; padding: {{pad}}; background: {{bg}}; border: {{border}}; border-radius: {{radius}}; box-shadow: {{shadow}}; backdrop-filter: {{blur}}; color: #f4f7f5; font-family: 'Noto Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; gap: 14px">

	<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
		<div style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: {{tileBg}}; color: {{tileFg}}; display: grid; place-items: center">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{icon}}" as="p" hint-placeholder-count="1"><path d="{{p}}"></path></sc-for></svg>
		</div>
		<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
			<div style="display: flex; align-items: baseline; gap: 8px; min-width: 0">
				<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.1; white-space: nowrap">{{proto}}</span>
				<span style="font-size: 12.5px; color: #8ba598; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{protoSub}}</span>
			</div>
			<div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: {{stateFg}}; white-space: nowrap; overflow: hidden">
				<span style="width: 6px; height: 6px; flex: none; border-radius: 50%; background: currentColor; opacity: {{dotOpacity}}"></span>
				<span style="overflow: hidden; text-overflow: ellipsis">{{stateText}}</span>
			</div>
		</div>
		<div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px" title="{{levelTitle}}">
			<span style="font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700">{{freqText}}</span>
			<span style="display: flex; align-items: flex-end; gap: 2px; height: 10px" role="img" aria-label="{{levelTitle}}">
				<sc-for list="{{sigBars}}" as="b" hint-placeholder-count="5"><span style="width: 3px; height: {{b.h}}px; border-radius: 1px; background: {{b.c}}"></span></sc-for>
			</span>
		</div>
	</div>

	<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 12px; border-radius: 14px; background: rgba(11,21,18,.5)">
		<sc-if value="{{hasEyebrow}}" hint-placeholder-val="{{true}}">
			<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8ba598">{{eyebrow}}</span>
		</sc-if>
		<sc-if value="{{hasTitle}}" hint-placeholder-val="{{false}}">
			<span style="font-weight: 700; font-size: 14px; line-height: 1.35">{{titleText}}</span>
		</sc-if>
		<sc-if value="{{hasBig}}" hint-placeholder-val="{{true}}">
		<div style="display: flex; align-items: baseline; gap: 8px; min-width: 0">
			<sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2b84b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Encrypted" role="img" style="flex: none; align-self: center"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"></path><path d="M8 11v-4a4 4 0 1 1 8 0v4"></path></svg>
			</sc-if>
			<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-weight: 700; font-size: {{bigSize}}; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{big}}</span>
			<sc-if value="{{hasBigUnit}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; color: #b9cac1; white-space: nowrap">{{bigUnit}}</span></sc-if>
			<div style="flex: 1"></div>
			<sc-if value="{{hasTimer}}" hint-placeholder-val="{{false}}"><span style="font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; color: {{timerC}}">{{timer}}</span></sc-if>
		</div>
		</sc-if>
		<sc-if value="{{hasLine}}" hint-placeholder-val="{{true}}">
			<span style="font-size: 13px; color: #b9cac1; line-height: 1.4">{{line}}</span>
		</sc-if>
		<sc-if value="{{hasBody}}" hint-placeholder-val="{{false}}">
			<p style="margin: 2px 0 0; font-size: {{bodySize}}; line-height: 1.45; color: {{bodyC}}; font-family: {{bodyFont}}; font-style: {{bodyStyle}}; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere">{{body}}</p>
		</sc-if>
		<sc-if value="{{hasChips}}" hint-placeholder-val="{{false}}">
			<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px">
				<sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><span style="height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 7px; background: #192b24; font-size: 12.5px; line-height: 24px; font-variant-numeric: tabular-nums; white-space: nowrap"><span style="color: #8ba598">{{c.k}}</span> {{c.v}}</span></sc-for>
			</div>
		</sc-if>
		<sc-if value="{{hasWave}}" hint-placeholder-val="{{false}}">
			<div style="display: flex; align-items: center; gap: 2px; height: 26px; margin-top: 4px" aria-hidden="true">
				<sc-for list="{{wave}}" as="b" hint-placeholder-count="40"><span style="flex: 1; height: {{b.h}}%; min-height: 2px; border-radius: 1px; background: {{b.c}}; transition: height .12s linear"></span></sc-for>
			</div>
		</sc-if>
		<sc-if value="{{hasRate}}" hint-placeholder-val="{{false}}">
			<div style="display: flex; align-items: flex-end; gap: 8px; margin-top: 4px">
				<div style="flex: 1; display: flex; align-items: flex-end; gap: 2px; height: 22px" aria-hidden="true">
					<sc-for list="{{rateBars}}" as="b" hint-placeholder-count="30"><span style="flex: 1; height: {{b.h}}%; min-height: 2px; border-radius: 1px; background: {{b.c}}"></span></sc-for>
				</div>
				<span style="flex: none; font-size: 12px; color: #8ba598; font-variant-numeric: tabular-nums">{{rate}}</span>
			</div>
		</sc-if>
	</div>

	<sc-if value="{{hasRecent}}" hint-placeholder-val="{{true}}">
		<section aria-label="Recent on this frequency" style="display: flex; flex-direction: column">
			<h3 style="margin: 0 0 2px; font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-weight: 400; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8ba598">{{recentTitle}}</h3>
			<sc-for list="{{recent}}" as="r" hint-placeholder-count="2">
				<button class="wk-tc-row" onClick="{{r.pick}}" style="font: inherit; color: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 8px; margin: 0 -8px; border: 0; border-radius: 9px; background: {{r.bg}}; font-size: 13px">
					<span style="width: 40px; flex: none; color: #8ba598; font-variant-numeric: tabular-nums">{{r.t}}</span>
					<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.a}}</span>
					<span style="flex: none; color: #8ba598; font-variant-numeric: tabular-nums">{{r.b}}</span>
					<sc-if value="{{r.audio}}" hint-placeholder-val="{{false}}">
						<span style="width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1px solid {{r.pBorder}}; background: {{r.pBg}}; color: {{r.pFg}}; display: grid; place-items: center" aria-label="{{r.playLabel}}" role="img">
							<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{r.pIcon}}"></path></svg>
						</span>
					</sc-if>
				</button>
			</sc-for>
		</section>
	</sc-if>

	<div style="display: flex; gap: 6px; flex-wrap: nowrap; min-width: 0">
		<sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
			<button class="wk-tc-act" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" title="{{a.title}}" style="font: inherit; cursor: pointer; flex: {{a.flex}}; min-width: 0; height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 700; white-space: nowrap">
				<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{a.icon}}" as="p" hint-placeholder-count="1"><path d="{{p}}"></path></sc-for></svg>
				<sc-if value="{{a.hasLabel}}" hint-placeholder-val="{{true}}"><span>{{a.label}}</span></sc-if>
			</button>
		</sc-for>
	</div>

	<sc-if value="{{full}}" hint-placeholder-val="{{false}}">
		<section aria-label="Also in view" style="display: flex; flex-direction: column; padding-top: 6px; border-top: 1px solid #1a2b25">
			<h3 style="margin: 8px 0 2px; font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-weight: 400; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8ba598">Also in view</h3>
			<sc-for list="{{others}}" as="o" hint-placeholder-count="3">
				<button class="wk-tc-row" onClick="{{o.pick}}" style="font: inherit; color: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px; margin: 0 -8px; border: 0; border-radius: 10px; background: transparent">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8ba598" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{o.icon}}" as="p" hint-placeholder-count="1"><path d="{{p}}"></path></sc-for></svg>
					<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
						<span style="font-weight: 700; font-size: 14px">{{o.label}}</span>
						<span style="color: #8ba598; font-size: 12px">{{o.sub}}</span>
					</span>
					<span style="color: #b9cac1; font-size: 13px; font-variant-numeric: tabular-nums">{{o.freq}}</span>
				</button>
			</sc-for>
		</section>
	</sc-if>
</div>
</x-dc>

	868300000: { kind: 'msg', proto: 'ISM 868', protoSub: 'rtl_433 · 2 devices', icon: ICON.sensors, decoder: 'rtl_433', level: -70, snr: 24, live: false,
		eyebrow: 'LaCrosse-TX29IT · ID 47', body: '', chips: [['', '16.9 °C'], ['Battery', 'OK']], quiet: 'Listening · last reading 9 s ago',
		recent: [['14:01', 'Fineoffset-WH51 · soil', '38 %']] },
	868950000: { kind: 'msg', proto: 'wM-Bus', protoSub: 'Mode T1 · rtl_433', icon: ICON.sensors, decoder: 'rtl_433', level: -72, snr: 20, live: false,
		eyebrow: 'Water meter · ID 41526375', body: '', chips: [['Total', '1 284.6 m³'], ['Flow', '0.0 l/h']], quiet: 'Listening · last frame 31 s ago',
		recent: [['13:59', 'Heat meter · ID 70031188', '3.42 MWh']] },
	869525000: { kind: 'msg', proto: 'Meshtastic', protoSub: 'LoRa · LongFast', icon: ICON.mesh, decoder: 'Meshtastic', level: -75, snr: 7, live: false,
		eyebrow: 'Harbour relay · !a3f2c1 → everyone', body: 'Anyone on the coast tonight? Signal is great from the lighthouse.', chips: [['Hops', '2 of 3'], ['SNR', '6.5 dB']], quiet: 'Listening · last message 3 min ago',
		recent: [['13:52', 'Lighthouse · !9be011', 'position']] },
	93500000: { kind: 'audio', proto: 'WFM', protoSub: 'Broadcast · stereo pilot', icon: ICON.broadcast, decoder: 'none', level: -50, snr: 42, live: true,
		eyebrow: 'Broadcast FM', big: '93.500', bigUnit: 'MHz', line: 'No decoder for this signal. Audio only.', state: 'Audio', recent: [] }
};
const ORDER = [161150000, 161975000, 160450000, 160625000];
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const dbt = db => String(Math.round(db)).replace('-', '−') + ' dB';

class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = { freq: 161150000, tick: 0, play: null, saved: false, pinned: false };
	}
	componentDidMount() { this.timer = setInterval(() => this.setState({ tick: this.state.tick + 1 }), 140); }
	componentWillUnmount() { clearInterval(this.timer); }
	componentDidUpdate(prev) { if (prev.freq !== this.props.freq) this.setState({ play: null, saved: false, pinned: false }); }
	tune(f) { if (this.props.onTune) this.props.onTune(f); else this.setState({ freq: f }); }
	act(id, f) { if (this.props.onAction) this.props.onAction(id, f); }
	renderVals() {
		const freq = this.props.freq ?? this.state.freq;
		const floating = this.props.variant === 'floating';
		const t = this.state.tick;
		const x = INFO[freq] || { kind: 'unknown', proto: 'Unidentified', protoSub: (freq / 1e6).toFixed(4) + ' MHz', icon: ICON.unknown, decoder: 'none', level: -96, snr: 9, live: false,
			eyebrow: 'Signal', big: 'Not decoded', line: 'About 12 kHz wide · bursts roughly every 10 s', body: 'No decoder is running here. Try the scanner to identify it.', quiet: 'Nothing decoded on this frequency', recent: [] };
		const voice = x.kind === 'call' || x.kind === 'tx';
		const live = !!x.live;
		const lvl = live || x.kind === 'count' || x.kind === 'audio' ? x.level : -108;
		const snr = live || x.kind === 'count' || x.kind === 'audio' ? x.snr : 3;
		const strength = Math.max(0, Math.min(5, Math.round(snr / 7)));
		const secs = (x.start || 0) + Math.floor(t * 0.14);
		const stateText = live ? (x.state || (voice ? (x.kind === 'call' ? 'Call in progress · ' : 'Transmitting · ') + fmt(secs) : 'Receiving')) : x.quiet || 'Quiet';
		const stateFg = live ? '#7becc7' : x.locked ? '#f2b84b' : '#8ba598';
		const wave = Array.from({ length: 40 }, (_, i) => {
			const h = live ? 15 + Math.abs(Math.sin(i * 1.7 + t * 0.9) * 55 + Math.sin(i * 0.43 + t * 0.37) * 25) : 6 + Math.abs(Math.sin(i * 1.7) * 30);
			return { h: Math.min(100, h), c: live ? '#7becc7' : '#2c443b' };
		});
		const rateBars = Array.from({ length: 30 }, (_, i) => ({ h: 25 + Math.abs(Math.sin(i * 0.9 + (x.big || '').length) * 55 + Math.sin(i * 0.31) * 20), c: i === 29 ? '#7becc7' : 'rgba(123,236,199,.35)' }));
		const recent = (x.recent || []).slice(0, floating ? 2 : 4).map((r, i) => {
			const id = freq + ':' + i, audio = typeof r[3] === 'number', on = this.state.play === id;
			return {
				t: r[0], a: r[1], b: r[2], audio,
				bg: on ? 'rgba(123,236,199,.08)' : 'transparent',
				pBorder: on ? '#7becc7' : 'rgba(123,236,199,.4)', pBg: on ? '#7becc7' : 'transparent', pFg: on ? '#111c19' : '#7becc7', pIcon: on ? PAUSE : PLAY,
				playLabel: on ? 'Playing' : 'Play recording',
				pick: () => { if (audio) this.setState({ play: on ? null : id }); else this.act('open', freq); }
			};
		});
		const btn = (id, label, icon, opt) => {
			const o = opt || {};
			return {
				label, icon, hasLabel: !o.iconOnly, title: o.title || label, flex: o.iconOnly ? '0 0 36px' : '1 1 auto', pressed: o.pressed ? 'true' : 'false',
				border: o.primary ? '#7becc7' : o.pressed ? 'rgba(123,236,199,.6)' : '#2c443b',
				bg: o.primary ? '#7becc7' : o.pressed ? 'rgba(123,236,199,.12)' : 'transparent',
				fg: o.primary ? '#111c19' : o.pressed ? '#7becc7' : '#b9cac1',
				pick: o.pick || (() => this.act(id, freq))
			};
		};
		const actions = [];
		if (x.kind === 'call' && !x.locked) actions.push(btn('replay', live ? 'From start' : 'Play last', A.play, { primary: !live, title: live ? 'Replay this call from the start' : 'Play the last call' }));
		if (x.kind === 'tx' && !live) actions.push(btn('replay', 'Play last', A.play, { primary: true }));
		if (x.map) actions.push(btn('map', 'Map', A.map));
		if (x.kind === 'unknown') actions.push(btn('scan', 'Identify', A.scan, { primary: true }));
		if (x.kind !== 'audio' && x.kind !== 'unknown') actions.push(btn('activity', 'Activity', A.activity));
		actions.push(btn('save', this.state.saved ? 'Saved' : 'Save', A.save, { iconOnly: actions.length >= 1, title: this.state.saved ? 'Saved' : 'Save this frequency', pressed: this.state.saved, pick: () => { this.setState({ saved: !this.state.saved }); this.act('save', freq); } }));
		actions.push(btn('pin', 'Pin', A.pin, { iconOnly: true, title: this.state.pinned ? 'Unpin card' : 'Pin this card. It keeps showing this frequency when you tune away.', pressed: this.state.pinned, pick: () => { this.setState({ pinned: !this.state.pinned }); this.act('pin', freq); } }));
		const body = x.transcript && live ? '“' + x.transcript + '”' : x.body || '';
		const msg = x.kind === 'msg';
		return {
			icon: x.icon, proto: x.proto, protoSub: x.protoSub,
			tileBg: live ? 'rgba(123,236,199,.14)' : '#192b24', tileFg: live ? '#7becc7' : x.kind === 'unknown' ? '#8ba598' : '#b9cac1',
			stateText, stateFg, dotOpacity: live ? (t % 8 < 5 ? 1 : 0.35) : 1,
			freqText: (freq / 1e6).toFixed(freq % 1000 ? 4 : 3),
			levelTitle: 'Signal ' + dbt(lvl) + ' · SNR ' + snr + ' dB · decoder ' + x.decoder,
			sigBars: [2, 4, 6, 8, 10].map((h, i) => ({ h, c: i < strength ? '#7becc7' : '#2c443b' })),
			hasEyebrow: !!x.eyebrow && !msg, eyebrow: x.eyebrow || '',
			hasTitle: msg, titleText: x.eyebrow || '',
			hasBig: !msg && !!x.big,
			big: msg ? '' : x.big || '', bigSize: x.kind === 'count' ? '40px' : '30px',
			hasBigUnit: !!x.bigUnit && !msg, bigUnit: x.bigUnit || '',
			locked: !!x.locked,
			hasTimer: false, timer: '', timerC: '#ff7a6b',
			hasLine: !!x.line && !msg, line: x.line || '',
			hasBody: !!body, body,
			bodySize: msg && !x.mono ? '15px' : '13.5px',
			bodyC: x.bodyPending ? '#8ba598' : msg ? '#f4f7f5' : '#e3ece7',
			bodyFont: x.mono ? "ui-monospace, 'SF Mono', Menlo, monospace" : 'inherit',
			bodyStyle: x.bodyPending ? 'italic' : 'normal',
			hasChips: !!((x.chips && x.chips.length) || x.tone), chips: (x.tone ? [x.tone] : []).concat(x.chips || []).map(c => ({ k: c[0], v: c[1] })),
			hasWave: voice && !x.locked, wave,
			hasRate: x.kind === 'count', rateBars, rate: x.rate || '',
			hasRecent: recent.length > 0, recent,
			recentTitle: voice ? 'Earlier on this frequency' : 'Earlier',
			actions,
			full: !floating,
			others: ORDER.filter(f => f !== freq).map(f => ({ label: INFO[f].proto, sub: INFO[f].big || INFO[f].eyebrow, icon: INFO[f].icon, freq: (f / 1e6).toFixed(3), pick: () => this.tune(f) })),
			pad: floating ? '16px' : '24px',
			bg: floating ? 'rgba(17,28,25,.55)' : '#111c19',
			border: floating ? '1px solid rgba(123,236,199,.14)' : '0',
			radius: floating ? '18px' : '0',
			shadow: floating ? 'inset 0 1px 0 rgba(255,255,255,.09), 0 12px 32px rgba(0,0,0,.35)' : 'none',
			blur: floating ? 'blur(22px) saturate(170%)' : 'none'
		};
	}
}
</script>
</body>
</html>
