<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectrum and waterfall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
body:has([data-wk-ground="paper"]:not([data-wk-theme] *)){background:#f4f0e6}
/* Paper: plot labels are ink on the sheet with a hairline, not glass chips (blur is already none on Paper via --wk-blur) */
[data-wk-theme="light"] .wk-sq{border-top-color:var(--wk-amber) !important}
[data-wk-theme="light"] .wk-sig{box-shadow:none !important}
[data-wk-theme="light"] .wk-zoom{background:var(--wk-surface) !important;border-color:rgba(var(--wk-line-rgb),.22) !important;box-shadow:var(--wk-e2) !important}
[data-wk-theme="light"] .wk-hover{background:var(--wk-surface) !important;border-color:rgba(var(--wk-line-rgb),.26) !important;box-shadow:var(--wk-e2)}
/* discovery ticks on the frequency scale: one new to the scan pings twice (kit wk-ping; reduced motion ends it at once) */
.wk-disc-new{opacity:0;animation:wk-ping 1.2s var(--wk-ease-out) 2}
</style>
</helmet>
<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--wk-plot-bg); color: var(--wk-text); font-family: var(--wk-font-ui); overflow: hidden; user-select: none; touch-action: none">
	<dc-import name="Kit" hint-size="0px,0px" style="position: absolute"></dc-import>
	<div ref="{{refs.box}}" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" onPointerLeave="{{onLeave}}" style="position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; cursor: {{cursor}}">
		<div style="height: {{topInset}}px; flex: none"></div>
		<div style="position: relative; height: {{specH}}px; flex: none">
			<canvas ref="{{refs.spec}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
			<sc-for list="{{dbLabels}}" as="l" hint-placeholder-count="4">
				<span style="position: absolute; left: 10px; top: {{l.top}}px; transform: translateY(-50%); font-size: 11px; color: rgba(var(--wk-ink-2-rgb),.5); font-variant-numeric: tabular-nums; pointer-events: none">{{l.text}}</span>
			</sc-for>
			<sc-if value="{{scanOn}}" hint-placeholder-val="{{false}}">
				<div title="{{scanTitle}}" style="position: absolute; top: 0; bottom: 0; left: {{scanLeft}}%; width: {{scanWidth}}%; box-sizing: border-box; background: rgba({{scanRgb}},.05); border-left: 1px dashed rgba({{scanRgb}},.4); border-right: 1px dashed rgba({{scanRgb}},.4); pointer-events: none">
					<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba({{scanRgb}},.55)"></span>
				</div>
				<span class="wk-scan-name" style="position: absolute; top: 6px; left: {{scanLabelX}}px; display: flex; flex-direction: column; gap: 2px; line-height: 15px; font-family: var(--wk-font-head); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: {{scanC}}; white-space: nowrap; pointer-events: none">{{scanName}}<sc-if value="{{scanHasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: var(--wk-text-3)">{{scanSub}}</span></sc-if></span>
				<sc-for list="{{scanChans}}" as="c" hint-placeholder-count="0">
					<span aria-hidden="true" style="position: absolute; left: {{c.left}}%; bottom: 3px; width: 1px; height: 6px; background: rgba({{scanRgb}},.5); pointer-events: none"></span>
				</sc-for>
				<sc-if value="{{scanHit}}" hint-placeholder-val="{{false}}">
					<sc-if value="{{scanHitLine}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: {{scanHitLeft}}%; width: 1px; background: rgba({{scanRgb}},.6); pointer-events: none"></span></sc-if>
					<span role="status" aria-label="{{scanHitAria}}" style="position: absolute; left: {{scanHitLeft}}%; bottom: 12px; transform: translateX(-50%); height: 20px; display: flex; align-items: center; padding: 0 7px; border-radius: 4px; background: {{scanHitBg}}; box-shadow: inset 0 0 0 1px rgba({{scanRgb}},.5); color: {{scanHitFg}}; font-size: 11px; font-weight: 700; white-space: nowrap; pointer-events: none">{{scanHitText}}</span>
				</sc-if>
			</sc-if>
			<sc-for list="{{markers}}" as="m" hint-placeholder-count="4">
				<div style="position: absolute; left: {{m.left}}%; top: {{m.top}}px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center">
					<button class="wk-sig" onPointerDown="{{stop}}" onClick="{{m.pick}}" aria-label="Tune to {{m.label}} {{m.freq}} MHz" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: 6px; background: var(--wk-glass-strong); border: 1px solid {{m.border}}; box-shadow: inset 0 1px 0 var(--wk-glass-hi); color: var(--wk-text); font-size: 12px; white-space: nowrap">
						<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--wk-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{m.icon}}" as="p"><path d="{{p}}"></path></sc-for></svg>
						<span style="font-weight: 700">{{m.label}}</span>
						<sc-if value="{{m.hasSub}}" hint-placeholder-val="{{true}}"><span style="color: var(--wk-text-3)">{{m.sub}}</span></sc-if>
					</button>
					<span style="width: 1px; height: {{m.lead}}px; background: rgba(var(--wk-accent-rgb),.45)"></span>
				</div>
			</sc-for>
			<sc-if value="{{hasSq}}" hint-placeholder-val="{{false}}">
				<div class="wk-sq" style="position: absolute; left: {{vfoLeft}}%; top: {{sqTop}}px; width: max(180px, {{vfoWidth}}%); transform: translateX(-50%); border-top: 1px dashed rgba(var(--wk-amber-rgb),.75); pointer-events: none">
					<span style="position: absolute; right: 0; top: -17px; font-family: var(--wk-font-head); font-size: 11px; letter-spacing: .1em; color: var(--wk-amber)">SQUELCH</span>
				</div>
			</sc-if>
			<div class="wk-zoom" style="position: absolute; right: 12px; bottom: 10px; display: flex; align-items: center; gap: 2px; height: 32px; padding: 0 4px; border-radius: 8px; background: var(--wk-glass-strong); border: 1px solid var(--wk-line-14); box-shadow: inset 0 1px 0 var(--wk-glass-hi)" onPointerDown="{{stop}}">
				<button class="wk-icon-btn" data-size="sm" onClick="{{zoomOut}}" aria-label="Zoom out" style="font-size: 16px">−</button>
				<div style="position: relative; width: 84px; height: 6px; border-radius: 3px; background: var(--wk-line-solid)" aria-hidden="true">
					<div style="position: absolute; top: 0; bottom: 0; left: {{ovLeft}}%; width: max(3px, {{ovWidth}}%); border-radius: 3px; background: var(--wk-accent)"></div>
				</div>
				<button class="wk-icon-btn" data-size="sm" onClick="{{zoomIn}}" aria-label="Zoom in" style="font-size: 16px">+</button>
				<button class="wk-btn" data-variant="ghost" data-size="sm" onClick="{{zoomFit}}" aria-label="Show the whole capture" style="padding: 0 7px; min-width: 44px; color: var(--wk-text-3); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums">{{zoomText}}</button>
			</div>
		</div>
		<div style="position: relative; height: 30px; flex: none; border-top: 1px solid rgba(var(--wk-line-rgb),.08); background: var(--wk-plot-bg); overflow: hidden">
			<sc-for list="{{scaleTicks}}" as="k" hint-placeholder-count="0">
				<span title="{{k.title}}" style="position: absolute; left: {{k.left}}%; top: 0; width: 2px; height: 6px; margin-left: -1px; border-radius: 0 0 1px 1px; background: {{k.c}}; opacity: {{trustDim}}">
					<sc-if value="{{k.fresh}}" hint-placeholder-val="{{false}}"><span class="wk-disc-new" aria-hidden="true" style="position: absolute; left: -2px; top: 0; width: 6px; height: 6px; border-radius: 50%; background: {{k.c}}"></span></sc-if>
				</span>
			</sc-for>
			<sc-for list="{{ticks}}" as="t" hint-placeholder-count="12">
				<span style="position: absolute; left: {{t.left}}%; top: 8px; transform: translateX(-50%); font-size: 11px; color: var(--wk-text-3); opacity: {{trustDim}}; font-variant-numeric: tabular-nums; white-space: nowrap">{{t.text}}</span>
			</sc-for>
			<sc-if value="{{unverified}}" hint-placeholder-val="{{false}}">
				<span role="status" title="The receiver has not confirmed its tuning, so frequencies may be off" style="position: absolute; right: 8px; top: 5px; height: 20px; display: flex; align-items: center; gap: 4px; padding: 0 7px 0 6px; border-radius: 4px; background: var(--wk-amber-fill); box-shadow: inset 0 0 0 1px rgba(var(--wk-amber-rgb),.32); color: var(--wk-amber); font-size: 11px; font-weight: 700; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"></path><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"></path><path d="M12 16h.01"></path></svg>Frequencies unverified</span>
			</sc-if>
			<sc-if value="{{vfoVisible}}" hint-placeholder-val="{{true}}">
				<span style="position: absolute; left: {{vfoLeft}}%; top: 5px; transform: translateX(-50%); height: 20px; padding: 0 7px; border-radius: 4px; background: var(--wk-accent); color: var(--wk-on-accent); font-size: 11px; font-weight: 700; line-height: 20px; font-variant-numeric: tabular-nums; white-space: nowrap">{{vfoText}}</span>
			</sc-if>
		</div>
		<div style="position: relative; height: 24px; flex: none; border-bottom: 1px solid rgba(var(--wk-line-rgb),.08); overflow: hidden; isolation: isolate">
			<sc-for list="{{bands}}" as="b" hint-placeholder-count="3">
				<div title="{{b.title}}" style="position: absolute; left: {{b.left}}%; width: {{b.width}}%; top: 4px; height: 16px; z-index: {{b.z}}; border-top: 2px solid {{b.rule}}; box-shadow: inset 1px 0 0 {{b.edgeL}}, inset -1px 0 0 {{b.edgeR}}; box-sizing: border-box; opacity: {{b.op}}">
					<sc-if value="{{b.showLabel}}" hint-placeholder-val="{{true}}"><span style="position: absolute; left: 6px; top: 1px; display: flex; align-items: center; gap: 4px; max-width: {{b.labelMax}}px; font-family: var(--wk-font-head); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: {{b.fg}}; white-space: nowrap"><span aria-hidden="true" style="width: 6px; height: 6px; flex: none; border-radius: 2px; background: {{b.sw}}"></span><span style="overflow: hidden; text-overflow: ellipsis">{{b.label}}</span></span></sc-if>
				</div>
			</sc-for>
			<sc-for list="{{saved}}" as="s" hint-placeholder-count="2">
				<button onPointerDown="{{stop}}" onClick="{{s.pick}}" aria-label="Saved: {{s.label}}" style="font: inherit; cursor: pointer; position: absolute; left: {{s.left}}%; top: 3px; height: 18px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 4px; border: 0; border-radius: 4px; background: rgba(var(--wk-accent-rgb),.12); color: var(--wk-accent); font-size: 11px; font-weight: 700; white-space: nowrap">
					<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 7v14l-6 -4l-6 4v-14a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4z"></path></svg>{{s.label}}
				</button>
			</sc-for>
		</div>
		<sc-if value="{{hasDiscRow}}" hint-placeholder-val="{{false}}">
			<div style="position: relative; height: 20px; flex: none; border-bottom: 1px solid rgba(var(--wk-line-rgb),.08); overflow: hidden; opacity: {{trustDim}}">
				<sc-for list="{{discTags}}" as="d" hint-placeholder-count="3">
					<button onPointerDown="{{stop}}" onClick="{{d.pick}}" aria-label="{{d.aria}}" title="{{d.aria}}" style="font: inherit; cursor: pointer; position: absolute; left: calc({{d.left}}% - 7px); top: 2px; height: 16px; display: flex; align-items: center; gap: 4px; padding: 0 5px 0 4px; border: 0; border-radius: 4px; background: {{d.bg}}; color: {{d.fg}}; font-size: 11px; font-weight: {{d.weight}}; white-space: nowrap">
						<span style="width: 6px; height: 6px; flex: none; box-sizing: border-box; border-radius: 50%; border: 1.25px solid {{d.dot}}; background: {{d.dotFill}}"></span>{{d.label}}
					</button>
				</sc-for>
			</div>
		</sc-if>
		<div style="position: relative; flex: 1; min-height: 0">
			<canvas ref="{{refs.wf}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
		</div>

		<sc-if value="{{vfoVisible}}" hint-placeholder-val="{{true}}">
			<div style="position: absolute; top: {{topInset}}px; bottom: 0; left: {{vfoLeft}}%; width: max(7px, {{vfoWidth}}%); transform: translateX(-50%); background: rgba(var(--wk-accent-rgb),.10); pointer-events: none">
				<div onPointerDown="{{grabVfo}}" title="Drag to tune" style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; pointer-events: auto; cursor: grab"></div>
				<div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(var(--wk-accent-rgb),.75); pointer-events: none"></div>
				<sc-if value="{{edges}}" hint-placeholder-val="{{false}}">
					<div onPointerDown="{{grabL}}" title="Drag to change bandwidth" style="position: absolute; top: 0; bottom: 0; left: -5px; width: 10px; pointer-events: auto; cursor: ew-resize; display: flex; justify-content: center"><span style="width: 2px; height: 100%; background: rgba(var(--wk-accent-rgb),.55)"></span></div>
					<div onPointerDown="{{grabR}}" title="Drag to change bandwidth" style="position: absolute; top: 0; bottom: 0; right: -5px; width: 10px; pointer-events: auto; cursor: ew-resize; display: flex; justify-content: center"><span style="width: 2px; height: 100%; background: rgba(var(--wk-accent-rgb),.55)"></span></div>
				</sc-if>
			</div>
		</sc-if>
		<sc-if value="{{hasRsel}}" hint-placeholder-val="{{false}}">
			<div aria-hidden="true" style="position: absolute; top: {{topInset}}px; bottom: 0; left: {{rselLeft}}%; width: {{rselWidth}}%; box-sizing: border-box; background: rgba(var(--wk-accent-rgb),.08); border-left: 1px dashed rgba(var(--wk-accent-rgb),.7); border-right: 1px dashed rgba(var(--wk-accent-rgb),.7); pointer-events: none"></div>
		</sc-if>
		<sc-if value="{{rselOffer}}" hint-placeholder-val="{{false}}">
			<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" onPointerDown="{{stop}}" style="position: absolute; top: {{rselTop}}px; left: {{rselMid}}%; transform: translateX(-50%); z-index: 2; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 8px; background: var(--wk-glass-panel); border: 1px solid var(--wk-line-18); box-shadow: var(--wk-e2); -webkit-backdrop-filter: var(--wk-blur); backdrop-filter: var(--wk-blur)">
				<button class="wk-btn" data-variant="primary" data-size="lg" onClick="{{scanSel}}" style="padding: 0 11px 0 9px; font-variant-numeric: tabular-nums">
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12h-8a1 1 0 1 0 -1 1v8a9 9 0 0 0 9 -9"></path><path d="M16 9a5 5 0 1 0 -7 7"></path><path d="M20.486 9a9 9 0 1 0 -11.482 11.495"></path></svg>Scan this range<span style="font-weight: 400">{{rselText}}</span>
				</button>
				<button class="wk-icon-btn" data-size="lg" onClick="{{clearSel}}" aria-label="Clear the selected range"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6l-12 12"></path></svg></button>
			</div>
		</sc-if>
		<sc-if value="{{hasSent}}" hint-placeholder-val="{{false}}">
			<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" role="status" style="position: absolute; top: {{rselTop}}px; left: 50%; transform: translateX(-50%); z-index: 2; height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; background: var(--wk-fill-glass); border: 1px solid var(--wk-line-14); font-size: 12.5px; color: var(--wk-text-soft); white-space: nowrap; font-variant-numeric: tabular-nums">{{sentText}}</div>
		</sc-if>
		<sc-if value="{{hovering}}" hint-placeholder-val="{{false}}">
			<div style="position: absolute; top: {{topInset}}px; bottom: 0; left: {{hoverLeft}}%; width: 1px; background: rgba(var(--wk-ink-rgb),.28); pointer-events: none">
				<span class="wk-hover" style="position: absolute; top: {{hoverTagTop}}px; left: 0; transform: translateX(-50%); height: 20px; line-height: 20px; padding: 0 8px; border-radius: 4px; background: var(--wk-fill); border: 1px solid var(--wk-line-14); font-size: 11px; z-index: 1; white-space: nowrap; font-variant-numeric: tabular-nums">{{hoverText}}</span>
			</div>
		</sc-if>
	</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"accent":{"editor":"enum","options":["phosphor","ice","violet","coral","mono"],"default":"mono","section":"Theme"},"ground":{"editor":"enum","options":["ink","graphite","black"],"default":"black","section":"Theme"},"vfo":{"editor":null,"tsType":"number"},"onTune":{"editor":null},"onBandwidth":{"editor":null},"showMarkers":{"editor":"boolean","default":true},"palette":{"editor":"enum","options":["match","amber","mono","classic"],"default":"match"},"paperRamp":{"editor":"enum","options":["a","b","c"],"default":"a","section":"Theme"},"specHeight":{"editor":"range","min":160,"max":420,"step":10,"unit":"px","default":260},"topInset":{"editor":null,"tsType":"number"},"bandwidth":{"editor":null,"tsType":"number"},"squelch":{"editor":null,"tsType":"number"},"step":{"editor":null,"tsType":"number"},"sampleRate":{"editor":null,"tsType":"number"},"saved":{"editor":null},"discoveries":{"editor":null},"discoveryTags":{"editor":"enum","options":["all","decoded","off"],"default":"all"},"trust":{"editor":"enum","options":["ok","unverified"],"default":"ok"},"onView":{"editor":null},"onScanRange":{"editor":null},"scan":{"editor":null},"scanDemo":{"editor":"enum","options":["off","watch","watch-hit","sweep"],"default":"off"},"$preview":{"width":1440,"height":640}}'>

			const lw = b.label.length * 7.8 + 24;
			segs.forEach(g => {
				const px = (g[1] - g[0]) / span * w, lx = (g[0] - L) / span * w;
				const named = g === best && px >= lw && !savedTaken.some(o => o[0] < lx + lw && o[1] > lx);
				const starts = g[0] === b.from, ends = g[1] === b.to;
				out.push({
					left: (g[0] - L) / span * 100, width: (g[1] - g[0]) / span * 100, label: b.label, showLabel: named, title: b.title,
					sw: 'var(--wk-grp-' + b.group + ')', z: 1 + b.depth,
					rule: b.skip ? 'rgba(var(--wk-line-rgb),.14)' : 'rgba(var(--wk-line-rgb),.28)',
					fg: b.skip ? 'var(--wk-text-4)' : 'var(--wk-text-3)', op: b.skip ? 0.7 : 1,
					edgeL: starts ? 'rgba(var(--wk-line-rgb),.28)' : 'transparent', edgeR: ends ? 'rgba(var(--wk-line-rgb),.28)' : 'transparent',
					labelMax: Math.max(0, px - 12)
				});
			});
		});
		this.laneKey = key; this.laneOut = out;
		return out;
	}
	renderVals() {
		const s = this.state, cap = this.cap();
		const specH = this.props.specHeight ?? 260;
		const inset = this.props.topInset ?? 0;
		const vfo = this.vfo();
		const L = s.viewL, span = s.viewSpan, R = L + span;
		const pct = f => (f - L) / span * 100;
		const w = s.boxW || this.w || 1200;
		const bw = this.props.bandwidth ?? 12500;
		const inView = f => f >= L && f <= R;
		// signal tags: tuned first, then strongest; each tries its spot above the peak, then
		// higher rows, then a compact form without the detail; one that still clashes is dropped
		const taken = [];
		// where the scan looks: a quiet shade over its window, a name at its top left (signal tags keep clear of it), the
		// band's channel raster as ticks at the foot, and the channel that came alive named on a chip
		const sc = this.scan(), scOn = !!sc && sc.b > L && sc.a < R;
		const scL = scOn ? pct(Math.max(L, sc.a)) : 0, scW = scOn ? (Math.min(R, sc.b) - Math.max(L, sc.a)) / span * 100 : 0;
		const scName = !sc ? '' : sc.watch ? (sc.paused ? 'Paused · ' : 'Watching ') + sc.name + (sc.chans && sc.chans.length ? ' · ' + sc.chans.length + ' channels' : '') : (sc.paused ? 'Paused · ' : 'Scanning · ') + (sc.a / 1e6).toFixed(1) + '–' + (sc.b / 1e6).toFixed(1) + ' MHz';
		const scSub = sc && sc.watch && sc.centreHz ? 'receiver at ' + (sc.centreHz / 1e6).toFixed(3) : '';
		const scLabelX = scOn ? Math.max(40, scL / 100 * w + 8) : 0;
		if (scOn) taken.push([scLabelX - 4, 2, scLabelX + 10 + scName.length * 6.4, scSub ? 40 : 26]);
		const hitIn = scOn && sc.hitHz && inView(sc.hitHz);
		const clash = r => r[0] < 34 || taken.some(o => r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]);
		const markers = (this.props.showMarkers ?? true) ? SIG.filter(x => x.label && inView(x.f)).sort((a, b) => (b.f === vfo) - (a.f === vfo) || b.p - a.p).map(x => {
			const px = pct(x.f) / 100 * w, pref = Math.max(4, yOf(x.p, specH) - 46);
			const full = 44 + x.label.length * 7.4 + (x.sub ? 6 + x.sub.length * 6.6 : 0), compact = 40 + x.label.length * 7.4;
			for (const [wd, hasSub] of [[full, !!x.sub], [compact, false]]) {
				for (const dy of [0, -30, -60]) {
					const top = pref + dy;
					if (top < 4) continue;
					const r = [px - wd / 2 - 3, top - 2, px + wd / 2 + 3, top + 28];
					if (clash(r)) continue;
					taken.push(r);
					return { left: pct(x.f), top, lead: 10 - dy, label: x.label, sub: x.sub, hasSub, freq: (x.f / 1e6).toFixed(3), icon: ICON[x.cat], border: x.f === vfo ? 'rgba(var(--wk-accent-rgb),.55)' : this.props.theme === 'light' ? 'rgba(var(--wk-line-rgb),.30)' : 'rgba(var(--wk-line-rgb),.14)', pick: e => { e.stopPropagation(); this.tuneTo(x.f); } };
				}
			}
			return null;
		}).filter(Boolean) : [];
		const savedTaken = [];
		const saved = (this.props.saved || []).filter(x => inView(x.f)).sort((a, b) => a.f - b.f).filter(x => {
			const px = pct(x.f) / 100 * w, r = [px, px + 24 + x.label.length * 6.6];
			if (savedTaken.some(o => r[0] < o[1] + 4 && r[1] > o[0] - 4)) return false;
			savedTaken.push(r); return true;
		}).map(x => ({ left: pct(x.f), label: x.label, pick: e => { e.stopPropagation(); this.tuneTo(x.f); } }));
		// discovery tags: a third, quieter tier under the saved tags. Active first, then by confidence;
		// a discovery already saved is not tagged again (saved wins); one that still clashes is dropped
		const tagMode = this.props.discoveryTags ?? 'all';
		const discAll = (this.props.discoveries ?? DISCOVERIES).filter(d => !d.ignored && (tagMode === 'all' || (tagMode === 'decoded' && d.conf === 'decoded')));
		const savedList = this.props.saved || [];
		const discTaken = [];
		const discTags = tagMode === 'off' ? [] : discAll.filter(d => inView(d.hz) && !savedList.some(x => Math.abs(x.f - d.hz) <= Math.max(1000, (d.bw || 12500) / 2)))
			.sort((a, b) => (b.active - a.active) || (CONF_RANK[b.conf] - CONF_RANK[a.conf]) || (b.recent - a.recent))
			.filter(d => {
				const px = pct(d.hz) / 100 * w - 7, r = [px, px + 22 + d.label.length * 5.9];
				if (discTaken.some(o => r[0] < o[1] + 4 && r[1] > o[0] - 4)) return false;
				discTaken.push(r); return true;
			})
			.map(d => {
				const solid = d.conf === 'decoded', heard = d.conf === 'heard';
				const when = d.active ? 'active now' : d.recent ? 'heard in the last hour' : 'heard earlier';
				// three readable steps: active (bright, filled), heard in the last hour (dimmed phosphor, or grey when only heard), older (muted grey, still 4.5:1)
				const tone = d.active ? 'var(--wk-accent)' : d.recent ? (heard ? 'var(--wk-text-2)' : 'rgba(var(--wk-accent-rgb),.72)') : 'var(--wk-text-4)';
				return {
					left: pct(d.hz), label: d.label,
					aria: d.label + (d.sub ? ' · ' + d.sub : '') + ' · ' + (d.hz / 1e6).toFixed(4) + ' MHz · ' + when,
					fg: d.active ? 'var(--wk-accent)' : tone,
					bg: d.active ? 'rgba(var(--wk-accent-rgb),.12)' : 'transparent',
					weight: d.active ? 700 : 400,
					dot: tone, dotFill: solid ? tone : 'transparent',
					pick: e => { e.stopPropagation(); this.tuneTo(d.hz); }
				};
			});
		const unverified = this.props.trust === 'unverified';
		const zoom = cap / span;
		const h = s.hover;
		return {
			// theme scope: Immersive passes its theme and accent; standalone, the board's own tweaks
			wkTheme: this.props.theme === 'light' ? 'light' : 'dark', wkAccent: this.props.accent || 'mono', wkGround: this.props.theme === 'light' ? 'paper' : (this.props.ground || 'black'),
			hasDiscRow: tagMode !== 'off' && discAll.length > 0,
			scanOn: scOn, scanLeft: scL, scanWidth: scW, scanName: scName, scanSub: scSub, scanHasSub: !!scSub, scanLabelX: scLabelX,
			scanC: sc && sc.paused ? 'var(--wk-amber)' : 'var(--wk-accent)', scanRgb: sc && sc.paused ? 'var(--wk-amber-rgb)' : 'var(--wk-accent-rgb)',
			scanTitle: sc ? (sc.watch ? sc.name + ' fits in one hop: the receiver stays at ' + ((sc.centreHz || 0) / 1e6).toFixed(3) + ' and watches every channel at once' : 'This hop · ' + (sc.a / 1e6).toFixed(3) + '–' + (sc.b / 1e6).toFixed(3) + ' MHz · the scan steps on') : '',
			scanChans: scOn && sc.chans && sc.chans.length <= 400 ? sc.chans.filter(inView).map(f => ({ left: pct(f) })) : [],
			scanHit: !!hitIn, scanHitLeft: hitIn ? pct(sc.hitHz) : 0, scanHitText: hitIn ? sc.hitName || (sc.hitHz / 1e6).toFixed(5) : '',
			scanHitBg: hitIn && sc.hear ? 'var(--wk-accent)' : 'var(--wk-surface)', scanHitFg: hitIn && sc.hear ? 'var(--wk-on-accent)' : 'var(--wk-accent)',
			scanHitLine: hitIn && !sc.hear, scanHitAria: hitIn ? (sc.hear ? 'Hearing ' : 'Active, logged: ') + (sc.hitName || '') + ' ' + (sc.hitHz / 1e6).toFixed(5) + ' MHz' : '',
			// every discovery in view also marks the frequency scale, so a sweep that moves the view still shows what it found
			scaleTicks: tagMode === 'off' ? [] : discAll.filter(d => inView(d.hz)).map(d => ({ left: pct(d.hz), fresh: !!d.fresh, c: d.active || d.fresh ? 'var(--wk-accent)' : d.conf === 'heard' ? 'rgba(var(--wk-ink-3-rgb),.7)' : 'rgba(var(--wk-accent-rgb),.6)', title: d.label + ' · ' + (d.hz / 1e6).toFixed(4) + ' MHz' + (d.fresh ? ' · new in this scan' : '') })),
			discTags,
			unverified,
			trustDim: unverified ? 0.45 : 1,
			refs: this.refsObj,
			onDown: this.onDown, onMove: this.onMove, onUp: this.onUp, onLeave: this.onLeave, stop: this.stop,
			grabVfo: this.grabVfo, grabL: this.grabL, grabR: this.grabR,
			hasRsel: !!s.rsel && s.rsel.b > L && s.rsel.a < R,
			rselLeft: s.rsel ? pct(Math.max(L, s.rsel.a)) : 0,
			rselWidth: s.rsel ? (Math.min(R, s.rsel.b) - Math.max(L, s.rsel.a)) / span * 100 : 0,
			rselOffer: !!s.rsel && s.rsel.done && s.rsel.b > L && s.rsel.a < R,
			rselMid: s.rsel ? Math.max(14, Math.min(86, pct((Math.max(L, s.rsel.a) + Math.min(R, s.rsel.b)) / 2))) : 50,
			rselTop: inset + 10,
			rselText: s.rsel ? (s.rsel.a / 1e6).toFixed(3) + '–' + (s.rsel.b / 1e6).toFixed(3) : '',
			scanSel: this.scanSel, clearSel: this.clearSel,
			hasSent: !!s.sent, sentText: s.sent ? 'Scan a band opens with ' + s.sent + ' MHz' : '',
			cursor: s.dragging === 'range' ? 'col-resize' : s.dragging === 'pan' ? 'grabbing' : s.dragging === 'edge' ? 'ew-resize' : s.dragging === 'vfo' ? 'grabbing' : 'crosshair',
			topInset: inset,
			specH,
			dbLabels: [-50, -70, -90, -110].map(db => ({ top: yOf(db, specH), text: String(db).replace('-', '−') })),
			markers,
			saved,
			ticks: tickList(L, span, w).map(t => ({ left: pct(t.f), text: t.text })),
			bands: this.lanes(L, R, w, savedTaken),
			vfoVisible: inView(vfo),
			vfoLeft: pct(vfo),
			vfoWidth: bw / span * 100,
			edges: bw / span * w >= 24 && !!this.props.onBandwidth,
			vfoText: (vfo / 1e6).toFixed(span < 400e3 ? 4 : 3),
			hasSq: typeof this.props.squelch === 'number' && this.props.squelch > -120 && inView(vfo),
			sqTop: typeof this.props.squelch === 'number' ? yOf(this.props.squelch, specH) : 0,
			zoomIn: this.zoomIn, zoomOut: this.zoomOut, zoomFit: this.zoomFit,
			zoomText: zoom < 1.05 ? 'Fit' : (zoom < 10 ? zoom.toFixed(1) : Math.round(zoom)) + '×',
			ovLeft: (L - (s.center - cap / 2)) / cap * 100,
			ovWidth: span / cap * 100,
			hovering: !!h && !s.dragging,
			hoverLeft: h ? h.left : 0,
			hoverText: h ? h.text : '',
			hoverTagTop: specH + 5
		};
	}
}
</script>
