				} else if (d.kind === 'edge' && this.props.onBandwidth) {
					const bw = Math.round(Math.abs(this.fAt(e.clientX) - this.vfo()) * 2 / 100) * 100;
					this.props.onBandwidth(Math.max(500, Math.min(250000, bw)));
				}
				return;
			}

		};
		this.onUp = e => {
			const d = this.drag;
			this.drag = null;
			if (this.boxEl && this.boxEl.hasPointerCapture && this.boxEl.hasPointerCapture(e.pointerId)) this.boxEl.releasePointerCapture(e.pointerId);
			this.setState({ dragging: null });
			if (d && d.kind === 'pan' && !d.moved && e.type === 'pointerup') this.clickTune(e.clientX);
		};
		this.onLeave = () => { if (!this.drag) this.setState({ hover: null }); };
		this.zoomBy = k => {
			const s = this.state, v = this.vfo();
			const anchor = v >= s.viewL && v <= s.viewL + s.viewSpan ? v : s.viewL + s.viewSpan / 2;
			const span = this.clampSpan(s.viewSpan * k);
			const frac = (anchor - s.viewL) / s.viewSpan;
			this.setView(anchor - frac * span, span);
		};

		this.zoomOut = () => this.zoomBy(2);
		this.zoomFit = () => { const cap = this.cap(); this.setView(this.state.center - cap / 2, cap); };
	}
	cap() { return this.props.sampleRate ?? 2.4e6; }
	vfo() { return this.props.vfo ?? this.state.vfo; }
	clampSpan(span) { return Math.min(this.cap(), Math.max(MIN_SPAN, span)); }
	fAt(clientX) {
		const r = this.boxEl.getBoundingClientRect();
		return this.state.viewL + (clientX - r.left) / r.width * this.state.viewSpan;
	}
	setView(viewL, span, center) {
		const cap = this.cap();
		span = this.clampSpan(span);
		let c = center ?? this.state.center;
		if (viewL < c - cap / 2) c = viewL + cap / 2;
		if (viewL + span > c + cap / 2) c = viewL + span - cap / 2;
		c = Math.min(HI - cap / 2, Math.max(LO + cap / 2, Math.round(c / 1000) * 1000));
		viewL = Math.min(c + cap / 2 - span, Math.max(c - cap / 2, viewL));
		this.dirty = true;
		this.setState({ center: c, viewL, viewSpan: span });
	}
	ensureVisible(f) {
		const cap = this.cap(), s = this.state, margin = cap * 0.02;
		if (f < s.center - cap / 2 + margin || f > s.center + cap / 2 - margin) this.setView(f - s.viewSpan / 2, s.viewSpan, f);
		else if (f < s.viewL || f > s.viewL + s.viewSpan) this.setView(f - s.viewSpan / 2, s.viewSpan);
	}
	tuneTo(f) {
		f = Math.min(HI, Math.max(LO, f));
		if (this.props.onTune) this.props.onTune(f);
		else { this.setState({ vfo: f }); this.ensureVisible(f); }
	}
	clickTune(x) {
		const f = this.fAt(x), tol = this.state.viewSpan / 60;
		let best = null;
		for (const s of SIG) if (Math.abs(s.f - f) < tol && (!best || Math.abs(s.f - f) < Math.abs(best.f - f))) best = s;
		const step = this.props.step ?? 12500;
		this.tuneTo(best ? best.f : Math.round(f / step) * step);
	}
	hoverAt(x) {
		if (!this.boxEl) return;
		const r = this.boxEl.getBoundingClientRect();
		const frac = Math.min(1, Math.max(0, (x - r.left) / r.width));
		const f = this.state.viewL + frac * this.state.viewSpan;
		let db = null;
		if (this.avg) {
			const b = Math.floor((f - (this.state.center - this.cap() / 2)) / (this.cap() / BINS));
			if (b >= 0 && b < BINS) db = Math.round(this.avg[b]);
		}
		this.setState({ hover: { left: frac * 100, text: (f / 1e6).toFixed(4) + ' MHz' + (db === null ? '' : '  ·  ' + String(db).replace('-', '−') + ' dB') } });
	}
	onWheel(e) {
		e.preventDefault();
		const s = this.state;
		if (e.ctrlKey || e.metaKey) {
			const f0 = this.fAt(e.clientX), frac = (f0 - s.viewL) / s.viewSpan;
			const span = this.clampSpan(s.viewSpan * Math.exp(e.deltaY * 0.004));
			this.setView(f0 - frac * span, span);
		} else if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
			const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
			this.setView(s.viewL + dx / this.boxEl.clientWidth * s.viewSpan, s.viewSpan);
		} else {
			this.wheelAcc += e.deltaY;
			if (Math.abs(this.wheelAcc) < 40) return;
			const step = this.props.step ?? 12500;
			const dir = this.wheelAcc < 0 ? 1 : -1;
			this.wheelAcc = 0;
			this.tuneTo(Math.round((this.vfo() + dir * step) / step) * step);
		}
	}
	componentDidMount() { this.raf = requestAnimationFrame(this.frame); }
	componentWillUnmount() { cancelAnimationFrame(this.raf); if (this.boxEl) this.boxEl.removeEventListener('wheel', this.onWheel); }
	componentDidUpdate(prev) {
		if ((prev.sampleRate ?? 2.4e6) !== this.cap()) {
			this.count = 0; this.avg = null;
			this.setView(this.state.center - this.cap() / 2, this.cap());
		} else if (this.props.vfo != null && prev.vfo !== this.props.vfo && !(this.drag && this.drag.kind === 'vfo')) {
			this.ensureVisible(this.props.vfo);
		}
	}

	active(s, t) {
		const ph = s.ph || 0;
		if (s.kind === 'steady' || s.kind === 'wfm') return true;
		if (s.kind === 'pulse') return Math.random() < 0.5;
		if (s.kind === 'ais') return ((t + ph) * 1000) % 2300 < 45;
		const on = ((t + ph) % s.per) < s.on;
		if (s.kind === 'tdma') return on && Math.random() > 0.12;
		return on;
	}
	gen(t, center, out) {
		const cap = this.cap(), binHz = cap / BINS, capL = center - cap / 2;
		for (let i = 0; i < BINS; i++) {
			const r = Math.random() + Math.random() + Math.random() - 1.5;
			const x = (i / BINS - 0.5) * 2;
			out[i] = -113 + r * 3.4 - 9 * Math.pow(Math.abs(x), 12);
		}
		out[BINS / 2] = Math.max(out[BINS / 2], -93 + Math.random() * 2);
		for (const s of SIG) {
			const reach = s.bw * 1.5;
			if (s.f + reach < capL || s.f - reach > capL + cap || !this.active(s, t)) continue;
			const half = s.bw / 2;
			const i0 = Math.max(0, Math.floor((s.f - reach - capL) / binHz));
			const i1 = Math.min(BINS - 1, Math.ceil((s.f + reach - capL) / binHz));
			for (let i = i0; i <= i1; i++) {
				const d = Math.abs(capL + (i + 0.5) * binHz - s.f);
				let v;
				if (s.kind === 'am' && d < binHz * 1.5) v = s.p + 7 + Math.random();
				else if (s.kind === 'am' && d <= half) v = s.p - 9 - 9 * (d / half) + (Math.random() - 0.5) * 7;
				else if (s.kind === 'wfm' && d <= half) v = s.p - 5 * (d / half) * (d / half) + (Math.random() - 0.5) * 6 + (Math.abs(d - 19e3) < binHz ? 3 : 0);
				else if (s.kind === 'pulse' && d <= half) v = s.p - 14 * (d / half) * (d / half) + (Math.random() - 0.5) * 8;
				else if (d <= half) v = s.kind === 'steady' ? s.p + (Math.random() - 0.5) : s.p - 4 * (d / half) * (d / half) + (Math.random() - 0.5) * 5;
				else v = s.p - 10 - 34 * (d - half) / s.bw + (Math.random() - 0.5) * 3;
				if (v > out[i]) out[i] = v;
			}
		}
	}
	buildLut() {
		const stops = PAL[this.props.palette] || PAL.phosphor;
		const lut = new Uint8ClampedArray(256 * 3);
		for (let i = 0; i < 256; i++) {
			const t = i / 255;
			let k = 0;
			while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
			const a = stops[k], b = stops[k + 1];
			const u = Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])));
			for (let j = 0; j < 3; j++) lut[i * 3 + j] = a[1][j] + (b[1][j] - a[1][j]) * u;
		}
		this.lut = lut; this.lutName = this.props.palette;
	}
	mapFor(center) {
		const s = this.state, key = center + '|' + s.viewL + '|' + s.viewSpan + '|' + this.w;
		let m = this.maps.get(key);
		if (m) return m;
		if (this.maps.size > 64) this.maps.clear();
		const cap = this.cap(), binHz = cap / BINS, capL = center - cap / 2, w = this.w;
		const b0 = new Int32Array(w), b1 = new Int32Array(w);
		for (let x = 0; x < w; x++) {
			const fa = s.viewL + x / w * s.viewSpan, fb = s.viewL + (x + 1) / w * s.viewSpan;
			let a = Math.floor((fa - capL) / binHz), b = Math.floor((fb - capL) / binHz);
			if (b < a) b = a;
			if (b < 0 || a >= BINS) { b0[x] = -1; continue; }
			b0[x] = Math.max(0, a); b1[x] = Math.min(BINS - 1, b);
		}
		m = { b0, b1 };
		this.maps.set(key, m);
		return m;
	}
	paintRow(data, offset, src, srcOff, m) {
		const lut = this.lut;
		for (let x = 0; x < this.w; x++) {
			const o = (offset + x) * 4;
			if (m.b0[x] < 0) { data[o] = 7; data[o + 1] = 15; data[o + 2] = 13; data[o + 3] = 255; continue; }
			let v = -200;
			for (let b = m.b0[x]; b <= m.b1[x]; b++) { const q = src[srcOff + b]; if (q > v) v = q; }
			v = (v + 112) / 60;
			v = v < 0 ? 0 : v > 1 ? 1 : Math.pow(v, 1.15);
			const k = (v * 255) | 0;
			data[o] = lut[k * 3]; data[o + 1] = lut[k * 3 + 1]; data[o + 2] = lut[k * 3 + 2]; data[o + 3] = 255;
		}
	}
	pushRow(t) {
		this.head = (this.head + 1) % HIST;
		const c = this.state.center;
		this.histC[this.head] = c;
		this.gen(t, c, this.row || (this.row = new Float32Array(BINS)));
		this.hist.set(this.row, this.head * BINS);
		this.count = Math.min(HIST, this.count + 1);
	}
	renderAll() {
		const w = this.w, h = this.wh, img = this.wctx.createImageData(w, h);
		for (let y = 0; y < h; y++) {
			if (y >= this.count) { for (let x = 0; x < w; x++) { const o = (y * w + x) * 4; img.data[o] = 7; img.data[o + 1] = 15; img.data[o + 2] = 13; img.data[o + 3] = 255; } continue; }
			const idx = (this.head - y + HIST) % HIST;
			this.paintRow(img.data, y * w, this.hist, idx * BINS, this.mapFor(this.histC[idx]));
		}
		this.wctx.putImageData(img, 0, 0);
		this.dirty = false;
	}
	resize() {
		const dpr = Math.min(2, window.devicePixelRatio || 1);
		const w = this.specEl.clientWidth, sh = this.specEl.clientHeight, wh = this.wfEl.clientHeight;
		if (!w || !sh || !wh) return false;
		if (w === this.w && sh === this.sh && wh === this.wh && dpr === this.dpr && this.lutName === this.props.palette) return true;
		this.w = w; this.sh = sh; this.wh = wh; this.dpr = dpr;
		this.buildLut();
		this.maps.clear();
		this.specEl.width = Math.round(w * dpr); this.specEl.height = Math.round(sh * dpr);
		this.wfEl.width = w; this.wfEl.height = wh;
		this.sctx = this.specEl.getContext('2d');
		this.wctx = this.wfEl.getContext('2d');
		this.rowImg = this.wctx.createImageData(w, 1);
		const now = performance.now() / 1000;
		if (this.count === 0) for (let y = Math.min(HIST, wh) - 1; y >= 0; y--) this.pushRow(now - y / RATE);
		this.last = now;
		this.dirty = true;
		return true;
	}
	frame(ms) {
		this.raf = requestAnimationFrame(this.frame);
		if (!this.specEl || !this.wfEl || !this.resize()) return;
		const t = ms / 1000;
		if (this.count === 0) { for (let y = Math.min(HIST, this.wh) - 1; y >= 0; y--) this.pushRow(t - y / RATE); this.dirty = true; }
		if (t - this.last > 1) this.last = t - 1 / RATE;
		let rows = 0;
		while (t - this.last >= 1 / RATE && rows < 4) {
			this.last += 1 / RATE;
			this.pushRow(this.last);
			if (!this.dirty) {
				this.wctx.drawImage(this.wfEl, 0, 0, this.w, this.wh - 1, 0, 1, this.w, this.wh - 1);
				this.paintRow(this.rowImg.data, 0, this.hist, this.head * BINS, this.mapFor(this.state.center));
				this.wctx.putImageData(this.rowImg, 0, 0);
			}
			if (!this.avg || this.avgC !== this.state.center) { this.avg = Float32Array.from(this.row); this.peak = Float32Array.from(this.row); this.avgC = this.state.center; }
			else for (let i = 0; i < BINS; i++) { this.avg[i] += (this.row[i] - this.avg[i]) * 0.35; this.peak[i] = Math.max(this.peak[i] - 0.12, this.avg[i]); }
			rows++;
		}
		const viewDirty = this.dirty;
		if (this.dirty) this.renderAll();
		if (rows || viewDirty) this.draw();
	}
	trace(c, arr, m, W, H, n) {
		c.beginPath();
		let pen = false;
		for (let x = 0; x < n; x++) {
			if (m.b0[x] < 0) { pen = false; continue; }
			let v = -200;
			for (let b = m.b0[x]; b <= m.b1[x]; b++) if (arr[b] > v) v = arr[b];
			const px = x / (n - 1) * W, py = yOf(v, H);
			if (pen) c.lineTo(px, py); else { c.moveTo(px, py); pen = true; }
		}
	}
	draw() {
		if (!this.avg) return;
		const c = this.sctx, W = this.specEl.width, H = this.specEl.height, d = this.dpr, n = this.w, s = this.state;
		const m = this.mapFor(s.center);
		c.clearRect(0, 0, W, H);
		c.lineWidth = 1;
		c.strokeStyle = 'rgba(123,236,199,0.065)';
		c.beginPath();
		for (let db = -50; db >= -110; db -= 10) { const y = Math.round(yOf(db, H)) + 0.5; c.moveTo(0, y); c.lineTo(W, y); }
		for (const t of tickList(s.viewL, s.viewSpan, n)) { const x = Math.round((t.f - s.viewL) / s.viewSpan * W) + 0.5; c.moveTo(x, 0); c.lineTo(x, H); }
		c.stroke();
		this.trace(c, this.avg, m, W, H, n);
		c.lineTo(W, H); c.lineTo(0, H); c.closePath();
		const g = c.createLinearGradient(0, 0, 0, H);
		g.addColorStop(0, 'rgba(123,236,199,0.30)'); g.addColorStop(0.7, 'rgba(123,236,199,0.06)'); g.addColorStop(1, 'rgba(123,236,199,0.02)');
		c.fillStyle = g; c.fill();
		this.trace(c, this.peak, m, W, H, n);
		c.strokeStyle = 'rgba(244,247,245,0.16)'; c.lineWidth = d; c.stroke();
		this.trace(c, this.avg, m, W, H, n);
		c.strokeStyle = '#7becc7'; c.lineWidth = 1.25 * d; c.lineJoin = 'round'; c.stroke();
	}
	renderVals() {
		const s = this.state, cap = this.cap();
		const specH = this.props.specHeight ?? 260;
		const inset = this.props.topInset ?? 0;
		const vfo = this.vfo();
		const L = s.viewL, span = s.viewSpan, R = L + span;
		const pct = f => (f - L) / span * 100;
		const w = this.w || 1200;
		const bw = this.props.bandwidth ?? 12500;
		const inView = f => f >= L && f <= R;
		// signal tags: tuned first, then strongest; each tries its spot above the peak, then
		// higher rows, then a compact form without the detail; one that still clashes is dropped
		const taken = [];
		const clash = r => r[0] < 34 || taken.some(o => r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]);
		const markers = (this.props.showMarkers ?? true) ? SIG.filter(x => x.label && inView(x.f)).sort((a, b) => (b.f === vfo) - (a.f === vfo) || b.p - a.p).map(x => {
			const px = pct(x.f) / 100 * w, pref = Math.max(4, yOf(x.p, specH) - 46);
			const full = 44 + x.label.length * 7.4 + (x.sub ? 6 + x.sub.length * 6.6 : 0), compact = 40 + x.label.length * 7.4;
			for (const [wd, hasSub] of [[full, !!x.sub], [compact, false]]) {
				for (const dy of [0, -30, -60]) {
					const top = pref + dy;
					if (top < 4) continue;
					const r = [px - wd / 2 - 3, top - 2, px + wd / 2 + 3, top + 28];
					if (clash(r)) continue;
					taken.push(r);
					return { left: pct(x.f), top, lead: 12 - dy, label: x.label, sub: x.sub, hasSub, freq: (x.f / 1e6).toFixed(3), icon: ICON[x.cat], border: x.f === vfo ? 'rgba(123,236,199,.55)' : 'rgba(123,236,199,.14)', pick: e => { e.stopPropagation(); this.tuneTo(x.f); } };
				}
			}
			return null;
		}).filter(Boolean) : [];
		const savedTaken = [];
		const saved = (this.props.saved || []).filter(x => inView(x.f)).sort((a, b) => a.f - b.f).filter(x => {
			const px = pct(x.f) / 100 * w, r = [px, px + 24 + x.label.length * 6.6];
			if (savedTaken.some(o => r[0] < o[1] + 4 && r[1] > o[0] - 4)) return false;
			savedTaken.push(r); return true;
		}).map(x => ({ left: pct(x.f), label: x.label, pick: e => { e.stopPropagation(); this.tuneTo(x.f); } }));
		const zoom = cap / span;
		const h = s.hover;
		return {
			refs: this.refsObj,
			onDown: this.onDown, onMove: this.onMove, onUp: this.onUp, onLeave: this.onLeave, stop: this.stop,
			grabVfo: this.grabVfo, grabL: this.grabL, grabR: this.grabR,
			cursor: s.dragging === 'pan' ? 'grabbing' : s.dragging === 'edge' ? 'ew-resize' : s.dragging === 'vfo' ? 'grabbing' : 'crosshair',
			topInset: inset,
			specH,
			dbLabels: [-50, -70, -90, -110].map(db => ({ top: yOf(db, specH), text: String(db).replace('-', '−') })),
			markers,
			saved,
			ticks: tickList(L, span, w).map(t => ({ left: pct(t.f), text: t.text })),
			bands: BANDS.filter(b => b.to > L && b.from < R).map(b => {
				const a = Math.max(b.from, L), z = Math.min(b.to, R);
				// the band name yields to a saved-frequency tag and to a band too narrow to hold it
				const lx = pct(a) / 100 * w + 6, lw = b.label.length * 7.5 + 8, bandPx = (z - a) / span * w;
				const showLabel = bandPx >= Math.min(lw, 60) && !savedTaken.some(o => o[0] < lx + lw && o[1] > lx - 4);
				return { left: pct(a), width: (z - a) / span * 100, label: b.label, showLabel };
			}),
			vfoVisible: inView(vfo),
			vfoLeft: pct(vfo),
			vfoWidth: bw / span * 100,
			edges: bw / span * w >= 24 && !!this.props.onBandwidth,
			vfoText: (vfo / 1e6).toFixed(span < 400e3 ? 4 : 3),
			hasSq: typeof this.props.squelch === 'number' && this.props.squelch > -120 && inView(vfo),
			sqTop: typeof this.props.squelch === 'number' ? yOf(this.props.squelch, specH) : 0,
			zoomIn: this.zoomIn, zoomOut: this.zoomOut, zoomFit: this.zoomFit,
			zoomText: zoom < 1.05 ? 'Fit' : (zoom < 10 ? zoom.toFixed(1) : Math.round(zoom)) + '×',
			ovLeft: (L - (s.center - cap / 2)) / cap * 100,
			ovWidth: span / cap * 100,
			hovering: !!h && !s.dragging,
			hoverLeft: h ? h.left : 0,
			hoverText: h ? h.text : '',
			hoverTagTop: specH + 5
		};
	}
}
</script>
