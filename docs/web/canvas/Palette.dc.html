<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="position: {{rootPos}}; inset: {{rootInset}}; width: {{rootW}}; height: {{rootH}}; color: var(--wk-text); font-family: 'Noto Sans', system-ui, sans-serif; font-size: 14px; background: {{rootBg}}; overflow: hidden">

	<sc-if value="{{embedded}}" hint-placeholder-val="{{false}}">
		<button onClick="{{close}}" aria-label="Close commands" tabindex="-1" style="position: absolute; inset: 0; border: 0; margin: 0; padding: 0; background: var(--wka-scrim); cursor: default"></button>
	</sc-if>

	<sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
		<div role="dialog" aria-modal="true" aria-label="Commands" style="position: absolute; top: {{top}}; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); box-sizing: border-box; border-radius: 12px; background: var(--wk-glass-strong); border: 1px solid rgba(var(--wk-line-rgb),.14); box-shadow: inset 0 1px 0 var(--wk-glass-hi), var(--wk-shadow-xl); backdrop-filter: blur(28px) var(--wk-glass-fx); display: flex; flex-direction: column; overflow: hidden">

			<div style="height: 60px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 18px; border-bottom: 1px solid rgba(var(--wk-line-rgb),.08)">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--wk-text-3)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path><path d="M21 21l-6 -6"></path></svg>
				<sc-if value="{{hasScope}}" hint-placeholder-val="{{false}}">
					<button onClick="{{popScope}}" aria-label="Back to all commands" style="font: inherit; cursor: pointer; flex: none; height: 30px; padding: 0 8px 0 10px; border: 1px solid transparent; border-radius: 6px; background: rgba(var(--wk-accent-rgb),.12); color: var(--wk-accent); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap">{{scopeTitle}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button>
				</sc-if>
				<input ref="{{focusRef}}" value="{{q}}" onChange="{{onQ}}" onKeyDown="{{onKey}}" placeholder="{{placeholder}}" aria-label="Command, frequency or search" role="combobox" aria-expanded="true" aria-controls="wk-cmd-list" aria-activedescendant="{{activeId}}" aria-autocomplete="list" spellcheck="false" autocomplete="off" style="flex: 1; min-width: 0; height: 40px; border: 0; padding: 0; background: transparent; color: var(--wk-text); font: inherit; font-size: 17px; outline: none; caret-color: var(--wk-accent)">
				<button onClick="{{close}}" aria-label="Close" style="font: inherit; cursor: pointer; flex: none; height: 24px; padding: 0 7px; border: 1px solid rgba(var(--wk-line-rgb),.18); border-radius: 4px; background: var(--wk-well-glass); color: var(--wk-text-3); font-size: 11.5px">esc</button>
			</div>

			<div id="wk-cmd-list" class="wk-cmd-list" role="listbox" aria-label="Commands" style="max-height: {{listMax}}; overflow-y: auto; overscroll-behavior: contain; padding: 4px 8px 8px">
				<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
					<div role="group" aria-label="{{g.label}}" style="display: flex; flex-direction: column">
						<div style="height: 30px; display: flex; align-items: flex-end; padding: 0 10px 6px; font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--wk-text-3)">{{g.label}}</div>
						<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
							<button id="{{it.domId}}" role="option" aria-selected="{{it.on}}" ref="{{it.ref}}" onClick="{{it.pick}}" onMouseDown="{{keepFocus}}" onMouseMove="{{it.enter}}" tabindex="-1" style="font: inherit; color: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 10px; border: 0; border-radius: 6px; background: {{it.bg}}; box-shadow: {{it.ring}}">
								<sc-if value="{{it.hasSwatch}}" hint-placeholder-val="{{false}}">
									<!-- colour preview swatch: its own theme scope, so it shows that option's ground and accent -->
									<span aria-hidden="true" data-wk-theme="{{it.sw.t}}" data-wk-accent="{{it.sw.a}}" data-wk-ground="{{it.sw.g}}" style="position: relative; width: 30px; height: 30px; flex: none; box-sizing: border-box; border-radius: 6px; overflow: hidden; background: {{it.sw.bg}}; box-shadow: inset 0 0 0 1px rgba(var(--wk-line-rgb),.22)">
										<sc-if value="{{it.sw.split}}" hint-placeholder-val="{{false}}"><span data-wk-theme="light" data-wk-accent="{{it.sw.a}}" data-wk-ground="paper" style="position: absolute; inset: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); background: var(--wk-bg); box-shadow: inset 0 0 0 1px rgba(var(--wk-line-rgb),.22); border-radius: 6px"></span></sc-if>
										<sc-if value="{{it.sw.dot}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 9px; top: 9px; width: 12px; height: 12px; border-radius: 50%; background: var(--wk-accent)"></span></sc-if>
									</span>
								</sc-if>
								<sc-if value="{{it.noSwatch}}" hint-placeholder-val="{{true}}">
									<span style="width: 30px; height: 30px; flex: none; border-radius: 6px; display: grid; place-items: center; background: {{it.iconBg}}; color: {{it.iconC}}">
										<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{it.icon}}" as="p" hint-placeholder-count="1"><path d="{{p}}"></path></sc-for></svg>
									</span>
								</sc-if>
								<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
									<span style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: {{it.titleSize}}; font-variant-numeric: tabular-nums; color: {{it.titleC}}"><sc-for list="{{it.parts}}" as="p" hint-placeholder-count="1"><span style="color: {{p.c}}">{{p.t}}</span></sc-for></span>
									<sc-if value="{{it.hasSub}}" hint-placeholder-val="{{true}}"><span style="font-size: 12.5px; color: var(--wk-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span></sc-if>
								</span>
								<sc-if value="{{it.hasValue}}" hint-placeholder-val="{{false}}"><span style="flex: none; font-size: 13px; color: {{it.valueC}}; font-variant-numeric: tabular-nums; white-space: nowrap">{{it.value}}</span></sc-if>
								<sc-if value="{{it.cur}}" hint-placeholder-val="{{false}}"><span style="flex: none; height: 22px; padding: 0 8px; border-radius: 4px; background: rgba(var(--wk-accent-rgb),.14); color: var(--wk-accent); font-size: 12px; font-weight: 700; line-height: 22px">Current</span></sc-if>
								<sc-if value="{{it.isToggle}}" hint-placeholder-val="{{false}}">
									<span aria-hidden="true" style="position: relative; width: 32px; height: 18px; flex: none; border-radius: 9px; background: {{it.track}}"><span style="position: absolute; top: 2px; left: {{it.knob}}px; width: 14px; height: 14px; border-radius: 50%; background: var(--wk-knob)"></span></span>
								</sc-if>
								<sc-if value="{{it.hasKbd}}" hint-placeholder-val="{{false}}">
									<span style="flex: none; display: flex; gap: 3px" aria-hidden="true"><sc-for list="{{it.kbd}}" as="k" hint-placeholder-count="1"><span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border: 1px solid rgba(var(--wk-line-rgb),.18); border-radius: 4px; background: var(--wk-well-glass); color: var(--wk-text-2); font-size: 11.5px; line-height: 18px; text-align: center">{{k}}</span></sc-for></span>
								</sc-if>
								<sc-if value="{{it.isOpen}}" hint-placeholder-val="{{false}}">
									<span style="flex: none; font-size: 12.5px; color: {{it.openC}}; white-space: nowrap">Open in Settings ›</span>
								</sc-if>
								<sc-if value="{{it.scope}}" hint-placeholder-val="{{false}}">
									<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--wk-text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6l-6 6"></path></svg>
								</sc-if>
							</button>
						</sc-for>
					</div>
				</sc-for>
				<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
					<div style="padding: 28px 16px; text-align: center; display: flex; flex-direction: column; gap: 4px">

function parse(q, cur) {
	const s = q.trim().toLowerCase().replace(',', '.');
	if (!s) return { none: true };
	const m = /^([+-])?\s*(\d+(?:\.\d*)?)\s*(hz|k|khz|m|mhz|g|ghz)?$/.exec(s);
	if (!m) return { none: true };
	const v = parseFloat(m[2]);
	const unit = m[3] || '';
	let mult = unit.startsWith('k') ? 1e3 : unit.startsWith('m') ? 1e6 : unit.startsWith('g') ? 1e9 : unit === 'hz' ? 1 : 0;
	if (m[1]) {
		const d = v * (mult || 1e3);
		return { f: cur + (m[1] === '+' ? d : -d), rel: m[1], hint: (m[1] === '+' ? 'Up ' : 'Down ') + kfmt(d) + ' from here' };

	if (!mult) mult = v >= 24e6 ? 1 : v >= 24000 ? 1e3 : v >= 24 ? 1e6 : v < 2 ? 1e9 : 0;
	if (!mult) return { err: 'Below 24 MHz. Turn on direct sampling for HF.' };
	const f = Math.round(v * mult);
	if (f < 24e6) return { err: 'Below 24 MHz. Turn on direct sampling for HF.' };
	if (f > 1.9e9) return { err: 'Out of range. This receiver tunes 24 MHz to 1.9 GHz.' };
	return { f };
}

const CMD_WORD = /^(gain|g|sq|squelch|sql|bw|bandwidth|filter|step|rate|sr|vol|volume|mode|tg|talkgroup|cap|capcode|pager|mmsi)\b/;
// Pasted or copied text: "161.150.000", "161 150 kHz", "446,00625 MHz", "Freq: 156.800 MHz NFM 12.5 kHz".
function parsePasted(q, cur) {
	const s = q.trim().toLowerCase();
	if (!s || CMD_WORD.test(s)) return { none: true };
	const modeM = /\b(nfm|wfm|am|usb|lsb|cw|fm)\b/.exec(s);
	const re = /(\d[\d\s.,']*\d|\d)\s*(ghz|mhz|khz|hz|g|m|k)?(?![a-z])/g;
	const nums = [];
	let m;
	while ((m = re.exec(s))) nums.push({ raw: m[1], unit: m[2] || '' });
	if (!nums.length) return { none: true };
	const fullUnit = /(ghz|mhz|khz|hz)/.test(s);
	const grouped = /\d[.,' ]\d{3}[.,' ]\d{3}/.test(s) || /\d \d{3}/.test(s);
	if (!modeM && !fullUnit && !grouped && nums.length === 1 && s === nums[0].raw + nums[0].unit) return { none: true };
	if (!modeM && !fullUnit && !grouped) return { none: true };
	const norm = raw => {
		let t = raw.replace(/[\s']/g, '');
		const seps = (t.match(/[.,]/g) || []).length;
		if (seps > 1) t = t.replace(/[.,]/g, '');
		else t = t.replace(',', '.');
		return t;
	};
	const first = nums[0];
	let num = norm(first.raw), unit = first.unit;
	if (!unit && /^\d{7,10}$/.test(num)) unit = 'hz';
	const p = parse(num + unit, cur);
	if (!p.f) return p.err ? p : { none: true };
	const out = { f: p.f, pasted: true };
	if (modeM) out.mode = modeM[1] === 'fm' ? 'NFM' : modeM[1].toUpperCase();
	const bwN = nums.slice(1).find(n => n.unit === 'k' || n.unit === 'khz');
	if (bwN) out.bw = Math.round(parseFloat(norm(bwN.raw)) * 1000);
	return out;
}

function fuzzy(q, text) {
	const t = text.toLowerCase();
	const at = t.indexOf(q);
	const span = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
	if (at === 0) return { score: 100 - t.length * 0.1, idx: span(0, q.length) };
	if (at > 0) return { score: (WS.test(t[at - 1]) ? 80 : 50) - at * 0.3, idx: span(at, at + q.length) };
	const qs = q.replace(/\s+/g, '');
	let i = 0, last = -2, score = 0;
	const idx = [];
	for (let j = 0; j < t.length && i < qs.length; j++) {
		if (t[j] !== qs[i]) continue;
		score += j === 0 || WS.test(t[j - 1]) ? 6 : j === last + 1 ? 3 : 0.5;
		idx.push(j); last = j; i++;
	}
	if (i < qs.length || score < qs.length * 2) return null;
	return { score: 20 + score - (idx[idx.length - 1] - idx[0]) * 0.2, idx };
}

function effects(patch, cur) {
	if (!patch) return [];
	const nxt = Object.assign({}, cur, patch), out = [], seen = {};

		if (k === 'bw' || k === 'step') return kfmt(x);
		if (k === 'rate') return x + ' MS/s';
		if (k === 'vol') return x + ' %';
		if (k === 'mode') return x;
		if (OPTS[k]) return optLabel(k, x);
		if (k === 'saved') return String(x.length);

	Object.keys(patch).forEach(k => {

		if (k === 'gainIdx' || k === 'gainAuto') { key = 'gain'; a = gainText(cur); b = gainText(nxt); }
		else if (k === 'sq' || k === 'sqAuto') { key = 'sq'; a = sqText(cur); b = sqText(nxt); }
		else { a = desc(k, cur[k]); b = desc(k, nxt[k]); }

		seen[key] = 1;

	});

}

			} else {
				const it = this.intents(q).tune;
				push('Tune', it.concat(this.rank(this.tuneTargets(), q).slice(0, 6)));
			}
		} else if (s.scope) {
			const meta = SCOPES[s.scope];
			const items = this.scopeItems(s.scope);
			if (meta.raw || !q) push(meta.title, items, 0);
			else {
				if (meta.prefix) { const it = this.intents(meta.prefix + ' ' + q).cmd; push('Set', it.map(x => Object.assign({}, x, { title: x.title.replace(/^.* › /, '') }))); }
				push(meta.title, this.rank(items, q));
			}
		} else if (!q) {
			push('Suggested', this.suggested(), 4);
			push('Recent', this.recentItems(), 3);
			push('Saved frequencies', v.saved.slice(0, 4).map(x => this.savedItem(x)), 2);
			push('All commands', this.rootCommands(), 1);
		} else {
			const it = this.intents(q);
			push('Tune', it.tune.concat(this.rank(this.tuneTargets(), q).slice(0, 4)));
			const ranked = this.rank(this.rootCommands().concat(q.length >= 2 ? this.deepItems() : [], this.settingItems()), q);
			// a setting with an inline scope or toggle: the inline row first, its "Open in Settings" row right after it
			const tied = ranked.filter(x => x.link && ranked.some(y => y.id === x.link));
			const list = ranked.filter(x => tied.indexOf(x) < 0);
			tied.forEach(x => { const i = list.findIndex(y => y.id === x.link); list.splice(i + 1, 0, Object.assign({}, x, { _score: list[i]._score })); });
			push('Commands', it.cmd.concat(list.slice(0, 12)));
			push('Activity', it.act);
			groups.sort((a, b) => b.top - a.top);
		}
		const flat = [];
		groups.forEach(g => g.items.forEach(x => flat.push(x)));
		return { groups, flat };
	}
	selected() { const { flat } = this.build(); return flat[Math.max(0, Math.min(this.state.sel, flat.length - 1))]; }

	// ---------- behaviour ----------
	emitPreview() {
		const it = this.selected();
		const p = it && it.patch && !it.noPreview ? it.patch : null;
		const key = JSON.stringify(p);
		if (key === this.lastPrev) return;
		this.lastPrev = key;
		if (this.props.onPreview) this.props.onPreview(p); else this.setState({ preview: p });
	}
	select(i) { if (i !== this.state.sel) this.setState({ sel: i }, () => this.emitPreview()); }
	setQ(q) { this.setState({ q, sel: 0 }, () => this.emitPreview()); }
	enter(scope) {
		this.setState({ scope, q: '', sel: 0 }, () => {
			const i = this.build().flat.findIndex(x => x.cur);
			if (i > 0) this.setState({ sel: i }, () => this.emitPreview()); else this.emitPreview();
		});
	}
	pop() { this.setState({ scope: null, q: '', sel: 0 }, () => this.emitPreview()); }
	used(id) {
		if (this.props.onUsed) return this.props.onUsed(id);
		const r = this.state.recent.filter(x => x.id !== id);
		const old = this.state.recent.find(x => x.id === id);
		this.setState({ recent: [{ id, n: (old ? old.n : 0) + 1 }].concat(r).slice(0, 12) });
	}
	run(it) {
		if (!it || it.info) return;
		if (it.scope) return this.enter(it.scope);
		this.used(it.id);
		if (it.patch) this.commit(it.patch, it.label || effects(it.patch, this.v()).map(e => e.label + ' ' + e.to).join(' · '));
		else if (it.act) it.act();
	}
	commit(patch, label) {
		this.lastPrev = 'null';
		if (this.embedded()) return this.props.onCommit(patch, label);
		const vals = this.state.vals, prev = {};
		Object.keys(patch).forEach(k => { prev[k] = vals[k]; });
		this.setState({ vals: Object.assign({}, vals, patch), preview: null, q: '', scope: null, sel: 0 });
		this.toast(label, prev);
	}
	toast(text, prev) {
		if (this.embedded()) return this.props.onCommit(null, text);
		clearTimeout(this.tt);
		this.setState({ toast: { text, prev: prev || null } });
		this.tt = setTimeout(() => this.setState({ toast: null }), 6000);
	}
	activity(cmd, label) {
		if (this.props.onActivity) return this.props.onActivity(cmd);
		this.setState({ q: '', scope: null, sel: 0 });
		this.toast(label);
	}
	nav(id, label) {
		if (this.props.onNav) return this.props.onNav(id);
		this.setState({ vals: Object.assign({}, this.state.vals, SHELL_VIEWS.indexOf(id) >= 0 ? { view: id } : { drawer: id }), q: '', scope: null, sel: 0 });
		this.toast('Opened ' + label);
	}
	scan(a, label) {
		if (this.props.onScan) return this.props.onScan(a);
		const next = { start: a.preset === 'This span' ? 'watching' : 'sweeping', pause: 'paused', stay: 'paused', resume: 'sweeping', stop: 'off' }[a.type];
		this.setState(Object.assign({ scanLocal: next, q: '', scope: null, sel: 0 }, a.type === 'start' ? { scanPreset: a.preset } : null));
		this.toast(label);
	}
	identify() {
		const v = this.v();
		if (this.props.onIdentify) return this.props.onIdentify(v.freq);
		this.setState({ q: '', scope: null, sel: 0 });
		this.toast('Identifying ' + mfmt(v.freq) + ' MHz');
	}
	openSetting(d) {
		this.lastPrev = 'null';
		if (this.props.onOpenSetting) { this.props.onOpenSetting(d.id); return this.close(); }
		this.setState({ q: '', scope: null, sel: 0 });
		this.toast('Opened Settings › ' + d.label);
	}
	close() {
		this.lastPrev = 'null';
		if (this.props.onClose) return this.props.onClose();
		this.setState({ open: false, preview: null, q: '', scope: null, sel: 0 });
	}

	// ---------- view ----------
	row(it, i, on) {
		const title = it.title, idx = it._idx || [];
		const parts = [];
		for (let j = 0; j < title.length; j++) {
			const h = idx.indexOf(j) >= 0;
			const last = parts[parts.length - 1];
			if (last && last.h === h) last.t += title[j]; else parts.push({ t: title[j], h });
		}
		return {
			domId: 'wk-cmd-' + i,
			on: on ? 'true' : 'false',
			ref: on ? this.scrollRef : null,
			parts: parts.map(p => ({ t: p.t, c: p.h ? 'var(--wk-accent)' : 'inherit' })),
			titleC: it.info ? 'var(--wk-amber)' : 'var(--wk-text)',
			titleSize: it.big ? '18px' : '14px',
			sub: it.sub || '', hasSub: !!it.sub,
			icon: it.icon || P.go,
			hasSwatch: !!it.sw, noSwatch: !it.sw,
			sw: it.sw || { t: 'dark', a: 'mono', g: 'black', bg: 'transparent', split: false, dot: false },
			isOpen: !!it.openSet, openC: on ? 'var(--wk-accent)' : 'var(--wk-text-3)',
			iconC: it.info ? 'var(--wk-amber)' : on ? 'var(--wk-accent)' : 'var(--wk-text-2)',
			iconBg: on ? 'rgba(var(--wk-accent-rgb),.14)' : 'rgba(var(--wk-accent-rgb),.06)',
			value: it.value || '', hasValue: !!it.value, valueC: it.valueC || 'var(--wk-text-3)',
			cur: !!it.cur,
			isToggle: !!it.isToggle, track: it.on ? 'var(--wk-accent)' : 'var(--wk-track)', knob: it.on ? 16 : 2,
			kbd: it.kbd || [], hasKbd: !!(it.kbd && it.kbd.length),
			scope: !!it.scope,
			bg: on ? 'rgba(var(--wk-accent-rgb),.11)' : 'transparent',
			ring: 'none',
			enter: () => this.select(i),
			pick: () => { this.select(i); this.run(it); }
		};
	}
	renderVals() {
		const s = this.state, v = this.v(), emb = this.embedded();
		const { groups, flat } = this.build();
		const sel = Math.max(0, Math.min(s.sel, flat.length - 1));
		const cur = flat[sel];
		let k = 0;
		const vg = groups.map(g => ({ label: g.label, items: g.items.map(it => { const i = k++; return this.row(it, i, i === sel); }) }));
		const eff = cur && cur.patch ? (cur.effect ? [{ label: 'Save', from: '', to: cur.effect }] : effects(cur.patch, v)) : cur && cur.does ? [{ label: '', from: '', to: cur.does }] : [];
		const live = !!(cur && cur.patch && !cur.noPreview && eff.length);
		const warn = cur && cur.warn ? cur.warn : '';
		const shown = Object.assign({}, v, emb ? {} : s.preview || {});
		const changed = emb ? [] : effects(s.preview, v).map(e => e.key);
		const chip = (key, k2, val) => { const c = [].concat(key).some(x => changed.indexOf(x) >= 0); return { k: k2, v: val, bg: c ? 'rgba(var(--wk-amber-rgb),.12)' : 'var(--wk-glass-panel)', border: c ? 'rgba(var(--wk-amber-rgb),.55)' : 'rgba(var(--wk-line-rgb),.18)', fg: c ? 'var(--wk-amber)' : 'var(--wk-text)' }; };
		const meta = s.scope ? SCOPES[s.scope] : null;
		// standalone, the board itself shows the colours being previewed; embedded, Immersive does
		const L = emb ? this.look({ theme: this.props.theme, ground: this.props.ground, accent: this.props.accent }) : this.look(shown);
		return {
			// theme scope: Immersive passes its theme and accent; standalone, the board's own tweaks
			wkTheme: L.t, wkAccent: L.a, wkGround: L.g,
			embedded: emb, standalone: !emb,
			rootPos: emb ? 'absolute' : 'relative', rootInset: emb ? '0' : 'auto',
			rootW: emb ? 'auto' : '760px', rootH: emb ? 'auto' : '700px', rootBg: emb ? 'transparent' : 'var(--wk-bg)',
			top: emb ? '16px' : '40px',
			listMax: emb ? 'min(440px, calc(100vh - 200px))' : '384px',
			isOpen: emb || s.open, showReopen: !emb && !s.open,
			reopen: () => { this.reopened = true; this.setState({ open: true }); },
			keepFocus: this.keepFocus,
			close: () => this.close(),
			hasScope: !!meta, scopeTitle: meta ? meta.title : '',
			popScope: () => this.pop(),
			placeholder: meta ? meta.ph : 'Type a frequency, a setting, or search activity…',
			q: s.q,
			focusRef: this.focusRef,
			onQ: e => this.setQ(e.target.value),
			onKey: e => {
				const n = flat.length;
				if (e.key === 'ArrowDown') { e.preventDefault(); if (n) this.select((sel + 1) % n); }
				else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) this.select((sel - 1 + n) % n); }
				else if (e.key === 'Enter') { e.preventDefault(); this.run(cur); }
				else if (e.key === 'Tab') { e.preventDefault(); if (cur && cur.scope) this.enter(cur.scope); }
				else if (e.key === 'Backspace' && !s.q && s.scope) { e.preventDefault(); this.pop(); }
				else if (e.key === 'Escape') { e.preventDefault(); if (s.scope) this.pop(); else this.close(); }
			},
			activeId: cur ? 'wk-cmd-' + sel : '',
			groups: vg,
			empty: flat.length === 0,
			emptyText: s.scope === 'tune' ? 'Not a frequency yet. Try 161.15, 161150k, 446.00625 MHz or ch 16.' : s.scope ? 'Press Backspace to go back to all commands.' : 'Try a frequency, a talkgroup or a setting name.',
			hasEffect: eff.length > 0 || !!warn,
			effRows: eff.slice(0, 3).map(e => ({ label: e.label, from: e.from, to: e.to, hasFrom: !!e.from })),
			effPill: live ? 'Live preview' : cur && cur.patch ? 'On Enter' : 'Action',
			effPillBg: live ? 'rgba(var(--wk-accent-rgb),.14)' : 'var(--wk-fill)',
			effPillFg: live ? 'var(--wk-accent)' : 'var(--wk-text-2)',
			hasWarn: !!warn, warn,
			hints: s.scope ? [{ k: '↑↓', t: 'move' }, { k: '↵', t: 'choose' }, { k: '⌫', t: 'back' }, { k: 'esc', t: live ? 'revert' : 'back' }] : [{ k: '↑↓', t: 'move' }, { k: '↵', t: 'run' }, { k: '⇥', t: 'open' }, { k: 'esc', t: live ? 'revert and close' : 'close' }],
			openKeys: () => this.enter('keys'),
			hasToast: !emb && !!s.toast, toastText: s.toast ? s.toast.text : '', canUndo: !!(s.toast && s.toast.prev),
			undo: () => { const t = s.toast; if (t && t.prev) this.setState({ vals: Object.assign({}, s.vals, t.prev), toast: null }); },
			strip: [
				chip('freq', 'Freq', mfmt(shown.freq)),
				chip('mode', 'Mode', shown.mode),
				chip('bw', 'BW', kfmt(shown.bw)),
				chip('gain', 'Gain', gainText(shown)),
				chip('sq', 'Squelch', sqText(shown)),
				chip('vol', 'Volume', shown.vol + ' %'),
				chip(['theme', 'ground'], 'Theme', optLabel('theme', shown.theme) + (L.t === 'light' ? ' · Paper' : ' · ' + optLabel('ground', shown.ground || 'black'))),
				chip('accent', 'Accent', optLabel('accent', shown.accent)),
				chip('waterfall', 'Waterfall', optLabel('waterfall', shown.waterfall))
			]
		};
	}
}
</script>
</body>
</html>
