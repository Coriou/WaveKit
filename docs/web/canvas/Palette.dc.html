<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"D-DIN Condensed";font-weight:400;font-display:swap;src:url("/_blob/6b6b1c5cae1637ecc473a959a8d87a96") format("woff2")}
@font-face{font-family:"D-DIN Condensed";font-weight:700;font-display:swap;src:url("/_blob/2abc64ad8670fc5303395b91efc22319") format("woff2")}
@font-face{font-family:"Noto Sans";font-weight:400;font-display:swap;src:url("/_blob/fc93658bc9e76c8f71fbef44633be7ab") format("woff2")}

body{margin:0;background:#0b1512}

.wk-cmd-list::-webkit-scrollbar-thumb{background:#22362f;border-radius:4px}
input::placeholder{color:#6d857a}

</helmet>
<div style="position: {{rootPos}}; inset: {{rootInset}}; width: {{rootW}}; height: {{rootH}}; color: #f4f7f5; font-family: 'Noto Sans', system-ui, sans-serif; font-size: 14px; background: {{rootBg}}; overflow: hidden">

	<sc-if value="{{embedded}}" hint-placeholder-val="{{false}}">
		<button onClick="{{close}}" aria-label="Close commands" tabindex="-1" style="position: absolute; inset: 0; border: 0; margin: 0; padding: 0; background: rgba(5,10,8,.28); cursor: default"></button>
	</sc-if>

	<sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
		<div role="dialog" aria-modal="true" aria-label="Commands" style="position: absolute; top: {{top}}; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); box-sizing: border-box; border-radius: 20px; background: rgba(17,28,25,.82); border: 1px solid rgba(123,236,199,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 24px 64px rgba(0,0,0,.5); backdrop-filter: blur(28px) saturate(170%); display: flex; flex-direction: column; overflow: hidden">

			<div style="height: 60px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 18px; border-bottom: 1px solid rgba(123,236,199,.1)">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8ba598" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path><path d="M21 21l-6 -6"></path></svg>
				<sc-if value="{{hasScope}}" hint-placeholder-val="{{false}}">
					<button onClick="{{popScope}}" aria-label="Back to all commands" style="font: inherit; cursor: pointer; flex: none; height: 30px; padding: 0 8px 0 10px; border: 1px solid rgba(123,236,199,.4); border-radius: 9px; background: rgba(123,236,199,.12); color: #7becc7; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap">{{scopeTitle}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button>
				</sc-if>
				<input ref="{{focusRef}}" value="{{q}}" onChange="{{onQ}}" onKeyDown="{{onKey}}" placeholder="{{placeholder}}" aria-label="Command, frequency or search" role="combobox" aria-expanded="true" aria-controls="wk-cmd-list" aria-activedescendant="{{activeId}}" aria-autocomplete="list" spellcheck="false" autocomplete="off" style="flex: 1; min-width: 0; height: 40px; border: 0; padding: 0; background: transparent; color: #f4f7f5; font: inherit; font-size: 17px; outline: none; caret-color: #7becc7">
				<button onClick="{{close}}" aria-label="Close" style="font: inherit; cursor: pointer; flex: none; height: 24px; padding: 0 7px; border: 1px solid #2c443b; border-radius: 6px; background: rgba(11,21,18,.6); color: #8ba598; font-size: 11.5px">esc</button>
			</div>

			<div id="wk-cmd-list" class="wk-cmd-list" role="listbox" aria-label="Commands" style="max-height: {{listMax}}; overflow-y: auto; overscroll-behavior: contain; padding: 4px 8px 8px">
				<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
					<div role="group" aria-label="{{g.label}}" style="display: flex; flex-direction: column">
						<div style="height: 30px; display: flex; align-items: flex-end; padding: 0 10px 6px; font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8ba598">{{g.label}}</div>
						<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
							<button id="{{it.domId}}" role="option" aria-selected="{{it.on}}" ref="{{it.ref}}" onClick="{{it.pick}}" onMouseDown="{{keepFocus}}" onMouseMove="{{it.enter}}" tabindex="-1" style="font: inherit; color: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 10px; border: 0; border-radius: 11px; background: {{it.bg}}; box-shadow: {{it.ring}}">
								<span style="width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: {{it.iconBg}}; color: {{it.iconC}}">
									<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{it.icon}}" as="p" hint-placeholder-count="1"><path d="{{p}}"></path></sc-for></svg>
								</span>
								<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
									<span style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: {{it.titleSize}}; font-variant-numeric: tabular-nums; color: {{it.titleC}}"><sc-for list="{{it.parts}}" as="p" hint-placeholder-count="1"><span style="color: {{p.c}}">{{p.t}}</span></sc-for></span>
									<sc-if value="{{it.hasSub}}" hint-placeholder-val="{{true}}"><span style="font-size: 12.5px; color: #8ba598; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span></sc-if>
								</span>
								<sc-if value="{{it.hasValue}}" hint-placeholder-val="{{false}}"><span style="flex: none; font-size: 13px; color: {{it.valueC}}; font-variant-numeric: tabular-nums; white-space: nowrap">{{it.value}}</span></sc-if>
								<sc-if value="{{it.cur}}" hint-placeholder-val="{{false}}"><span style="flex: none; height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(123,236,199,.14); color: #7becc7; font-size: 12px; font-weight: 700; line-height: 22px">Current</span></sc-if>
								<sc-if value="{{it.isToggle}}" hint-placeholder-val="{{false}}">
									<span aria-hidden="true" style="position: relative; width: 32px; height: 18px; flex: none; border-radius: 9px; background: {{it.track}}"><span style="position: absolute; top: 2px; left: {{it.knob}}px; width: 14px; height: 14px; border-radius: 50%; background: #f4f7f5"></span></span>
								</sc-if>
								<sc-if value="{{it.hasKbd}}" hint-placeholder-val="{{false}}">
									<span style="flex: none; display: flex; gap: 3px" aria-hidden="true"><sc-for list="{{it.kbd}}" as="k" hint-placeholder-count="1"><span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border: 1px solid #2c443b; border-radius: 5px; background: rgba(11,21,18,.6); color: #b9cac1; font-size: 11.5px; line-height: 18px; text-align: center">{{k}}</span></sc-for></span>
								</sc-if>
								<sc-if value="{{it.scope}}" hint-placeholder-val="{{false}}">
									<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8ba598" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6l-6 6"></path></svg>

							</button>
						</sc-for>
					</div>
				</sc-for>
				<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
					<div style="padding: 28px 16px; text-align: center; display: flex; flex-direction: column; gap: 4px">
						<span style="font-weight: 700">Nothing matches</span>
						<span style="font-size: 13px; color: #8ba598">{{emptyText}}</span>
					</div>
				</sc-if>
			</div>

			<sc-if value="{{hasEffect}}" hint-placeholder-val="{{true}}">
				<div role="status" aria-live="polite" style="flex: none; display: flex; flex-direction: column; gap: 6px; padding: 11px 18px; border-top: 1px solid rgba(123,236,199,.1); background: rgba(11,21,18,.45)">

						<span style="flex: none; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 700; line-height: 22px; display: flex; align-items: center; gap: 6px; background: {{effPillBg}}; color: {{effPillFg}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>{{effPill}}</span>

							<sc-for list="{{effRows}}" as="e" hint-placeholder-count="1">
								<span style="white-space: nowrap"><span style="color: #8ba598">{{e.label}}</span> <sc-if value="{{e.hasFrom}}" hint-placeholder-val="{{true}}"><span style="color: #8ba598">{{e.from}}</span> <span style="color: #52645d">→</span> </sc-if><span style="font-weight: 700">{{e.to}}</span></span>
							</sc-for>
						</span>
					</div>
					<sc-if value="{{hasWarn}}" hint-placeholder-val="{{false}}">
						<span style="font-size: 12.5px; color: #f2b84b; line-height: 1.4">{{warn}}</span>
					</sc-if>
				</div>
			</sc-if>

			<div style="flex: none; height: 38px; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-top: 1px solid rgba(123,236,199,.1); font-size: 12px; color: #8ba598; white-space: nowrap; overflow: hidden">
				<sc-for list="{{hints}}" as="h" hint-placeholder-count="4">
					<span style="display: flex; align-items: center; gap: 5px"><span style="min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 4px; border: 1px solid #2c443b; border-radius: 5px; color: #b9cac1; font-size: 11px; line-height: 16px; text-align: center">{{h.k}}</span>{{h.t}}</span>
				</sc-for>
				<div style="flex: 1"></div>
				<button onClick="{{openKeys}}" style="font: inherit; cursor: pointer; border: 0; padding: 0; background: transparent; color: #8ba598; font-size: 12px; display: flex; align-items: center; gap: 5px"><span style="min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 4px; border: 1px solid #2c443b; border-radius: 5px; color: #b9cac1; font-size: 11px; line-height: 16px; text-align: center">?</span>Shortcuts</button>
			</div>
		</div>
	</sc-if>

	<sc-if value="{{showReopen}}" hint-placeholder-val="{{false}}">
		<div style="position: absolute; top: 40px; left: 50%; transform: translateX(-50%)">
			<button onClick="{{reopen}}" style="font: inherit; color: #f4f7f5; cursor: pointer; height: 48px; padding: 0 12px 0 16px; border-radius: 16px; border: 1px solid rgba(123,236,199,.16); background: rgba(17,28,25,.6); display: flex; align-items: center; gap: 10px; font-weight: 700">Open commands<span style="height: 22px; padding: 0 7px; border: 1px solid #2c443b; border-radius: 6px; color: #b9cac1; font-size: 12px; font-weight: 400; line-height: 20px">⌘K</span></button>
		</div>
	</sc-if>

	<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
		<div role="status" style="position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 6px 0 16px; border-radius: 14px; background: rgba(25,43,36,.92); border: 1px solid rgba(123,236,199,.18); box-shadow: 0 12px 32px rgba(0,0,0,.4); white-space: nowrap; font-size: 13.5px">
			<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7becc7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"></path></svg>
			<span>{{toastText}}</span>
			<sc-if value="{{canUndo}}" hint-placeholder-val="{{true}}">
				<button onClick="{{undo}}" style="font: inherit; cursor: pointer; height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: rgba(123,236,199,.14); color: #7becc7; font-weight: 700; font-size: 13px">Undo</button>
			</sc-if>
		</div>
	</sc-if>

	<sc-if value="{{standalone}}" hint-placeholder-val="{{true}}">
		<div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
			<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8ba598; margin-right: 4px">Receiver now</span>
			<sc-for list="{{strip}}" as="c" hint-placeholder-count="8">
				<span style="height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-variant-numeric: tabular-nums; background: {{c.bg}}; border: 1px solid {{c.border}}"><span style="color: #8ba598">{{c.k}}</span><span style="font-weight: 700; color: {{c.fg}}">{{c.v}}</span></span>
			</sc-for>
		</div>
	</sc-if>
</div>
</x-dc>

function parse(q, cur) {
	const s = q.trim().toLowerCase().replace(',', '.');
	if (!s) return { none: true };
	const m = /^([+-])?\s*(\d+(?:\.\d*)?)\s*(hz|k|khz|m|mhz|g|ghz)?$/.exec(s);
	if (!m) return { none: true };
	const v = parseFloat(m[2]);
	const unit = m[3] || '';
	let mult = unit.startsWith('k') ? 1e3 : unit.startsWith('m') ? 1e6 : unit.startsWith('g') ? 1e9 : unit === 'hz' ? 1 : 0;
	if (m[1]) {
		const d = v * (mult || 1e3);
		return { f: cur + (m[1] === '+' ? d : -d), rel: m[1], hint: (m[1] === '+' ? 'Up ' : 'Down ') + kfmt(d) + ' from here' };
	}
	if (!mult) mult = v >= 24e6 ? 1 : v >= 24000 ? 1e3 : v >= 24 ? 1e6 : v < 2 ? 1e9 : 0;
	if (!mult) return { err: 'Below 24 MHz. Turn on direct sampling for HF.' };
	const f = Math.round(v * mult);
	if (f < 24e6) return { err: 'Below 24 MHz. Turn on direct sampling for HF.' };
	if (f > 1.9e9) return { err: 'Out of range. This receiver tunes 24 MHz to 1.9 GHz.' };
	return { f };
}

const CMD_WORD = /^(gain|g|sq|squelch|sql|bw|bandwidth|filter|step|rate|sr|vol|volume|mode|tg|talkgroup|cap|capcode|pager|mmsi)\b/;
// Pasted or copied text: "161.150.000", "161 150 kHz", "446,00625 MHz", "Freq: 156.800 MHz NFM 12.5 kHz".
function parsePasted(q, cur) {
	const s = q.trim().toLowerCase();
	if (!s || CMD_WORD.test(s)) return { none: true };
	const modeM = /\b(nfm|wfm|am|usb|lsb|cw|fm)\b/.exec(s);
	const re = /(\d[\d\s.,']*\d|\d)\s*(ghz|mhz|khz|hz|g|m|k)?(?![a-z])/g;
	const nums = [];
	let m;
	while ((m = re.exec(s))) nums.push({ raw: m[1], unit: m[2] || '' });
	if (!nums.length) return { none: true };
	const fullUnit = /(ghz|mhz|khz|hz)/.test(s);
	const grouped = /\d[.,' ]\d{3}[.,' ]\d{3}/.test(s) || /\d \d{3}/.test(s);
	if (!modeM && !fullUnit && !grouped && nums.length === 1 && s === nums[0].raw + nums[0].unit) return { none: true };
	if (!modeM && !fullUnit && !grouped) return { none: true };
	const norm = raw => {
		let t = raw.replace(/[\s']/g, '');
		const seps = (t.match(/[.,]/g) || []).length;
		if (seps > 1) t = t.replace(/[.,]/g, '');
		else t = t.replace(',', '.');
		return t;
	};
	const first = nums[0];
	let num = norm(first.raw), unit = first.unit;
	if (!unit && /^\d{7,10}$/.test(num)) unit = 'hz';
	const p = parse(num + unit, cur);
	if (!p.f) return p.err ? p : { none: true };
	const out = { f: p.f, pasted: true };
	if (modeM) out.mode = modeM[1] === 'fm' ? 'NFM' : modeM[1].toUpperCase();
	const bwN = nums.slice(1).find(n => n.unit === 'k' || n.unit === 'khz');
	if (bwN) out.bw = Math.round(parseFloat(norm(bwN.raw)) * 1000);
	return out;
}

function fuzzy(q, text) {
	const t = text.toLowerCase();
	const at = t.indexOf(q);
	const span = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
	if (at === 0) return { score: 100 - t.length * 0.1, idx: span(0, q.length) };
	if (at > 0) return { score: (WS.test(t[at - 1]) ? 80 : 50) - at * 0.3, idx: span(at, at + q.length) };
	const qs = q.replace(/\s+/g, '');
	let i = 0, last = -2, score = 0;
	const idx = [];
	for (let j = 0; j < t.length && i < qs.length; j++) {
		if (t[j] !== qs[i]) continue;
		score += j === 0 || WS.test(t[j - 1]) ? 6 : j === last + 1 ? 3 : 0.5;
		idx.push(j); last = j; i++;
	}
	if (i < qs.length || score < qs.length * 2) return null;
	return { score: 20 + score - (idx[idx.length - 1] - idx[0]) * 0.2, idx };
}

function effects(patch, cur) {
	if (!patch) return [];
	const nxt = Object.assign({}, cur, patch), out = [], seen = {};
	const desc = (k, x) => {
		if (k === 'freq') return mfmt(x) + ' MHz';
		if (k === 'bw' || k === 'step') return kfmt(x);
		if (k === 'rate') return x + ' MS/s';
		if (k === 'vol') return x + ' %';
		if (k === 'mode') return x;
		if (OPTS[k]) return optLabel(k, x);
		if (k === 'saved') return String(x.length);
		return x ? 'On' : 'Off';
	};
	Object.keys(patch).forEach(k => {
		let key = k, a, b;
		if (k === 'gainIdx' || k === 'gainAuto') { key = 'gain'; a = gainText(cur); b = gainText(nxt); }
		else if (k === 'sq' || k === 'sqAuto') { key = 'sq'; a = sqText(cur); b = sqText(nxt); }
		else { a = desc(k, cur[k]); b = desc(k, nxt[k]); }
		if (seen[key] || a === b) return;
		seen[key] = 1;
		out.push({ key, label: LABEL[key] || key, from: a, to: b });
	});
	return out;
}

	build() {

			if (list.length) groups.push({ label, items: list, top: top === undefined ? Math.max.apply(null, list.map(x => x._score || 0)) : top });
		};

				push('Tune', it.concat(this.rank(this.tuneTargets(), q).slice(0, 6)));

		} else if (s.scope) {

		const shown = Object.assign({}, v, emb ? {} : s.preview || {});
		const changed = emb ? [] : effects(s.preview, v).map(e => e.key);
		const chip = (key, k2, val) => { const c = changed.indexOf(key) >= 0; return { k: k2, v: val, bg: c ? 'rgba(242,184,75,.12)' : 'rgba(17,28,25,.7)', border: c ? 'rgba(242,184,75,.55)' : '#22362f', fg: c ? '#f2b84b' : '#f4f7f5' }; };
		const meta = s.scope ? SCOPES[s.scope] : null;
		return {
			embedded: emb, standalone: !emb,
			rootPos: emb ? 'absolute' : 'relative', rootInset: emb ? '0' : 'auto',
			rootW: emb ? 'auto' : '760px', rootH: emb ? 'auto' : '700px', rootBg: emb ? 'transparent' : '#0b1512',
			top: emb ? '16px' : '40px',
			listMax: emb ? 'min(440px, calc(100vh - 200px))' : '384px',
			isOpen: emb || s.open, showReopen: !emb && !s.open,
			reopen: () => { this.reopened = true; this.setState({ open: true }); },
			keepFocus: this.keepFocus,
			close: () => this.close(),
			hasScope: !!meta, scopeTitle: meta ? meta.title : '',
			popScope: () => this.pop(),
			placeholder: meta ? meta.ph : 'Type a frequency, a setting, or search activity…',
			q: s.q,
			focusRef: this.focusRef,
			onQ: e => this.setQ(e.target.value),
			onKey: e => {
				const n = flat.length;
				if (e.key === 'ArrowDown') { e.preventDefault(); if (n) this.select((sel + 1) % n); }
				else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) this.select((sel - 1 + n) % n); }
				else if (e.key === 'Enter') { e.preventDefault(); this.run(cur); }
				else if (e.key === 'Tab') { e.preventDefault(); if (cur && cur.scope) this.enter(cur.scope); }
				else if (e.key === 'Backspace' && !s.q && s.scope) { e.preventDefault(); this.pop(); }
				else if (e.key === 'Escape') { e.preventDefault(); if (s.scope) this.pop(); else this.close(); }
			},
			activeId: cur ? 'wk-cmd-' + sel : '',
			groups: vg,
			empty: flat.length === 0,
			emptyText: s.scope === 'tune' ? 'Not a frequency yet. Try 161.15, 161150k, 446.00625 MHz or ch 16.' : s.scope ? 'Press Backspace to go back to all commands.' : 'Try a frequency, a talkgroup or a setting name.',
			hasEffect: eff.length > 0 || !!warn,
			effRows: eff.slice(0, 3).map(e => ({ label: e.label, from: e.from, to: e.to, hasFrom: !!e.from })),
			effPill: live ? 'Live preview' : cur && cur.patch ? 'On Enter' : 'Action',
			effPillBg: live ? 'rgba(123,236,199,.14)' : '#192b24',
			effPillFg: live ? '#7becc7' : '#b9cac1',
			hasWarn: !!warn, warn,
			hints: s.scope ? [{ k: '↑↓', t: 'move' }, { k: '↵', t: 'choose' }, { k: '⌫', t: 'back' }, { k: 'esc', t: live ? 'revert' : 'back' }] : [{ k: '↑↓', t: 'move' }, { k: '↵', t: 'run' }, { k: '⇥', t: 'open' }, { k: 'esc', t: live ? 'revert and close' : 'close' }],
			openKeys: () => this.enter('keys'),
			hasToast: !emb && !!s.toast, toastText: s.toast ? s.toast.text : '', canUndo: !!(s.toast && s.toast.prev),
			undo: () => { const t = s.toast; if (t && t.prev) this.setState({ vals: Object.assign({}, s.vals, t.prev), toast: null }); },
			strip: [
				chip('freq', 'Freq', mfmt(shown.freq)),
				chip('mode', 'Mode', shown.mode),
				chip('bw', 'BW', kfmt(shown.bw)),
				chip('gain', 'Gain', gainText(shown)),
				chip('sq', 'Squelch', sqText(shown)),
				chip('vol', 'Volume', shown.vol + ' %'),
				chip('palette', 'Waterfall', optLabel('palette', shown.palette)),
				chip('src', 'Hear', optLabel('src', shown.src))
			]
		};
	}
}
</script>
</body>
