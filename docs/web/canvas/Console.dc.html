<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WaveKit — Console shell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"D-DIN Condensed";font-weight:400;font-display:swap;src:url("/_blob/6b6b1c5cae1637ecc473a959a8d87a96") format("woff2")}
@font-face{font-family:"D-DIN Condensed";font-weight:700;font-display:swap;src:url("/_blob/2abc64ad8670fc5303395b91efc22319") format("woff2")}
@font-face{font-family:"Noto Sans";font-weight:400;font-display:swap;src:url("/_blob/fc93658bc9e76c8f71fbef44633be7ab") format("woff2")}
@font-face{font-family:"Noto Sans";font-weight:700;font-display:swap;src:url("/_blob/d96658b3edaf151ed186f81e701c06c7") format("woff2")}
body{margin:0;background:#111c19}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:2px solid #7becc7;outline-offset:2px}
.wk-nav:hover,.wk-ghost:hover{background:#192b24;color:#f4f7f5}
.wk-row:hover{background:#15241f}
@media (max-width:1100px){.wk-grid{grid-template-columns:1fr !important}}
@media (max-width:760px){.wk-rail{display:none}}
</style>
</helmet>
<div style="height: 100vh; min-height: 680px; display: flex; background: #111c19; color: #f4f7f5; font-family: 'Noto Sans', system-ui, sans-serif; overflow: hidden">

	<nav class="wk-rail" aria-label="Primary" style="width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 16px 0 14px; gap: 4px; border-right: 1px solid #22362f">
		<svg width="30" height="30" viewBox="0 0 256 256" fill="none" role="img" aria-label="WaveKit" style="color: #7becc7; margin-bottom: 22px"><path d="M28 68C72 68 34 188 78 188C112 188 94 104 128 104C162 104 144 188 178 188C222 188 184 68 228 68" stroke="currentColor" stroke-width="26" stroke-linejoin="round"></path></svg>
		<sc-for list="{{nav}}" as="item" hint-placeholder-count="5">
			<button class="wk-nav" aria-label="{{item.label}}" onClick="{{item.pick}}" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: {{item.bg}}; color: {{item.fg}}">
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{item.d}}" as="p"><path d="{{p}}"></path></sc-for></svg>
			</button>
		</sc-for>
		<div style="flex: 1"></div>
		<button class="wk-nav" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #8ba598">
			<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h11M19 18h1"></path><circle cx="14" cy="6" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
		</button>
	</nav>

	<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
		<header style="height: 60px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px 0 24px; border-bottom: 1px solid #22362f">
			<div style="display: flex; align-items: baseline; gap: 2px; font-variant-numeric: tabular-nums">
				<span style="font-size: 26px; font-weight: 700">{{fMain}}</span>
				<span style="font-size: 26px; color: #52645d; margin-left: 4px">{{fSub}}</span>
				<span style="font-size: 13px; color: #8ba598; margin-left: 8px">MHz</span>
			</div>
			<span style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(123,236,199,.12); color: #7becc7; font-size: 13px; font-weight: 700">
				<span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>{{tunedLabel}}
			</span>
			<div style="flex: 1"></div>
			<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b9cac1">
				<span style="width: 7px; height: 7px; border-radius: 50%; background: #7becc7"></span>Pi receiver
			</div>
			<button class="wk-ghost" aria-label="Commands (⌘K)" style="width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #b9cac1">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9a2 2 0 1 1 2 -2v10a2 2 0 1 1 -2 -2h10a2 2 0 1 1 -2 2v-10a2 2 0 1 1 2 2h-10"></path></svg>
			</button>
			<button aria-label="Stop receiving" style="width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #7becc7; color: #111c19">
				<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect></svg>
			</button>
		</header>

		<div style="position: relative; flex: 0 0 48%; min-height: 300px; border-bottom: 1px solid #22362f">
			<dc-import name="Spectrum" vfo="{{freq}}" on-tune="{{tune}}" show-markers="{{true}}" spec-height="{{specH}}" hint-size="100%,100%"></dc-import>
		</div>

		<div class="wk-grid" style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #22362f; overflow: auto">
			<sc-for list="{{panels}}" as="pn" hint-placeholder-count="3">
				<section style="background: #111c19; display: flex; flex-direction: column; min-height: 0">
					<header style="height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7becc7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{pn.icon}}" as="p"><path d="{{p}}"></path></sc-for></svg>
						<h2 style="margin: 0; font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase">{{pn.title}}</h2>
						<span style="color: #8ba598; font-size: 13px; font-variant-numeric: tabular-nums">{{pn.count}}</span>
						<div style="flex: 1"></div>
						<button class="wk-ghost" aria-label="Open {{pn.title}}" style="width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #8ba598">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h4v4M14 10l6 -6M8 20h-4v-4M4 20l6 -6"></path></svg>
						</button>
					</header>
					<div style="flex: 1; min-height: 0; overflow: auto; padding: 0 8px 12px">
						<sc-for list="{{pn.rows}}" as="r" hint-placeholder-count="5">
							<div class="wk-row" style="display: flex; gap: 12px; padding: 10px 12px; border-radius: 10px; align-items: flex-start">
								<span style="width: 56px; flex: none; color: #8ba598; font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 1px">{{r.t}}</span>
								<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
									<span style="font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span>
									<span style="color: #b9cac1; font-size: 13px; line-height: 1.4">{{r.b}}</span>
								</span>
								<span style="color: {{r.tagFg}}; background: {{r.tagBg}}; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap">{{r.tag}}</span>
							</div>
						</sc-for>
					</div>
				</section>
			</sc-for>
		</div>
	</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const ICON = {
	voice: ['M9 5a3 3 0 0 1 3 -3a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3a3 3 0 0 1 -3 -3V5M8 21h8M12 17v4', 'M5 10a7 7 0 0 0 14 0'],
	marine: ['M4 18l-1 -5h18l-2 4M5 13v-6h8l4 6M7 7v-4h-1', 'M2 20a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1'],
	messages: ['M4 9.5h12a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2H9l-4 3v-3H4a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2Z', 'M7 12.5h6M7 15.5h3', 'M17 3a5 5 0 0 1 5 5M17 6a2 2 0 0 1 2 2']
};
const LIVE = { tagFg: '#111c19', tagBg: '#7becc7' };
const DIM = { tagFg: '#b9cac1', tagBg: '#192b24' };
const NAMES = { 161150000: 'DMR · TG 2081', 161975000: 'AIS · channel A', 160450000: 'POCSAG', 160625000: 'NFM voice' };

class Component extends DCLogic {
	constructor(props) {
		super(props);
		this.state = { freq: 161150000, nav: 'spectrum' };
		this.tune = f => this.setState({ freq: f });
	}
	renderVals() {
		const NAV = [
			{ id: 'spectrum', label: 'Spectrum', d: ['M3 7c3 0 1.5 10 4.5 10s1.5 -7 4.5 -7s1.5 7 4.5 7s1.5 -10 4.5 -10'] },
			{ id: 'activity', label: 'Activity', d: ['M3 12h4l3 8l4 -16l3 8h4'] },
			{ id: 'map', label: 'Map', d: ['M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13', 'M9 4v13', 'M15 7v13'] },
			{ id: 'scanner', label: 'Scanner', d: ['M21 12h-8a1 1 0 1 0 -1 1v8a9 9 0 0 0 9 -9', 'M16 9a5 5 0 1 0 -7 7', 'M20.486 9a9 9 0 1 0 -11.482 11.495'] },
			{ id: 'recordings', label: 'Recordings', d: ['M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0', 'M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'] }
		];
		const s = this.state;
		const panels = [
			{ title: 'Voice', count: '1 live', icon: ICON.voice, rows: [
				{ t: 'Now', a: 'TG 2081 · radio 2081045', b: 'DMR · 161.150 · slot 1 · 0:12', tag: 'Live', ...LIVE },
				{ t: '14:02', a: 'TG 2081 · radio 2081012', b: 'DMR · 161.150 · 0:24', tag: 'DMR', ...DIM },
				{ t: '14:01', a: 'Analog transmission', b: 'NFM · 160.625 · 0:05', tag: 'NFM', ...DIM },
				{ t: '13:58', a: 'TG 2081 · radio 2081045', b: 'DMR · 161.150 · 0:09', tag: 'DMR', ...DIM },
				{ t: '13:51', a: 'TG 9 · radio 2081045', b: 'DMR · 161.150 · 0:41', tag: 'DMR', ...DIM }
			] },
			{ title: 'Messages', count: '128 today', icon: ICON.messages, rows: [
				{ t: '14:02', a: 'Capcode 1234567', b: 'Test page — system check 0412', tag: 'POCSAG', ...DIM },
				{ t: '14:00', a: 'F-HBXA · flight XK4521', b: 'Position report · FL 340 · ETA 14:47', tag: 'ACARS', ...DIM },
				{ t: '13:57', a: 'Capcode 1234560', b: '0612 44 18', tag: 'POCSAG', ...DIM },
				{ t: '13:55', a: 'F-GZTB · flight XK8801', b: 'Out of gate · fuel on board 9.2 t', tag: 'VDL2', ...DIM },
				{ t: '13:49', a: 'Capcode 1234567', b: 'Shift handover in 10 min', tag: 'POCSAG', ...DIM }
			] },
			{ title: 'Vessels', count: '14 in range', icon: ICON.marine, rows: [
				{ t: '2 s', a: 'Kerlouan', b: 'MMSI 227006760 · 11.4 kn · heading 284°', tag: 'Underway', ...DIM },
				{ t: '9 s', a: 'Belle Étoile', b: 'MMSI 228237700 · 0.1 kn · moored', tag: 'Moored', ...DIM },
				{ t: '14 s', a: 'Morgane II', b: 'MMSI 227592820 · 6.8 kn · fishing', tag: 'Fishing', ...DIM },
				{ t: '31 s', a: 'Ar Vro', b: 'MMSI 227141500 · 14.0 kn · heading 102°', tag: 'Underway', ...DIM },
				{ t: '1 min', a: 'Pilot 29', b: 'MMSI 227000290 · 18.2 kn · heading 341°', tag: 'Pilot', ...DIM }
			] }
		];
		return {
			nav: NAV.map(n => ({ ...n, bg: n.id === s.nav ? '#192b24' : 'transparent', fg: n.id === s.nav ? '#7becc7' : '#8ba598', pick: () => this.setState({ nav: n.id }) })),
			freq: s.freq,
			tune: this.tune,
			specH: 190,
			fMain: (s.freq / 1e6).toFixed(3),
			fSub: String(Math.round(s.freq % 1000)).padStart(3, '0'),
			tunedLabel: NAMES[s.freq] || 'No decoder',
			panels
		};
	}
}
</script>
</body>
</html>
