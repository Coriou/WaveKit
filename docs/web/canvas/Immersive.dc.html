<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WaveKit — Immersive shell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
body:has([data-wk-ground="paper"]:not([data-wk-theme] *)){background:#f4f0e6}
/* dock: an island rail of touch icon buttons; the active view shows its label. Board emphasis kept: off text-3, on --wk-fill + accent */
.wk-dock .wk-icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto;min-width:var(--wk-h-touch);padding:0 12px;box-sizing:border-box;font-size:var(--wk-fs-md);font-weight:700;color:var(--wk-text-3)}
.wk-dock .wk-icon-btn:hover{color:var(--wk-text)}
.wk-dock .wk-icon-btn[aria-pressed="true"]{background:var(--wk-fill);color:var(--wk-accent)}
/* .wk-tip placed above its dock button (offset 12 clears the dock's edge) */
.wk-tipw{position:relative}
.wk-tipw .wk-tip{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px);font-weight:400;opacity:0;transition:opacity var(--wk-dur-1) var(--wk-ease-out),transform var(--wk-dur-1) var(--wk-ease-out)}
.wk-tipw .wk-tip kbd{font:inherit;color:var(--wk-text-3);margin-left:2px}
.wk-tipw:hover .wk-tip,.wk-tipw:focus-visible .wk-tip{opacity:1;transform:translate(-50%,0);transition-delay:.4s}
.wk-tipw:focus-visible .wk-tip{transition-delay:0s}
/* drawer resize handle */
.wk-rs .wk-rs-bar{opacity:.4;transition:opacity var(--wk-dur-2),background var(--wk-dur-2),height var(--wk-dur-2)}
.wk-rs:hover .wk-rs-bar,.wk-rs:focus-visible .wk-rs-bar,.wk-rs[data-on="true"] .wk-rs-bar{opacity:1;background:var(--wk-accent);height:56px}
.wk-rs:focus-visible{outline-offset:-2px}
/* slots: .wk-slot holds the right drawer, .wk-paneslot its attached pane (the pane material is the kit's .wk-pane) */
.wk-paneslot{animation:wk-rise var(--wk-dur-4) var(--wk-ease-out)}
/* drawer + attached pane read as one opaque surface: the drawer's solid material takes the pane's surface,
   and the pane's board draws no material of its own (the slot's .wk-pane is the only outline) */
.wk-slot[data-pane="true"] > .sc-host > [data-wk-theme]{--wk-glass-strong:var(--wk-surface)}
.wk-paneslot-body > .sc-host > [data-wk-theme]{background:none;border:0;box-shadow:none}
@keyframes wk-tgt{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.wk-tgt{animation:wk-tgt var(--wk-dur-2) var(--wk-ease-out) both}
/* wk-explore: drawer skeleton (the web app's ui/Skeleton.tsx, styles in web/src/styles/ui.css; not in the kit yet).
   While a drawer's code or first page loads: the shape of its rows in the kit's fill, a slow wave down them (opacity
   only), a late fade-in so a fast load never flashes it, and after a second a quiet caption. */
.wk-skel{display:flex;flex-direction:column;gap:2px;animation:wk-skel-in var(--wk-dur-3) var(--wk-ease-out) 120ms both}
.wk-skel-bar{display:flex;flex-direction:column;gap:10px;padding:2px 0 10px}
.wk-skel-field{height:var(--wk-h-md);border-radius:var(--wk-r-3);background:var(--wk-fill)}
.wk-skel-chips{display:flex;gap:6px}
.wk-skel-chips span{width:64px;height:24px;border-radius:var(--wk-r-pill);background:var(--wk-fill)}
.wk-skel-chips span:nth-child(2){width:52px}
.wk-skel-chips span:nth-child(3){width:76px}
.wk-skel-caption{margin:0;padding:0 2px 6px;font-size:var(--wk-fs-xs);line-height:16px;color:var(--wk-text-4);animation:wk-skel-in var(--wk-dur-3) var(--wk-ease-out) 1s both}
.wk-skel-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 6px 0 10px;animation:wk-skel-wave 1.6s var(--wk-ease-inout) calc(var(--i, 0) * 90ms) infinite}
.wk-skel[data-shape="settings"] .wk-skel-row{min-height:56px;padding:0 4px;border-bottom:1px solid var(--wk-line-08)}
.wk-skel-tile{width:32px;height:32px;flex:none;border-radius:var(--wk-r-3);background:var(--wk-fill)}
.wk-skel-tile[data-round="true"]{border-radius:50%}
.wk-skel-lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.wk-skel-lines span{height:9px;border-radius:var(--wk-r-pill);background:var(--wk-fill)}
.wk-skel-lines span+span{height:7px;opacity:.7}
.wk-skel-end{width:34px;height:8px;flex:none;border-radius:var(--wk-r-pill);background:var(--wk-fill);opacity:.7}
.wk-skel[data-shape="settings"] .wk-skel-end{width:72px;height:24px;border-radius:var(--wk-r-3);opacity:1}
@keyframes wk-skel-in{from{opacity:0}}
@keyframes wk-skel-wave{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.wk-skel-row{animation:none}}
/* connection chip (the web app's ConnectionChip): an amber island pill; its place comes from the shell grid */
.wk-conn-chip{display:flex;align-items:center;gap:8px;height:36px;max-width:100%;box-sizing:border-box;padding:0 14px;border-radius:var(--wk-r-pill);font:inherit;font-size:var(--wk-fs-md);color:inherit;white-space:nowrap;cursor:pointer;pointer-events:auto}
@media (max-width:1100px){.wk-float{display:none}}
@media (max-width:760px){.wk-dock{display:none}.wk-src{top:84px !important}}
</style>
</helmet>
<div ref="{{refs.root}}" data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="position: relative; height: 100vh; min-height: 760px; background: var(--wk-plot-bg); color: var(--wk-text); font-family: var(--wk-font-ui); overflow: hidden">
	<dc-import name="Kit" hint-size="0px,0px" style="position: absolute"></dc-import>
	<div style="position: absolute; inset: 0">
		<dc-import name="Spectrum" on-settings="{{openSetting}}" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" vfo="{{freq}}" on-tune="{{tune}}" show-markers="{{true}}" spec-height="{{specH}}" top-inset="{{inset}}" bandwidth="{{bw}}" squelch="{{sqLine}}" palette="{{waterfall}}" step="{{step}}" on-bandwidth="{{setBw}}" sample-rate="{{rateHz}}" saved="{{savedMarks}}" discoveries="{{discs}}" discovery-tags="all" trust="ok" scan="{{specScan}}" on-scan-range="{{scanRange}}" listening="{{sigListening}}" on-signal-action="{{sigAction}}" hint-size="100%,100%"></dc-import>

		<sc-if value="{{showMap}}" hint-placeholder-val="{{false}}">
			<div style="position: absolute; inset: 0; z-index: 1">
				<dc-import name="Map" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" embedded="{{true}}" on-action="{{mapAction}}" on-settings="{{openSetting}}" hint-size="100%,100%"></dc-import>
			</div>
		</sc-if>
		<sc-if value="{{showMessages}}" hint-placeholder-val="{{false}}">
			<div style="position: absolute; inset: 0; z-index: 1; background: var(--wk-bg)">
				<dc-import name="Messages" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" variant="gallery" embedded="{{true}}" top-inset="{{msgTop}}" right-inset="{{msgRight}}" on-tune="{{tune}}" hint-size="100%,100%"></dc-import>
			</div>
		</sc-if>

		<div ref="{{refs.tuner}}" style="position: absolute; top: 16px; left: 16px; z-index: {{tunerZ}}">
			<dc-import name="Tuner" on-settings="{{openSetting}}" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" values="{{tunerVals}}" on-set="{{set}}" expanded="{{tunerOpen}}" on-toggle="{{toggleTuner}}" hold="{{hold}}" on-hold="{{scanAction}}" on-plan="{{holdPlan}}" hint-size="440px,56px"></dc-import>
		</div>

		<div ref="{{refs.rx}}" class="wk-shift" style="position: absolute; top: 16px; right: {{rxRight}}px; z-index: {{rxZ}}; transition: {{rxTr}}">
			<dc-import name="Receiver" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" values="{{rxVals}}" on-set="{{set}}" on-settings="{{openRxSettings}}" expanded="{{rxOpen}}" on-toggle="{{toggleRx}}" hint-size="300px,56px"></dc-import>
		</div>

		<sc-if value="{{dragging}}" hint-placeholder-val="{{false}}">
			<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 1; pointer-events: none">
				<sc-for list="{{targets}}" as="t" hint-placeholder-count="6">
					<div class="wk-tgt" style="position: absolute; left: {{t.dotX}}px; top: {{t.dotY}}px; width: 12px; height: 12px; margin: -6px 0 0 -6px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(var(--wk-accent-rgb),.5); background: rgba(var(--wk-accent-rgb),.12)"></div>
				</sc-for>
				<div style="position: absolute; left: 0; top: 0; width: 320px; height: {{cardH}}px; box-sizing: border-box; border-radius: var(--wk-r-5); border: 1.5px dashed rgba(var(--wk-accent-rgb),.55); background: rgba(var(--wk-accent-rgb),.05); transform: translate({{snapX}}px, {{snapY}}px); transition: transform var(--wk-dur-2) var(--wk-ease-out)"></div>
			</div>
		</sc-if>

		<sc-if value="{{showCard}}" hint-placeholder-val="{{true}}">
			<div ref="{{refs.card}}" class="wk-float wk-glide" style="position: absolute; left: 0; top: 0; width: 320px; z-index: {{cardZ}}; transform: translate({{cardX}}px, {{cardY}}px) scale({{cardScale}}); transform-origin: 50% 50%; transition: {{cardTr}}">
				<dc-import name="Tuned" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" freq="{{freq}}" on-tune="{{tune}}" on-action="{{cardAction}}" variant="floating" scan-hold="{{scanHold}}" scan-text="{{scanText}}" scan-resume="{{scanResume}}" on-scan="{{scanAction}}" watch="{{watchOn}}" on-watch="{{setWatch}}" identify-run="{{idRun}}" on-grab="{{grabCard}}" on-grab-key="{{cardKey}}" lifted="{{dragging}}" minimised="{{cardMin}}" on-minimise="{{setCardMin}}" hint-size="320px,300px"></dc-import>
			</div>
		</sc-if>

		<sc-if value="{{hasSource}}" hint-placeholder-val="{{false}}">
			<div class="wk-src wk-island" data-tone="amber" role="status" style="position: absolute; top: 22px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); z-index: 5; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; white-space: nowrap; font-size: var(--wk-fs-md); color: var(--wk-amber-soft)">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--wk-amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7c3 0 1.5 10 4.5 10s1.5 -7 4.5 -7s1.5 7 4.5 7s1.5 -10 4.5 -10"></path></svg>
				<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis"><b style="color: var(--wk-amber)">Playing capture</b> · {{sourceText}}</span>
				<button class="wk-btn" onClick="{{backToLive}}" style="flex: none; background: rgba(var(--wk-amber-rgb),.18); color: var(--wk-amber)">Back to live</button>
			</div>
		</sc-if>

		<!-- Pair this browser (2026-10-17, as the web app places it): a read-only browser on a protected core. In the top-row
		     gap between the Tuner and the Receiver, its title alone when the gap is tight, else under the top row centred in
		     the plot left of a full-height drawer; above the bottom row on a narrow window. -->
		<sc-if value="{{pairOn}}" hint-placeholder-val="{{false}}">
			<div role="status" aria-live="polite" style="position: absolute; z-index: 5; top: {{pairTop}}; bottom: {{pairBottom}}; left: {{pairLeft}}px; max-width: {{pairMaxW}}px; transform: translateX(-50%); pointer-events: none; transition: {{pairTr}}">
				<button class="wk-island wk-conn-chip" data-tone="amber" onClick="{{pair}}" title="{{pairHint}}">
					<span aria-hidden="true" style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--wk-amber)"></span>
					<b style="flex: none">Pair this browser</b>
					<sc-if value="{{pairDetail}}" hint-placeholder-val="{{true}}"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--wk-text-3)">Read-only until paired · Enter a code</span></sc-if>
				</button>
			</div>
		</sc-if>

		<div ref="{{refs.listen}}" style="position: absolute; left: 16px; bottom: 16px; z-index: {{listenZ}}">
			<dc-import name="Listen" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" values="{{listenVals}}" on-set="{{set}}" on-settings="{{openAudioSettings}}" expanded="{{listenOpen}}" on-toggle="{{toggleListen}}" direction="up" following="{{following}}" following-text="{{followingText}}" hint-size="340px,64px"></dc-import>
		</div>

		<nav ref="{{refs.dock}}" class="wk-dock wk-island" aria-label="Primary" style="position: absolute; left: {{dockX}}px; bottom: 16px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 8px; z-index: 2; transition: {{dockTr}}">
			<sc-for list="{{navViews}}" as="item" hint-placeholder-count="2">
				<button class="wk-icon-btn wk-tipw" data-size="touch" aria-label="{{item.label}}" aria-pressed="{{item.on}}" onClick="{{item.pick}}">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{item.d}}" as="p"><path d="{{p}}"></path></sc-for></svg>
					<sc-if value="{{item.showLabel}}" hint-placeholder-val="{{false}}"><span>{{item.label}}</span></sc-if>
					<sc-if value="{{item.showTip}}" hint-placeholder-val="{{true}}"><span class="wk-tip" aria-hidden="true">{{item.label}}</span></sc-if>
				</button>
			</sc-for>
			<div aria-hidden="true" style="width: 1px; height: 28px; background: var(--wk-line-14); margin: 0 4px; flex: none"></div>
			<sc-for list="{{navDrawers}}" as="item" hint-placeholder-count="3">
				<button class="wk-icon-btn wk-tipw" data-size="touch" aria-label="{{item.label}}" aria-pressed="{{item.on}}" onClick="{{item.pick}}">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{item.d}}" as="p"><path d="{{p}}"></path></sc-for></svg>
					<sc-if value="{{item.showLabel}}" hint-placeholder-val="{{false}}"><span>{{item.label}}</span></sc-if>
					<sc-if value="{{item.showTip}}" hint-placeholder-val="{{true}}"><span class="wk-tip" aria-hidden="true">{{item.label}}</span></sc-if>
				</button>
			</sc-for>
			<div aria-hidden="true" style="width: 1px; height: 28px; background: var(--wk-line-14); margin: 0 4px; flex: none"></div>
			<button class="wk-icon-btn wk-tipw" data-size="touch" onClick="{{openPal}}" aria-haspopup="dialog" aria-expanded="{{palOpen}}" aria-label="Search" aria-keyshortcuts="Meta+K">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path><path d="M21 21l-6 -6"></path></svg>
				<span class="wk-tip" aria-hidden="true">Search <kbd>· ⌘K</kbd></span>
			</button>
			<button class="wk-icon-btn wk-tipw" data-size="touch" onClick="{{toggleSettings}}" aria-pressed="{{settingsOn}}" aria-label="Settings" aria-keyshortcuts="Meta+Comma">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"></path><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path></svg>
				<span class="wk-tip" aria-hidden="true">Settings <kbd>· ⌘,</kbd></span>
			</button>
		</nav>

		<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
			<div style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 6; display: flex; white-space: nowrap"><div class="wk-toast" role="status">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--wk-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"></path></svg>
				<span>{{toastText}}</span>
				<sc-if value="{{canUndo}}" hint-placeholder-val="{{true}}">
					<button class="wk-btn" data-variant="tonal" data-size="sm" onClick="{{undo}}">Undo</button>
				</sc-if>
				<sc-if value="{{noUndo}}" hint-placeholder-val="{{false}}"><span style="width: 10px"></span></sc-if>
			</div></div>
		</sc-if>
	</div>

	<sc-if value="{{hasSource}}" hint-placeholder-val="{{false}}">
		<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(var(--wk-amber-rgb),.55), inset 0 0 90px rgba(var(--wk-amber-rgb),.10); transition: opacity var(--wk-dur-4)"></div>
	</sc-if>

	<sc-if value="{{hasDrawer}}" hint-placeholder-val="{{false}}">
		<div class="wk-slot" data-pane="{{paneSolid}}" style="position: absolute; z-index: 4; top: {{drTop}}px; bottom: {{drBottom}}px; right: 16px; left: {{drLeft}}; width: {{drWidth}}; transition: {{drTr}}">
			<sc-if value="{{showActivity}}" hint-placeholder-val="{{false}}">
				<dc-import name="Activity" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" part="drawer" pane-room="{{actPaneRoom}}" command="{{actCmd}}" mode="{{actMode}}" on-mode="{{setActMode}}" on-tune="{{tune}}" on-close="{{closeActivity}}" hint-size="100%,100%"></dc-import>
			</sc-if>
			<sc-if value="{{showRecordings}}" hint-placeholder-val="{{false}}">
				<dc-import name="Recordings" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" open-first="{{false}}" recording="{{recOn}}" recording-label="{{recLabel}}" stop-signal="{{srcStop}}" on-close="{{closeActivity}}" on-tune="{{tune}}" on-source="{{setSource}}" on-stop-recording="{{stopRec}}" on-activity="{{recActivity}}" on-storage="{{openStorage}}" hint-size="100%,100%"></dc-import>
			</sc-if>
			<sc-if value="{{showSettings}}" hint-placeholder-val="{{false}}">
				<dc-import name="Settings" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" values="{{settingsVals}}" on-set="{{set}}" on-close="{{closeActivity}}" on-action="{{settingsAction}}" target="{{settingsAt}}" hint-size="100%,100%"></dc-import>
			</sc-if>
			<sc-if value="{{showScanner}}" hint-placeholder-val="{{false}}">
				<dc-import name="Scanner" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" sweep="{{scannerSweep}}" stage="{{stage}}" on-scan="{{scanAction}}" on-tune="{{tune}}" on-identify="{{identify}}" on-close="{{closeActivity}}" on-plan="{{planScan}}" plan-open="{{paneOn}}" vfo="{{freq}}" watch="{{watchOn}}" on-watch="{{setWatch}}" hint-size="100%,100%"></dc-import>
			</sc-if>
			<sc-if value="{{showPushPlan}}" hint-placeholder-val="{{false}}">
				<dc-import name="ScanPlanner" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" layout="screen" width="{{pushW}}" state="{{plannerState}}" sweep="{{plannerSweep}}" prefill="{{scanPrefill}}" discoveries="{{discs}}" stage="{{stage}}" on-scan="{{scanAction}}" on-tune="{{tune}}" on-close="{{closePlanner}}" on-settings="{{openSetting}}" hint-size="100%,100%"></dc-import>
			</sc-if>
			<sc-if value="{{showSkel}}" hint-placeholder-val="{{false}}">
				<div class="wk-drawer" aria-busy="true" style="position: absolute; inset: 0; box-sizing: border-box; overflow: hidden">
					<header style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 10px 10px 18px">
						<h2 class="wk-h2" style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{drawerName}}</h2>
						<button class="wk-icon-btn" data-close="" onClick="{{closeActivity}}" aria-label="Close {{drawerName}}" style="color: var(--wk-text-3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6l-12 12"></path></svg></button>
					</header>
					<div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 18px 18px">
						<div class="wk-skel" data-shape="{{skelShape}}" role="status" aria-label="Loading {{drawerName}}">
							<div class="wk-skel-bar" aria-hidden="true"><span class="wk-skel-field"></span><span class="wk-skel-chips"><span></span><span></span><span></span></span></div>
							<p class="wk-skel-caption">Loading {{drawerName}}…</p>
							<sc-for list="{{skelRows}}" as="k" hint-placeholder-count="8">
								<div class="wk-skel-row" aria-hidden="true" style="--i: {{k.i}}">
									<sc-if value="{{k.tile}}" hint-placeholder-val="{{true}}"><span class="wk-skel-tile" data-round="{{k.round}}"></span></sc-if>
									<span class="wk-skel-lines"><span style="width: {{k.w1}}%"></span><span style="width: {{k.w2}}%"></span></span>
									<span class="wk-skel-end"></span>
								</div>
							</sc-for>
						</div>
					</div>
				</div>
			</sc-if>
			<sc-if value="{{drawerGrip}}" hint-placeholder-val="{{false}}">
				<div class="wk-rs" role="separator" aria-orientation="vertical" aria-label="Resize {{drawerName}}" aria-valuemin="360" aria-valuemax="640" aria-valuenow="{{drW}}" aria-valuetext="{{drW}} pixels wide" tabindex="0" data-on="{{resizing}}" onPointerDown="{{rsDown}}" onKeyDown="{{rsKey}}" onDoubleClick="{{rsReset}}" title="Drag to resize · double-click resets" style="position: absolute; left: -14px; top: 16px; bottom: 16px; width: 20px; z-index: 5; cursor: col-resize; touch-action: none; display: flex; align-items: center; justify-content: center; border-radius: 6px">
					<span class="wk-rs-bar" style="width: 4px; height: 40px; border-radius: 2px; background: rgba(var(--wk-accent-rgb),.45)"></span>
				</div>
			</sc-if>
		</div>
