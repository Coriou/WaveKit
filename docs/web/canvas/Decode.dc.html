<article data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="box-sizing: border-box; width: 100%; padding: {{cardPad}}; border-radius: 8px; background: {{cardBg}}; border: {{cardBorder}}; box-shadow: {{cardShadow}}; color: var(--wk-text); font-family: 'Noto Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; gap: 12px">
	<header style="display: flex; align-items: center; gap: 10px">
		<span style="width: 30px; height: 30px; flex: none; border-radius: 6px; background: var(--wk-fill); display: grid; place-items: center">
			<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--wk-accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{icon}}" as="p"><path d="{{p}}"></path></sc-for></svg>
		</span>
		<span style="font-family: 'D-DIN Condensed', 'Noto Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--wk-text-2)">{{m.proto}}</span>
		<sc-for list="{{badges}}" as="b" hint-placeholder-count="1">
			<span style="height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11.5px; font-weight: 700; line-height: 20px; background: {{b.bg}}; color: {{b.fg}}">{{b.label}}</span>
		</sc-for>
		<div style="flex: 1"></div>
		<span style="font-size: 12px; color: var(--wk-text-3); font-variant-numeric: tabular-nums">{{m.time}}</span>
	</header>

	<div style="display: flex; flex-direction: column; gap: 2px">
		<span style="font-family: {{titleFont}}; font-weight: 700; font-size: {{titleSize}}; line-height: 1.15; overflow-wrap: anywhere">{{m.title}}</span>
		<span style="font-size: 13px; color: var(--wk-text-3)">{{m.sub}}</span>
	</div>

	<sc-if value="{{hasText}}" hint-placeholder-val="{{false}}">
		<p style="margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--wk-well-glass); font-family: {{textFont}}; font-size: 14px; line-height: 1.5; color: var(--wk-text); white-space: pre-wrap; overflow-wrap: anywhere">{{m.text}}</p>
	</sc-if>
	<sc-if value="{{toneOnly}}" hint-placeholder-val="{{false}}">
		<span style="font-size: 13px; color: var(--wk-text-3); font-style: italic">Tone only. No message body.</span>
	</sc-if>

	<sc-if value="{{hasAudio}}" hint-placeholder-val="{{false}}">
		<div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 6px; background: var(--wk-well-glass)">
			<button onClick="{{play}}" aria-label="{{playLabel}}" style="font: inherit; cursor: pointer; width: 34px; height: 34px; flex: none; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--wk-accent); color: var(--wk-on-accent)">
				<sc-if value="{{isPlaying}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect></svg></sc-if>
				<sc-if value="{{notPlaying}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11 -7z" fill="currentColor"></path></svg></sc-if>
			</button>
			<div style="flex: 1; display: flex; align-items: center; gap: 2px; height: 28px" aria-hidden="true">
				<sc-for list="{{bars}}" as="b" hint-placeholder-count="40"><span style="flex: 1; height: {{b.h}}%; min-height: 2px; border-radius: 1px; background: {{b.c}}"></span></sc-for>
			</div>
			<span style="font-size: 12px; color: var(--wk-text-2); font-variant-numeric: tabular-nums; white-space: nowrap">{{audioTime}}</span>
		</div>
	</sc-if>
	<sc-if value="{{hasTranscript}}" hint-placeholder-val="{{false}}">
		<div style="display: flex; flex-direction: column; gap: 4px">
			<span style="font-size: 11.5px; color: var(--wk-text-3); display: flex; align-items: center; gap: 6px">
				<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h14"></path></svg>Transcript · automatic</span>
			<p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--wk-text)">“{{m.transcript}}”</p>
		</div>
	</sc-if>
	<sc-if value="{{transcribing}}" hint-placeholder-val="{{false}}">
		<span style="font-size: 12.5px; color: var(--wk-text-3)">Transcribing…</span>
	</sc-if>
	<sc-if value="{{hasAudioNote}}" hint-placeholder-val="{{false}}">
		<span style="font-size: 12.5px; color: var(--wk-text-3)">{{m.audioNote}}</span>
	</sc-if>

	<sc-if value="{{hasFields}}" hint-placeholder-val="{{true}}">
		<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 1px; border-radius: 6px; overflow: hidden; background: rgba(var(--wk-line-rgb),.08)">
			<sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
				<div style="background: var(--wk-glass-strong); padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0">
					<dt style="font-size: 11.5px; color: var(--wk-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.k}}</dt>
					<dd style="margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{f.c}}">{{f.v}}</dd>
				</div>
			</sc-for>
		</dl>
	</sc-if>

	<sc-if value="{{hasPos}}" hint-placeholder-val="{{false}}">
		<div data-wk-theme="{{wkTheme}}" data-wk-accent="{{wkAccent}}" data-wk-ground="{{wkGround}}" style="position: relative; height: 96px; border-radius: 6px; overflow: hidden; background-color: var(--wk-plot-bg); background-image: linear-gradient(rgba(var(--wk-line-rgb),.07) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--wk-line-rgb),.07) 1px, transparent 1px); background-size: 24px 24px">
			<span style="position: absolute; left: {{px}}%; top: {{py}}%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--wk-accent); box-shadow: 0 0 0 5px rgba(var(--wk-accent-rgb),.18)"></span>
			<span style="position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--wk-text-2); font-variant-numeric: tabular-nums">{{posText}}</span>
			<span style="position: absolute; right: 10px; bottom: 8px; font-size: 12px; font-weight: 700; color: var(--wk-accent)">Open on map</span>
		</div>
	</sc-if>

	<footer style="display: flex; align-items: center; gap: 4px; margin: 0 -6px -6px">
		<button onClick="{{tune}}" style="font: inherit; cursor: pointer; height: 30px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--wk-text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px">
			<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7c3 0 1.5 10 4.5 10s1.5 -7 4.5 -7s1.5 7 4.5 7s1.5 -10 4.5 -10"></path></svg>{{m.freq}} MHz
		</button>
		<div style="flex: 1"></div>
		<button onClick="{{toggleRaw}}" aria-expanded="{{showRaw}}" style="font: inherit; cursor: pointer; height: 30px; padding: 0 8px; border: 0; border-radius: 6px; background: {{rawBg}}; color: var(--wk-text-3); font-size: 12.5px">{{rawLabel}}</button>
	</footer>
	<sc-if value="{{showRaw}}" hint-placeholder-val="{{false}}">
		<dc-import name="Json" theme="{{wkTheme}}" accent="{{wkAccent}}" ground="{{wkGround}}" data="{{rawData}}" max-height="{{jsonH}}" hint-size="100%,220px"></dc-import>
	</sc-if>
</article>
</x-dc>
