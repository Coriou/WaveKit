name: wavekit

services:

  # ---------- standalone Docker application (no SDR++ dependency) ----------
  wavekit-app:
    profiles: ["app"]
    image: ${WAVEKIT_APP_IMAGE:-wavekit:local-core}
    build:
      context: .
      target: final-core
    container_name: wavekit-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WAVEKIT_CONFIG: ${WAVEKIT_APP_CONFIG:-/app/config/docker.yaml}
      WAVEKIT_API__HOST: "0.0.0.0"
      WAVEKIT_API__PORT: "9000"
      # Runtime state (API band overrides); config/ stays read-only.
      WAVEKIT_STATE_DIR: /app/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:4713:4713"
    networks: [wavekit]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
      - ./decoded_calls:/app/decoded_calls
      - ./data:/app/data
      - ./fixtures:/app/fixtures:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s

  # ---------- dev profile ----------
  sdrpp-server:
    profiles: ["dev"]
    image: wavekit:dev-sdrpp
    build:
      context: .
      target: final-sdrpp
      cache_from:
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-final-sdrpp
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-sdrpp-build
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-runtime-base
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-base-build
    container_name: wavekit-sdrpp
    ports:
      - "5259:5259"
    networks: [wavekit]
    # SDR++ server speaks its own binary protocol on 5259, not HTTP, so the
    # healthcheck verifies TCP reachability via bash's /dev/tcp rather than curl.
    # start_period accommodates SDR++'s noisy first-run config-file initialization.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5259' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  wavekit-api:
    profiles: ["dev"]
    image: wavekit:dev-core
    build:
      context: .
      target: final-core
      cache_from:
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-final-core
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-final-base
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-node-build
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-runtime-base
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-base-build
    container_name: wavekit-api
    depends_on:
      sdrpp-server:
        condition: service_healthy
    environment:
      WAVEKIT_LOG_LEVEL: debug
      NODE_ENV: development
      # Runtime state (API band overrides); config/ stays read-only.
      WAVEKIT_STATE_DIR: /app/data
    # 4713 is the RTL-TCP relay port of the shipped configs (tunerRelay.port: 4713).
    # config/default.yaml leaves the relay disabled on the schema default 1234, so a
    # config used here needs tunerRelay.enabled: true and port: 4713 to reach it.
    ports:
      - "9000:9000"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "4713:4713"
    networks: [wavekit]
    volumes:
      - ./config:/app/config:ro
      - ./logs:/var/log/wavekit
      - ./decoded_calls:/app/decoded_calls
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_add:
      - SYS_NICE
      - NET_RAW

  # ---------- prod-single-host profile ----------
  wavekit-full:
    profiles: ["prod-single-host"]
    image: ghcr.io/coriou/wavekit:latest
    container_name: wavekit
    restart: unless-stopped
    environment:
      WAVEKIT_LOG_LEVEL: info
      NODE_ENV: production
      RTL_TCP_HOST: "${RTL_TCP_HOST:-127.0.0.1}"
      RTL_TCP_PORT: "${RTL_TCP_PORT:-1234}"
      # Runtime state on a volume: Activity, scanner jobs and discoveries,
      # band plans, operator data and API band overrides.
      WAVEKIT_STATE_DIR: /app/data
    ports:
      - "9000:9000"
      - "8080:8080"
      - "5259:5259"
      - "4713:4713"
    networks: [wavekit]
    volumes:
      - wavekit-config:/app/config
      - wavekit-logs:/var/log/wavekit
      - recordings:/recordings
      - wavekit-state:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    cap_add:
      - SYS_NICE
      - NET_RAW
    security_opt:
      - "no-new-privileges:true"

  # ---------- prod-distributed profile ----------
  wavekit-sdrpp-prod:
    profiles: ["prod-distributed"]
    image: ghcr.io/coriou/wavekit:latest-sdrpp
    container_name: wavekit-sdrpp-prod
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    ports:
      - "5259:5259"
    networks: [wavekit]
    # SDR++ server speaks its own binary protocol on 5259 (not HTTP), so the
    # healthcheck verifies TCP reachability rather than HTTP.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5259' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  wavekit-core-prod:
    profiles: ["prod-distributed"]
    image: ghcr.io/coriou/wavekit:latest-core
    container_name: wavekit-core-prod
    restart: unless-stopped
    depends_on:
      wavekit-sdrpp-prod:
        condition: service_healthy
    environment:
      WAVEKIT_LOG_LEVEL: info
      NODE_ENV: production
      # Runtime state on a volume: Activity, scanner jobs and discoveries,
      # band plans, operator data and API band overrides.
      WAVEKIT_STATE_DIR: /app/data
    ports:
      - "9000:9000"
      - "8080:8080"
      - "4713:4713"
    networks: [wavekit]
    volumes:
      - wavekit-config:/app/config
      - wavekit-logs:/var/log/wavekit
      - recordings:/recordings
      - wavekit-state:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cap_add:
      - SYS_NICE
      - NET_RAW
    security_opt:
      - "no-new-privileges:true"

  # ---------- demod-test profile ----------
  demod-test:
    profiles: ["demod-test"]
    image: wavekit:dev-demod
    build:
      context: .
      target: final-demod
      cache_from:
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-final-demod
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-runtime-base
        - type=registry,ref=ghcr.io/coriou/wavekit:cache-base-build
    volumes:
      - ./debug_audio:/data/debug_audio
      - ./scripts:/scripts
      - ./output:/output
    working_dir: /workspace
    stdin_open: true
    tty: true
    networks: [wavekit]

  # ---------- protected profile (opt-in TLS reference) ----------
  # Caddy shares this service's network namespace, so the three HTTPS ports are
  # published here. Backend HTTP, raw audio TCP and the RTL-TCP relay are not.
  wavekit-protected:
    profiles: ["protected"]
    image: ${WAVEKIT_APP_IMAGE:-wavekit:local-core}
    build:
      context: .
      target: final-core
    container_name: wavekit-protected
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WAVEKIT_CONFIG: /app/config/protected-runtime.yaml
      WAVEKIT_PUBLIC_HOST: ${WAVEKIT_PUBLIC_HOST:-receiver.example}
      WAVEKIT_STATE_DIR: /app/data
      WAVEKIT_ACCESS_PRIVATE_DIRECTORY: /var/lib/wavekit/access
      WAVEKIT_API__HOST: "127.0.0.1"
      WAVEKIT_API__PORT: "9000"
      WAVEKIT_LIVE_DEMOD__HTTP_PORT: "8081"
      WAVEKIT_DIGITAL_VOICE__HTTP_PORT: "8082"
      WAVEKIT_TUNER_RELAY__ENABLED: "false"
      WAVEKIT_ACCESS__MODE: protected
      WAVEKIT_ACCESS__LISTENER_SCHEME: https
      WAVEKIT_ACCESS__EXPOSURE: tls-termination
      WAVEKIT_ACCESS__ALLOWED_AUTHORITIES__0: "${WAVEKIT_PUBLIC_HOST:-receiver.example}:9443"
      WAVEKIT_ACCESS__ALLOWED_ORIGINS__0: "https://${WAVEKIT_PUBLIC_HOST:-receiver.example}:9443"
      WAVEKIT_ACCESS__AUDIO__ANALOG__ALLOWED_AUTHORITIES__0: "${WAVEKIT_PUBLIC_HOST:-receiver.example}:9444"
      WAVEKIT_ACCESS__AUDIO__ANALOG__BIND_HOST: "127.0.0.1"
      WAVEKIT_ACCESS__AUDIO__DIGITAL__ALLOWED_AUTHORITIES__0: "${WAVEKIT_PUBLIC_HOST:-receiver.example}:9445"
      WAVEKIT_ACCESS__AUDIO__DIGITAL__BIND_HOST: "127.0.0.1"
      WAVEKIT_ACCESS__PUBLIC_ORIGINS__API: "https://${WAVEKIT_PUBLIC_HOST:-receiver.example}:9443"
      WAVEKIT_ACCESS__PUBLIC_ORIGINS__ANALOG_AUDIO: "https://${WAVEKIT_PUBLIC_HOST:-receiver.example}:9444"
      WAVEKIT_ACCESS__PUBLIC_ORIGINS__DIGITAL_AUDIO: "https://${WAVEKIT_PUBLIC_HOST:-receiver.example}:9445"
      WAVEKIT_ACCESS__HEALTH_PROBE__TARGET: "http://127.0.0.1:9000"
      WAVEKIT_ACCESS__HEALTH_PROBE__HOST: "${WAVEKIT_PUBLIC_HOST:-receiver.example}:9443"
    ports:
      - "9443:9443"
      - "9444:9444"
      - "9445:9445"
    networks: [wavekit]
    extra_hosts:
      - "${WAVEKIT_PUBLIC_HOST:-receiver.example}:127.0.0.1"
    volumes:
      - wavekit-protected-access:/var/lib/wavekit/access
      - wavekit-protected-state:/app/data
      # Public root only. The Caddy data volume (CA private keys) stays on the sidecar.
      - wavekit-protected-trust:/caddy-trust:ro
      - ./docker/caddy/protected-runtime.yaml:/app/config/protected-runtime.yaml:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/etc/s6-overlay/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 15s

  wavekit-protected-caddy:
    profiles: ["protected"]
    image: caddy:2
    container_name: wavekit-protected-caddy
    restart: unless-stopped
    depends_on:
      - wavekit-protected
    network_mode: "service:wavekit-protected"
    environment:
      WAVEKIT_PUBLIC_HOST: ${WAVEKIT_PUBLIC_HOST:-receiver.example}
    # network_mode service: shares the core's hosts file; the daemon rejects
    # extra_hosts, ports, dns and hostname here.
    # The image command would be appended to this shell. export-trust.sh starts
    # Caddy itself and ignores its arguments. It copies only root.crt to /trust.
    entrypoint: ["/bin/sh", "/etc/caddy/export-trust.sh"]
    command: ["export-trust"]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/export-trust.sh:/etc/caddy/export-trust.sh:ro
      - wavekit-protected-caddy:/data
      - wavekit-protected-trust:/trust

networks:
  wavekit:
    driver: bridge

volumes:
  wavekit-config:
  wavekit-logs:
  recordings:
  wavekit-state:
  wavekit-protected-access:
  wavekit-protected-state:
  wavekit-protected-caddy:
  wavekit-protected-trust:
