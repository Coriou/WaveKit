# =============================================================================
# WaveKit Default Configuration
# =============================================================================
#
# This file contains the default configuration for WaveKit, a TypeScript-based
# SDR stream processing framework.
#
# Configuration values can be overridden using environment variables:
#   WAVEKIT_API_HOST        - API server host (default: 0.0.0.0)
#   WAVEKIT_API_PORT        - API server port (default: 3000)
#   WAVEKIT_AUDIO_TCP_PORT  - Audio output TCP port (default: 8080)
#   WAVEKIT_AUDIO_FORMAT    - Audio format: S16LE or FLOAT32LE (default: S16LE)
#   WAVEKIT_AUDIO_SAMPLE_RATE - Audio sample rate in Hz (default: 48000)
#   WAVEKIT_LOG_LEVEL       - Log level: trace, debug, info, warn, error (default: info)
#   WAVEKIT_LOG_DIR         - Directory for log files (optional)
#
# =============================================================================

# -----------------------------------------------------------------------------
# SDR Sources
# -----------------------------------------------------------------------------
# Configure connections to SDR data sources. WaveKit supports:
#   - rtl_tcp: RTL-SDR TCP server (e.g., from Raspberry Pi)
#   - sdrpp-network: SDR++ network sink
#   - recording: Replay recorded IQ/audio files for testing
#
# Each source requires:
#   id         - Unique identifier for the source
#   type       - Source type: "rtl_tcp", "sdrpp-network", or "recording"
#   host       - Hostname or IP address (for network sources)
#   port       - TCP port number (for network sources)
#   filePath   - Path to recording file (for recording sources)
#   loop       - Whether to loop recording playback (default: false)
#   playbackSpeed - Playback speed multiplier (default: 1.0)
#   caps       - Source capabilities:
#     kind       - Data type: "audio_pcm", "iq", or "recording"
#     sampleRate - Initial sample rate in Hz (e.g., 48000). For TunerRelay sources,
#                  this may change dynamically when SDR++ adjusts the sample rate.
#     format     - Data format: "S16LE", "FLOAT32LE", "U8_IQ", or "S16_IQ"
#     channels   - Number of channels (optional, default: 1)
#     centerFreq - Center frequency in Hz for IQ sources (optional)
#     exclusive  - Whether source can only be used by one decoder (default: false)
#   stallTimeoutMs - rtl_tcp U8_IQ sources only: once a session has streamed, a
#                payload gap this long drops the (possibly half-open) connection
#                and reconnects with backoff (default: 15000; 0 disables;
#                otherwise 1000-600000). Not applied to recordings, sdrpp-network
#                or audio sources, other rtl_tcp formats, a session that has not
#                streamed yet, or while paused by local backpressure. TCP
#                keepalive (5 s) is also enabled but only detects a dead peer,
#                not a live rtlmux whose upstream dongle/rtl_tcp is gone.
#
# Example configurations:
#
# sources:
#   - id: "rtl-pi"
#     type: "rtl_tcp"
#     host: "192.168.1.100"
#     port: 1234
#     caps:
#       kind: "audio_pcm"
#       sampleRate: 48000
#       format: "S16LE"
#       exclusive: false
#
#   - id: "sdrpp-local"
#     type: "sdrpp-network"
#     host: "127.0.0.1"
#     port: 5555
#     caps:
#       kind: "audio_pcm"
#       sampleRate: 48000
#       format: "FLOAT32LE"
#       exclusive: false
#
#   - id: "test-recording"
#     type: "recording"
#     filePath: "./recordings/test.raw"
#     loop: true
#     playbackSpeed: 1.0
#     caps:
#       kind: "recording"
#       sampleRate: 48000
#       format: "S16LE"
#       exclusive: false

sources: []

# -----------------------------------------------------------------------------
# Signal Decoders
# -----------------------------------------------------------------------------
# Configure signal decoders to process audio streams. Built-in decoder types:
#
#   dsd-fme     - Digital voice (DMR, P25, YSF, D-Star, NXDN, ProVoice)
#   multimon-ng - Pager protocols (POCSAG, FLEX, EAS, DTMF)
#   rtl433      - ISM band signals (weather sensors, remotes, etc.)
#
# Decoder Integration Patterns:
#   pure_consumer   - Receives audio via stdin (dsd-fme, multimon-ng)
#   network_producer - Runs as service with network output (readsb, AIS-catcher)
#   external_sdr    - Manages own SDR hardware (acarsdec, dumpvdl2)
#
# Each decoder requires:
#   id        - Unique identifier for the decoder
#   type      - Decoder type (must be registered in the decoder registry)
#   enabled   - Whether the decoder should start automatically
#   sourceId  - Source to attach to (for pure_consumer decoders)
#   options   - Decoder-specific configuration options
#
# Sample rates: do not set options.inputSampleRate for decoders reading a
# WaveKit source. The manager injects the source's caps.sampleRate (and
# centerFreq) before every start and on every caps change; per-decoder
# defaults (2048000 or 2400000) apply only when no source caps exist. Each
# decoder reports its instance rate plan as `rateAssessment`; a decoder whose
# source rate is below its minimum (48 kHz for audio decoders, 24 kHz for
# acarsdec, the bandwidth for LoRa) is suspended instead of crash-looping and
# resumes when the rate is usable (see docs/API.md).
#
# For external SDR decoders (external_sdr pattern):
#   deviceSerial - RTL-SDR device serial number
#   frequencies  - Array of frequencies to monitor (Hz)
#   gain         - Gain setting (optional)
#   ppm          - PPM correction (optional)
#
# For network producer decoders (network_producer pattern):
#   outputHost     - Host to connect to for output
#   outputPort     - Port to connect to for output
#   outputProtocol - Protocol: "tcp" or "udp"
#
# Version pinning (for security):
#   minVersion - Minimum required decoder version
#   maxVersion - Maximum allowed decoder version
#
# Example configurations:
#
# decoders:
#   - id: "dsd-main"
#     type: "dsd-fme"
#     enabled: true
#     sourceId: "rtl-pi"
#     options:
#       mode: "auto"           # auto, dmr, p25, ysf, dstar, nxdn, provoice
#       output: "wav"          # null, wav, udp
#       wavDir: "./decoded_calls"
#       offsetHz: 0            # channel at tuned centre + offsetHz is shifted to
#                              # DC before demodulation (any audio-demod decoder:
#                              # dsd-fme, multimon-ng, direwolf)
#       callTimeoutMs: 4000    # fallback call end without any dsd-fme line; calls
#                              # normally end on the terminator (DMR TLC, P25 TDULC)
#
#   - id: "pager-decoder"
#     type: "multimon-ng"
#     enabled: true
#     sourceId: "rtl-pi"
#     options:
#       modes:
#         - "POCSAG512"
#         - "POCSAG1200"
#         - "POCSAG2400"
#         - "FLEX"
#       verbosity: 1
#
#   - id: "ism-decoder"
#     type: "rtl433"
#     enabled: false
#     sourceId: "rtl-pi"
#     options:
#       analyze: false
#       outputFormat: "json"
#       protocols: []          # Empty = all protocols
#
#   - id: "adsb-decoder"
#     type: "readsb"
#     enabled: true
#     outputHost: "127.0.0.1"
#     outputPort: 30003
#     outputProtocol: "tcp"
#     options:
#       outputFormat: "sbs"
#
#   - id: "acars-decoder"
#     type: "acarsdec"
#     enabled: true
#     deviceSerial: "00000001"
#     frequencies:
#       - 131550000
#       - 131725000
#     gain: 40
#     options:
#       outputFormat: "json"
#     minVersion: "3.7"

decoders: []

# -----------------------------------------------------------------------------
# Audio Output
# -----------------------------------------------------------------------------
# Configure the TCP server for streaming decoded audio to host-side players.
# Connect using tools like sox, ffplay, or VLC:
#
#   nc localhost 8080 | sox -t raw -r 48000 -e signed -b 16 -c 1 - -d
#   nc localhost 8080 | ffplay -f s16le -ar 48000 -ac 1 -
#
# Options:
#   tcpPort    - TCP port for audio streaming (default: 8080)
#   format     - Audio format: "S16LE" or "FLOAT32LE" (default: S16LE)
#   sampleRate - Sample rate in Hz (default: 48000)

audio:
  tcpPort: 8080
  format: "S16LE"
  sampleRate: 48000

# -----------------------------------------------------------------------------
# Tuner Relay (RTL-TCP)
# -----------------------------------------------------------------------------
# Optional RTL-TCP compatible server that exposes WaveKit's internal IQ stream
# for client tuners like SDR++. This allows a single upstream connection to
# the remote RTL-SDR while SDR++ controls the tuner locally.
#
# Options:
#   enabled       - Enable the relay (default: false)
#   host          - Bind address (default: 0.0.0.0)
#   port          - TCP port for SDR++ clients (default: 1234)
#   sourceId      - Source to expose (default: first configured source)
#   controlPolicy - "exclusive" (first client controls) or "shared"
#   maxClients    - Optional cap on number of connected clients
#   commandHistoryLimit - Number of command entries to retain (0 disables)
#   note         - Relay streams the primary source (first in `sources`)
#
# Dynamic Sample Rate:
#   When SDR++ clients connected via the relay change sample rate, WaveKit
#   automatically updates source caps and restarts affected decoders and the
#   live demodulator. No manual reconfiguration needed.
#
# Example:
# tunerRelay:
#   enabled: true
#   host: "0.0.0.0"
#   port: 1234
#   sourceId: "rtl-pi"
#   controlPolicy: "exclusive"
#   maxClients: 2
#   commandHistoryLimit: 200

tunerRelay:
  enabled: false
  host: "0.0.0.0"
  port: 1234
  commandHistoryLimit: 200

# Tuner control (API + relay). rtl_tcp cannot read back rate/center, so after a
# source reconnect the receiver may be at its own defaults:
#   reconnectPolicy: restore - re-send the last accepted tuner state (default)
#   reconnectPolicy: reset   - send nothing; reset tuner state and source caps
#                              to the configured baseline (shared/remote hosts
#                              another operator may own after an outage)
# The reset baseline is the source's configured caps (sampleRate/centerFreq)
# plus AGC/zero gain; it must mirror the receiver's startup args (Pi:
# SDR_HOST_RTL_TCP__SAMPLE_RATE, SDR_HOST_RTL_TCP__FREQUENCY and its gain mode,
# SDR_HOST_RTL_TCP__GAIN/AGC) or caps will claim values nobody commanded.
# Caps reconciliation is not readback: after a core-only restart nothing is
# written, yet rtlmux may still hold relay-set values it replays to rtl_tcp.
# Env override: WAVEKIT_TUNER__RECONNECT_POLICY=reset
tuner:
  reconnectPolicy: restore

# -----------------------------------------------------------------------------
# Live Demodulator (HTTP Audio Stream)
# -----------------------------------------------------------------------------
# Real-time IQ demodulation with an embedded HTTP audio stream.
# Useful for quick monitoring or piping into ffplay/VLC.
#
# Stream URLs:
#   http://<host>:8081/stream      raw PCM; format in the X-Audio-Format,
#                                  X-Sample-Rate and X-Channels headers
#   http://<host>:8081/stream.wav  same audio behind a streaming WAV header
#   ffplay -nodisp http://<host>:8081/stream.wav
#
# Pipeline: capture IQ -> [shift offsetHz to DC] -> channel filter/decimation
# -> squelch (channel power) -> demodulation -> gain -> limit.
#
# Example:
# liveDemod:
#   enabled: true
#   sourceId: "rtl-pi"
#   httpPort: 8081
#   modulation: "nfm"        # nfm | wfm | am | usb | lsb | dsb | cw | raw
#   bandwidth: 12500         # Hz (0 allowed only for raw)
#   squelch: 0               # channel power before demod, dBFS (-160 to 0);
#                            # 0 = open. Typical: noise -55..-65, a carrier
#                            # -10..-30, so -40 opens on real signals only
#   noiseReduction: "off"    # off | voice | noaa-apt | narrow-band
#   lowPass: 0               # Hz (0 disables)
#   highPass: 0              # Hz (0 disables)
#   gain: 2.0                 # FM: 2 puts +-5 kHz deviation at 0.8 full scale
#   deEmphasis: false
#   deEmphasisTau: 50         # microseconds (50 or 75)
#   audioFormat: "s16le"      # s16le | f32le
#   offsetHz: 0               # carrier at tuned centre + offsetHz is shifted to
#                             # DC (tune the dongle a few kHz off the carrier to
#                             # keep the receiver's DC spike out of the channel)
#   iqDcBlock: false          # deprecated, ignored (it corrupted I/Q)
#
liveDemod:
  enabled: false
  httpPort: 8081
  modulation: "nfm"
  bandwidth: 12500
  squelch: 0
  noiseReduction: "off"
  lowPass: 0
  highPass: 0
  gain: 2.0
  deEmphasis: false
  deEmphasisTau: 50
  audioFormat: "s16le"
  offsetHz: 0
  iqDcBlock: false

# -----------------------------------------------------------------------------
# API Server
# -----------------------------------------------------------------------------
# Configure the Fastify REST/WebSocket API server for control and monitoring.
#
# REST endpoints:
#   GET  /health              - Health check
#   GET  /api/status          - Full system status
#   GET  /api/sources         - List all sources
#   POST /api/sources         - Add a new source
#   DELETE /api/sources/:id   - Remove a source
#   GET  /api/decoders        - List all decoders
#   GET  /api/decoders/:id    - Get decoder status
#   POST /api/decoders/:id/start   - Start a decoder
#   POST /api/decoders/:id/stop    - Stop a decoder
#   POST /api/decoders/:id/restart - Restart a decoder
#   PATCH /api/decoders/:id   - Update decoder config
#
# WebSocket endpoint:
#   /ws - Real-time events (subscribe to: decoders, metrics, sources)
#
# Options:
#   host - Bind address (default: 0.0.0.0 for all interfaces)
#   port - HTTP port (default: 3000)

api:
  host: "0.0.0.0"
  port: 3000

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Configure structured JSON logging using Pino.
#
# Options:
#   level - Log level: trace, debug, info, warn, error (default: info)
#   dir   - Directory for log files (optional, logs to stdout if not set)
#
# Log levels (from most to least verbose):
#   trace - Very detailed debugging information
#   debug - Debugging information
#   info  - General operational information
#   warn  - Warning conditions
#   error - Error conditions

logging:
  level: "info"
  # dir: "./logs"  # Uncomment to enable file logging

# -----------------------------------------------------------------------------
# CSDR ring buffers
# -----------------------------------------------------------------------------
# Upstream CSDR keeps one shared-memory ring per pipeline stage: 80 MiB for a
# complex stage, 40 MiB for a float stage and 800 MiB for each firdecimate. The
# kernel keeps those pages resident once the stream has wrapped them. With
# boundedBuffers enabled, WaveKit's patched CSDR uses bufferElements instead,
# but only for stages that the native harness has validated:
# convert, firdecimate, fmdemod, amdemod, agc, dcblock, gain, limit and
# realpart. Others, including lowpass, deemphasis and bandpass, keep upstream
# rings. See src/decoders/csdr-buffers.ts.
# A firdecimate whose filter needs more than bufferElements
# (ceil(4/transition)+1 + decimation + 1024) keeps its 800 MiB upstream ring
# instead of failing; WaveKit logs that fallback at info level.
#
# Options:
#   boundedBuffers - false keeps upstream rings everywhere (default: true)
#   bufferElements - ring size in elements, 2048..10485760 (default: 65536)
#
# Env: WAVEKIT_CSDR__BOUNDED_BUFFERS=false, WAVEKIT_CSDR__BUFFER_ELEMENTS=65536.
# Setting the native WAVEKIT_CSDR_BUFFER_ELEMENTS on the container has no
# effect. WaveKit strips it from child shells.

csdr:
  boundedBuffers: true
  bufferElements: 65536

# -----------------------------------------------------------------------------
# Health Monitoring
# -----------------------------------------------------------------------------
# Configure decoder health monitoring. Decoders transition through health states:
#   running  - Decoder is running and producing output
#   idle     - Decoder is running but hasn't produced output recently
#              (normal when nothing is transmitting)
#   restarting - Decoder exited unexpectedly; an automatic restart is
#              scheduled (API: `nextRestartAt`)
#   faulted  - Crash loop (retries continue at the max backoff) or restart
#              limit exhausted (terminal until an explicit start)
#
# Options:
#   checkInterval - Interval between health checks in ms (default: 5000)
#   idleTimeout   - Time without output before idle state in ms (default: 30000);
#                   reported per decoder as `idleTimeoutMs` in the API
#   faultAfterFailures - Consecutive unstable runs (no output, under 30 s)
#                   before a decoder is reported faulted (default: 5)
#   bandSuspension - Suspend wanted decoders whose target frequencies are all
#                   outside the tuned window and resume them on a retune back
#                   (default: true; decoders without a known target never
#                   suspend). See docs/API.md "Band check and band suspension".
#   signalFlatThresholdDbfs - Signal-flat warning on IQ network sources
#                   (U8_IQ / S16_IQ): the subsampled IQ level (RMS of the
#                   components about zero, dBFS) must stay below this for
#                   signalFlatHoldMs before the source reports `signalFlat`
#                   (default: -40, about 1.3 LSB RMS in u8; a near-zero-gain
#                   dongle measures about -46, a normal antenna noise floor
#                   -33 or higher). Range -120..0. Clears after the same hold
#                   at threshold + 3 dB. See docs/API.md "Signal flat".
#   signalFlatHoldMs - How long the level must stay low, or recovered to
#                   clear (default: 30000; 1000-3600000)

# health:
#   checkInterval: 5000
#   idleTimeout: 30000
#   faultAfterFailures: 5
#   bandSuspension: true
#   signalFlatThresholdDbfs: -40
#   signalFlatHoldMs: 30000

# -----------------------------------------------------------------------------
# Band defaults, region and per-decoder band overrides
# -----------------------------------------------------------------------------
# Band suspension works out of the box: decoders without a configured
# frequency get a built-in band (acarsdec, dsd-fme, direwolf and rtl433 per
# region, followCenter LoRa from its Meshtastic `region` option); ADS-B, AIS
# and VDL2 keep their protocol/decoder defaults; multimon-ng stays unknown
# unless configured. A decoder started by hand (POST /api/decoders/:id/start)
# is never band-suspended. See docs/API.md "Band check and band suspension".
#
#   region   - Band plan for the regional defaults: EU, US, CA, AU, NZ, JP or
#              CN (case-insensitive; EU = CEPT / IARU Region 1, incl. UK, CH,
#              NO). Unset: guessed from TZ, the system time zone, then the
#              locale, else EU. Env: WAVEKIT_REGION.
#   stateDir - Directory for runtime state (API band overrides, file
#              decoder-band-overrides.json). Relative to the working
#              directory (default: data). Env: WAVEKIT_STATE_DIR. When it is
#              not writable, overrides apply in memory only (`persisted: false`).
#
# region: EU
# stateDir: data
#
# Per decoder, `band` corrects where the decoder is useful (admission only;
# the process arguments never change). It outranks configured frequencies
# and built-in defaults; PUT /api/decoders/:id/band outranks it field-wise.
#   rangesHz       - Absolute RF ranges [{ minHz, maxHz }]; in band when the
#                    capture centre is within the usable window of a range
#   targetsHz      - Point targets in Hz
#   region         - Region for this decoder's regional default
#   bandSuspension - false: never band-suspend this decoder (durable "pin")
#
# decoders:
#   - id: ism-433
#     type: rtl433
#     enabled: true
#     options: {}
#     band:
#       rangesHz:
#         - { minHz: 433050000, maxHz: 434790000 }
#       bandSuspension: false

# =============================================================================
# EXAMPLE: Multi-Source Setup for Decoder Expansion
# =============================================================================
# This example demonstrates a comprehensive multi-source configuration with
# various decoder types from the decoder expansion roadmap.
#
# Hardware setup:
#   - RTL-SDR #1 (serial: 00000001): Audio source for voice decoders
#   - RTL-SDR #2 (serial: 00000002): Dedicated to ADS-B (readsb)
#   - RTL-SDR #3 (serial: 00000003): Dedicated to ACARS/VDL2
#   - RTL-SDR #4 (serial: 00000004): Dedicated to AIS
#
# Uncomment and modify the sections below to enable:
#
# ---
# sources:
#   # Primary audio source from SDR++ or rtl_tcp
#   - id: "audio-main"
#     type: "sdrpp-network"
#     host: "127.0.0.1"
#     port: 5555
#     caps:
#       kind: "audio_pcm"
#       sampleRate: 48000
#       format: "FLOAT32LE"
#       exclusive: false
#
#   # Recording source for CI testing (no live SDR required)
#   - id: "test-adsb"
#     type: "recording"
#     filePath: "./tests/mocks/fixtures/adsb/beast-sample.bin"
#     loop: true
#     playbackSpeed: 1.0
#     caps:
#       kind: "recording"
#       sampleRate: 2000000
#       format: "U8_IQ"
#       exclusive: false
#
# decoders:
#   # -------------------------------------------------------------------------
#   # Voice Decoders (pure_consumer pattern - receive audio via stdin)
#   # -------------------------------------------------------------------------
#   - id: "dsd-main"
#     type: "dsd-fme"
#     enabled: true
#     sourceId: "audio-main"
#     options:
#       mode: "auto"
#       output: "wav"
#       wavDir: "./decoded_calls"
#
#   - id: "pager-decoder"
#     type: "multimon-ng"
#     enabled: true
#     sourceId: "audio-main"
#     options:
#       modes: ["POCSAG512", "POCSAG1200", "POCSAG2400", "FLEX"]
#       verbosity: 1
#
#   # -------------------------------------------------------------------------
#   # Aviation Decoders
#   # -------------------------------------------------------------------------
#   # ADS-B (network_producer pattern - connects to readsb output port)
#   - id: "adsb-decoder"
#     type: "readsb"
#     enabled: true
#     outputHost: "127.0.0.1"
#     outputPort: 30003
#     outputProtocol: "tcp"
#     options:
#       deviceSerial: "00000002"
#       outputFormat: "sbs"
#       gain: 49.6
#       lat: 37.7749
#       lon: -122.4194
#     minVersion: "3.14.1"
#
#   # ACARS (external_sdr pattern - manages own RTL-SDR)
#   - id: "acars-decoder"
#     type: "acarsdec"
#     enabled: true
#     deviceSerial: "00000003"
#     frequencies:
#       - 131550000  # Primary ACARS
#       - 131725000  # Secondary ACARS
#       - 131825000  # Additional frequency
#     gain: 40
#     options:
#       outputFormat: "json"
#     minVersion: "3.7"
#
#   # VDL2 (external_sdr pattern - shares SDR with ACARS via time-slicing)
#   - id: "vdl2-decoder"
#     type: "dumpvdl2"
#     enabled: true
#     deviceSerial: "00000003"
#     frequencies:
#       - 136650000  # VDL2 frequency 1
#       - 136700000  # VDL2 frequency 2
#       - 136975000  # VDL2 frequency 3
#     gain: 40
#     options:
#       outputFormat: "json"
#     minVersion: "2.3.0"
#
#   # -------------------------------------------------------------------------
#   # Maritime Decoders
#   # -------------------------------------------------------------------------
#   # AIS (network_producer pattern - connects to AIS-catcher output)
#   - id: "ais-decoder"
#     type: "ais-catcher"
#     enabled: true
#     outputHost: "127.0.0.1"
#     outputPort: 10110
#     outputProtocol: "udp"
#     options:
#       deviceSerial: "00000004"
#       outputFormat: "nmea"
#       gain: 33.8
#
#   # -------------------------------------------------------------------------
#   # LoRa/Meshtastic (pure_consumer pattern - shares iq source with rtl_433)
#   # NOTE: Strongly recommend a TCXO RTL-SDR (e.g. RTL-SDR Blog v3) because
#   # LoRa is narrow-band and standard crystals drift several kHz once warm.
#   # -------------------------------------------------------------------------
#   - id: "meshtastic-eu"
#     type: "lora-meshtastic"
#     enabled: true
#     sourceId: "iq-868"   # Can be shared with rtl_433 on the same 868 MHz dongle
#     options:
#       region: "EU_868"
#       preset: "LongFast"
#       frequency: 869525000       # EU_868 Meshtastic primary
#       channelKey: "AQ=="         # Default channel shorthand
#
#   # -------------------------------------------------------------------------
#   # Amateur Radio Decoders
#   # -------------------------------------------------------------------------
#   # APRS (network_producer pattern - connects to direwolf KISS port)
#   - id: "aprs-decoder"
#     type: "direwolf"
#     enabled: true
#     sourceId: "audio-main"
#     outputHost: "127.0.0.1"
#     outputPort: 8001
#     outputProtocol: "tcp"
#     options:
#       sampleRate: 48000
#       kissPort: 8001
#       callsign: "N0CALL"
#     minVersion: "1.7"
#     maxVersion: "1.7"  # Pin to 1.7 due to CVE-2025-34458 in later versions
#
# health:
#   checkInterval: 5000
#   idleTimeout: 30000
# ---
