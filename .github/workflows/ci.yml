name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Fixture composer tests (tests/unit/fixtures) run compose.py; numpy matches
      # the version the manifest sha256s were composed with.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: python -m pip install numpy==2.5.3 cryptography protobuf
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test

  channelizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @wavekit/shared build && pnpm --filter @wavekit/api-types build
      # Same toolchain as the Dockerfile's RUST_IMAGE.
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - name: Crate tests
        run: make chan-test
      - name: Build the binary
        run: make chan-build
      # The manager and the binary agree on recentring only when both are real.
      - name: Real binary under the real manager
        env:
          WAVEKIT_CHAN_BIN: ${{ github.workspace }}/native/wavekit-chan/target/release/wavekit-chan
        run: pnpm exec vitest run tests/integration/wavekit-chan-binary.test.ts tests/integration/channelizer-recenter-real-binary.test.ts
      - name: Wasm kernels
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.98.1
          cargo test --locked --manifest-path native/wavekit-frame/Cargo.toml
          cargo test --locked --manifest-path native/wavekit-nfm/Cargo.toml
          native/wavekit-frame/build.sh
          native/wavekit-nfm/build.sh
          pnpm run build
          test -s dist/spectrum-frame.wasm && test -s dist/wideband-nfm.wasm && test -s dist/spectrum-worker.js
      # The plain job runs the whole suite on the JS path; this one pins the shipped kernels to it.
      - name: Kernels against the JS reference
        env:
          WAVEKIT_REQUIRE_FRAME_WASM: "1"
          WAVEKIT_REQUIRE_NFM_WASM: "1"
          WAVEKIT_RECORDER_DSP_WASM: ${{ github.workspace }}/dist/wideband-nfm.wasm
        run: >-
          pnpm exec vitest run --maxWorkers=1
          tests/unit/core/spectrum/frame-wasm
          tests/unit/core/spectrum/pipeline-frame-linear-golden
          tests/unit/core/spectrum/pipeline-short-linear-golden
          tests/unit/core/spectrum/spectrum-worker-build
          tests/unit/core/spectrum/wasm-artefact
          tests/unit/core/spectrum/pipeline-profile
          tests/unit/core/scanner/channel
          tests/unit/core/scanner/wideband-analog
          tests/unit/core/scanner/recorder-decisions

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Fails on a broken link, and on mapped code changed without its page unless each commit
      # carries "Docs: none" or "Docs: <page>" (CONTRIBUTING.md). A first push of a branch has no
      # "before" commit and a force push may lose it: the checker then compares with the merge
      # base of origin/main, or checks HEAD's own commit when that merge base is HEAD.
      - name: Check docs
        run: node scripts/check-docs.mjs --since="${{ github.event.pull_request.base.sha || github.event.before }}" --fallback=origin/main

  docker-build:
    needs: lint-typecheck-test
    # Images are published from version tags only (a release); pull requests check the build.
    # A push to main does not build or publish images.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (PR, cache-from only)
        if: github.event_name == 'pull_request'
        uses: docker/bake-action@v5
        with:
          files: docker/bake.hcl
          targets: ci-core
          set: |-
            *.platform=linux/amd64,linux/arm64
            *.cache-to=
      - name: Build and push (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/bake-action@v5
        env:
          # bake variables come from the environment; `set` takes only target.key overrides
          CACHE_FROM_ONLY: "false"
        with:
          files: docker/bake.hcl
          targets: default
          push: true
          set: |-
            *.platform=linux/amd64,linux/arm64
